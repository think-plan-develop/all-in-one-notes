<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Database Documentation</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #f4f7fc;
        color: #222;
        overflow: hidden;
      }
      .main{
    display:flex;
    flex:1;
    width:100%;
    min-height:0;
    overflow:hidden;
}

.content{
    flex:1;
    display:flex;
    overflow:hidden;
}

.sidebar{
    width:260px;
    min-width:260px;
    flex-shrink:0;
}

iframe{
    flex:1;
    width:100%;
    height:100%;
    display:block;
}

      /* ── TOPBAR ─────────────────────────────────────────── */
.topbar {
  height: 56px;
  flex-shrink: 0;
  background:linear-gradient(135deg, #143c23 0%, #1fa74c 40%, #096930 100%);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  box-shadow: 0 5px 20px rgba(13, 92, 43, 0.25);
  z-index: 200;
  position: relative;
}
      .menu-toggle {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        width: 38px;
        height: 38px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        display: none;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
        flex-shrink: 0;
      }
      .menu-toggle:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .back-btn {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        padding: 7px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background 0.2s;
        white-space: nowrap;
      }
      .back-btn:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .topbar-title {
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        letter-spacing: 0.01em;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .topbar-title i {
        font-size: 20px;
      }

      .topbar-badge {
        background: rgba(255, 255, 255, 0.18);
        color: rgba(255, 255, 255, 0.9);
        font-size: 11px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 20px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }

      /* ── MAIN LAYOUT ────────────────────────────────────── */
      .main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ── SIDEBAR ─────────────────────────────────────────── */
      .sidebar {
        width: 260px;
        flex-shrink: 0;
        background: #fff;
        border-right: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 2px 0 12px rgba(0, 0, 0, 0.05);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 100;
      }

      .sidebar-inner {
        flex: 1;
        overflow-y: auto;
        padding: 16px 12px 24px;
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }
      .sidebar-inner::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar-inner::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }

      .sidebar-section {
        margin-bottom: 10px;
      }

      .sidebar-group-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #94a3b8;
        padding: 6px 10px 4px;
        margin-top: 10px;
      }

      .sidebar a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        color: #475569;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.1s;
        position: relative;
      }
      .sidebar a:hover {
        background: #eff6ff;
        color: #2563eb;
        transform: translateX(2px);
      }
      .sidebar a.active {
        background: linear-gradient(135deg, #eff6ff, #f5f3ff);
        color: #2563eb;
        font-weight: 600;
      }
      .sidebar a.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 20%;
        bottom: 20%;
        width: 3px;
        background: linear-gradient(180deg, #2563eb, #7c3aed);
        border-radius: 0 3px 3px 0;
      }

      /* Colored icon pill */
      .sidebar a .nav-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          transform 0.15s,
          filter 0.15s;
      }
      .sidebar a:hover .nav-icon {
        transform: scale(1.12);
        filter: brightness(1.1);
      }
      .sidebar a.active .nav-icon {
        transform: scale(1.08);
      }

      /* Tabler icon sizing inside sidebar links */
      .sidebar a i {
        font-size: 17px;
        width: 22px;
        text-align: center;
        flex-shrink: 0;
        transition:
          transform 0.15s,
          filter 0.15s;
      }
      .sidebar a:hover i {
        transform: scale(1.18);
        filter: brightness(1.15);
      }
      .sidebar a.active i {
        transform: scale(1.12);
      }

      .sidebar a .link-badge {
        margin-left: auto;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 20px;
      }
      .badge-new {
        background: #dcfce7;
        color: #15803d;
      }
      .badge-hot {
        background: #fee2e2;
        color: #b91c1c;
      }
      .badge-beta {
        background: #fef9c3;
        color: #92400e;
      }

      .sidebar-divider {
        height: 1px;
        background: #f1f5f9;
        margin: 8px 10px;
      }

      .sidebar-footer {
        padding: 14px 16px;
        border-top: 1px solid #f1f5f9;
        background: #fafafa;
      }
      .sidebar-footer p {
        font-size: 11px;
        color: #94a3b8;
        line-height: 1.5;
      }
      .sidebar-footer strong {
        color: #64748b;
      }

      /* ── OVERLAY (mobile) ───────────────────────────────── */
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 99;
        backdrop-filter: blur(2px);
      }

      /* ── IFRAME ──────────────────────────────────────────── */
      iframe {
        flex: 1;
        width: 100%;
        height: 100%;
        border: none;
        background: #f4f7fc;
      }

      /* ── MOBILE ──────────────────────────────────────────── */
      @media (max-width: 768px) {
        .menu-toggle {
          display: flex;
        }
        .topbar-badge {
          display: none;
        }

        .sidebar {
          position: fixed;
          top: 56px;
          left: 0;
          height: calc(100vh - 56px);
          transform: translateX(-100%);
          z-index: 150;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .overlay.visible {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <!-- TOPBAR -->
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <i class="ti ti-menu-2"></i>
      </button>
      <a href="../index.html" class="back-btn">
        <i class="ti ti-arrow-left"></i> Dashboard
      </a>
      <span class="topbar-title">
        <i class="ti ti-database" aria-hidden="true"></i>
        SQL &amp; Database
      </span>
      <span class="topbar-badge">Docs</span>
    </div>

    <!-- OVERLAY (mobile tap-outside to close) -->
    <div class="overlay" id="overlay"></div>

    <div class="main">
      <!-- SIDEBAR — shell only, filled by buildNav() -->
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-inner" id="sidebarInner"></div>
      </nav>

      <!-- CONTENT IFRAME -->
      <iframe
        name="contentFrame"
        id="contentFrame"
        src="note.html?data=1-sql-basics-data.js"
      ></iframe>
    </div>

    <script>
      /* ─────────────────────────────────────────────────────
     NAV CONFIG — only edit this to update the sidebar
  ───────────────────────────────────────────────────── */

const NAV_CONFIG = [
  // ─────────────────────────────────────────
  // 1. MONGODB FOUNDATIONS
  // ─────────────────────────────────────────
  {
    label: "MongoDB Foundations",
    links: [
      {
        icon: "ti-database",
        color: "#16a34a",
        text: "MongoDB Complete Guide",
        href: "note.html?data=1-mongodb-complete-guide.js",
        target: "contentFrame",
        badge: { text: "Start Here", cls: "badge-hot" },
      },
      {
        icon: "ti-database-share",
        color: "#0d9488",
        text: "SQL vs NoSQL",
        href: "note.html?data=2-sql-vs-nosql.js",
        target: "contentFrame",
      },
      {
        icon: "ti-arrows-diff",
        color: "#0891b2",
        text: "Postgres vs MongoDB",
        href: "note.html?data=3-postgres-vs-mongodb.js",
        target: "contentFrame",
      },
      {
        icon: "ti-binary",
        color: "#0369a1",
        text: "BSON Data Types",
        href: "note.html?data=4-bson-data-types.js",
        target: "contentFrame",
      },
    ],
  },

  // ─────────────────────────────────────────
  // 2. CRUD OPERATIONS
  // ─────────────────────────────────────────
  {
    label: "CRUD Operations",
    links: [
      {
        icon: "ti-file-pencil",
        color: "#2563eb",
        text: "CRUD Operations",
        href: "note.html?data=5-crud-operations.js",
        target: "contentFrame",
        badge: { text: "Core", cls: "badge-hot" },
      },
      {
        icon: "ti-list-check",
        color: "#4338ca",
        text: "CRUD Summary",
        href: "./crud-summary.html",
        target: "contentFrame",
        badge: { text: "Cheat Sheet", cls: "badge-info" },
      },
    ],
  },

  // ─────────────────────────────────────────
  // 3. QUERY OPERATORS & DATA TYPES
  // ─────────────────────────────────────────
  {
    label: "Operators & Data Types",
    links: [
      {
        icon: "ti-books",
        color: "#7c3aed",
        text: "MongoDB Operator Reference",
        href: "note.html?data=6-operators-and-data-types.js",
        target: "contentFrame",
        badge: { text: "Reference", cls: "badge-info" },
      },
      {
        icon: "ti-filter",
        color: "#9333ea",
        text: "Query Operators",
        href: "note.html?data=7-query-operators.js",
        target: "contentFrame",
        badge: { text: "Core", cls: "badge-hot" },
      },
      {
        icon: "ti-eye",
        color: "#a21caf",
        text: "Projection",
        href: "note.html?data=8-projection.js",
        target: "contentFrame",
      },
      {
        icon: "ti-arrows-sort",
        color: "#be185d",
        text: "Sorting & Pagination",
        href: "note.html?data=9-sorting-pagination.js",
        target: "contentFrame",
      },
      {
        icon: "ti-list-details",
        color: "#c026d3",
        text: "Array & Update Operators",
        href: "note.html?data=11-array-update-operators.js",
        target: "contentFrame",
        badge: { text: "Core", cls: "badge-hot" },
      },
    ],
  },

  // ─────────────────────────────────────────
  // 4. MONGOOSE (ODM LAYER)
  // ─────────────────────────────────────────
  {
    label: "Mongoose",
    links: [
      {
        icon: "ti-plug-connected",
        color: "#ea580c",
        text: "Mongoose Model Queries",
        href: "note.html?data=10-mongoose-model-queries.js",
        target: "contentFrame",
        badge: { text: "Core", cls: "badge-hot" },
      },
      {
        icon: "ti-affiliate",
        color: "#d97706",
        text: "MongoDB Relationships",
        href: "16-mongodb-relationships-notes.html",
        target: "contentFrame",
      },
    ],
  },

  // ─────────────────────────────────────────
  // 5. PERFORMANCE & SCALING
  // ─────────────────────────────────────────
  {
    label: "Performance & Scaling",
    links: [
      {
        icon: "ti-list-search",
        color: "#ca8a04",
        text: "MongoDB Indexing",
        href: "15-mongodb-indexing-notes.html",
        target: "contentFrame",
        badge: { text: "Advanced", cls: "badge-warn" },
      },
      {
        icon: "ti-copy",
        color: "#b45309",
        text: "MongoDB Replica Set",
        href: "13-mongodb-replica-set.html",
        target: "contentFrame",
        badge: { text: "Advanced", cls: "badge-warn" },
      },
      {
        icon: "ti-topology-star-3",
        color: "#9a3412",
        text: "MongoDB Sharding",
        href: "14-mongodb-sharding-notes.html",
        target: "contentFrame",
        badge: { text: "Advanced", cls: "badge-warn" },
      },
    ],
  },
];

  
      function buildNav(config) {
        const inner = document.getElementById("sidebarInner");

        const sectionsHTML = config
          .map(
            (section, i) => `
      ${i > 0 ? '<div class="sidebar-divider"></div>' : ""}
      <div class="sidebar-section">
        <div class="sidebar-group-label">${section.label}</div>
        ${section.links
          .map(
            (link) => `
          <a href="${link.href}" target="${link.target}"${link.active ? ' class="active"' : ""}>
            <span class="nav-icon" style="background:${link.color}18; color:${link.color};">
              <i class="ti ${link.icon}" aria-hidden="true"></i>
            </span>
            ${link.text}
            ${link.badge ? `<span class="link-badge ${link.badge.cls}">${link.badge.text}</span>` : ""}
          </a>
        `,
          )
          .join("")}
      </div>
    `,
          )
          .join("");

        inner.innerHTML =
          sectionsHTML +
          `
      <div class="sidebar-footer">
        <p><strong>SQL &amp; Database Docs</strong><br>Select a topic to load it in the viewer.</p>
      </div>
    `;

        /* Re-attach click listeners after DOM is built */
        inner.querySelectorAll('a[target="contentFrame"]').forEach((link) => {
          link.addEventListener("click", () => {
            inner
              .querySelectorAll("a")
              .forEach((a) => a.classList.remove("active"));
            link.classList.add("active");
            if (window.innerWidth <= 768) closeSidebar();
          });
        });
      }

      /* ─────────────────────────────────────────────────────
     MOBILE SIDEBAR TOGGLE
  ───────────────────────────────────────────────────── */
      const menuToggle = document.getElementById("menuToggle");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      function openSidebar() {
        sidebar.classList.add("open");
        overlay.classList.add("visible");
        menuToggle.innerHTML = '<i class="ti ti-x"></i>';
      }

      function closeSidebar() {
        sidebar.classList.remove("open");
        overlay.classList.remove("visible");
        menuToggle.innerHTML = '<i class="ti ti-menu-2"></i>';
      }

      menuToggle.addEventListener("click", () => {
        sidebar.classList.contains("open") ? closeSidebar() : openSidebar();
      });

      overlay.addEventListener("click", closeSidebar);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeSidebar();
      });

      /* Build nav on load */
      buildNav(NAV_CONFIG);
    </script>
  </body>
</html>
