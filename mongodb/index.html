<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Database Documentation</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ═══════════════════════════════════════════════════════
         TOKENS
         Palette — "document collection" identity:
         Deep ink navy chrome, MongoDB-leaf emerald as primary
         accent, amber as a secondary "index" accent, violet for
         highlights. Content stays light since notes render there.
      ═══════════════════════════════════════════════════════ */
      :root {
        --ink-950: #060c16;
        --ink-900: #0a1524;
        --ink-850: #0e1c30;
        --ink-800: #13253d;
        --ink-700: #1c3350;
        --line: #1f3350;
        --line-soft: #16283f;
        --emerald: #22c55e;
        --emerald-deep: #0f7a3d;
        --emerald-glow: #34e07a;
        --amber: #f5b942;
        --violet: #a78bfa;
        --text-hi: #eef4f8;
        --text-mid: #9fb3c8;
        --text-dim: #5f7891;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
        --font-sans: "Inter", system-ui, sans-serif;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        font-family: var(--font-sans);
        background: var(--ink-950);
        color: var(--text-hi);
        overflow: hidden;
      }

      .main {
        display: flex;
        flex: 1;
        width: 100%;
        min-height: 0;
        overflow: hidden;
      }

      iframe {
        flex: 1;
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: #f4f7fc;
      }

      /* ── TOPBAR — styled as a query console header ─────────── */
      .topbar {
        height: 58px;
        flex-shrink: 0;
        background:
          radial-gradient(120% 220% at 0% 0%, rgba(34, 197, 94, 0.28), transparent 55%),
          linear-gradient(135deg, var(--ink-950) 0%, var(--ink-900) 55%, var(--ink-850) 100%);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 18px;
        position: relative;
        z-index: 200;
      }
      .topbar::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(34, 197, 94, 0.65) 15%,
          rgba(167, 139, 250, 0.45) 55%,
          transparent 85%
        );
      }

      .menu-toggle {
        background: var(--ink-800);
        color: var(--text-hi);
        border: 1px solid var(--line);
        width: 36px;
        height: 36px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 17px;
        display: none;
        align-items: center;
        justify-content: center;
        transition: background 0.2s, border-color 0.2s;
        flex-shrink: 0;
      }
      .menu-toggle:hover {
        background: var(--ink-700);
        border-color: var(--emerald-deep);
      }

      .back-btn {
        background: var(--ink-800);
        color: var(--text-mid);
        border: 1px solid var(--line);
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12.5px;
        font-weight: 600;
        font-family: var(--font-mono);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        transition: background 0.2s, color 0.2s, border-color 0.2s;
        white-space: nowrap;
      }
      .back-btn:hover {
        background: var(--ink-700);
        color: var(--emerald-glow);
        border-color: var(--emerald-deep);
      }

      .topbar-title {
        font-size: 15.5px;
        font-weight: 700;
        color: var(--text-hi);
        letter-spacing: 0.01em;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .topbar-title .db-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, var(--emerald), var(--emerald-deep));
        color: #06210f;
        font-size: 16px;
        flex-shrink: 0;
        box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.35), 0 4px 14px rgba(34, 197, 94, 0.35);
      }
      .topbar-title .db-path {
        font-family: var(--font-mono);
        font-size: 13.5px;
        color: var(--text-mid);
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topbar-title .db-path .sep {
        color: var(--text-dim);
        margin: 0 3px;
      }
      .topbar-title .db-path .leaf {
        color: var(--emerald-glow);
      }
      .cursor-blink {
        display: inline-block;
        width: 7px;
        height: 15px;
        background: var(--emerald-glow);
        margin-left: 2px;
        animation: blink 1.1s steps(1) infinite;
        vertical-align: -2px;
        border-radius: 1px;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }

      .topbar-badge {
        background: rgba(245, 185, 66, 0.12);
        color: var(--amber);
        font-size: 10.5px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 20px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 1px solid rgba(245, 185, 66, 0.35);
        font-family: var(--font-mono);
        flex-shrink: 0;
      }

      /* ── SIDEBAR — a "collection browser" ───────────────────── */
      .sidebar {
        width: 274px;
        min-width: 274px;
        flex-shrink: 0;
        background: var(--ink-900);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 100;
        position: relative;
      }
      .sidebar::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(34, 197, 94, 0.05) 1px, transparent 1px);
        background-size: 16px 16px;
        opacity: 0.6;
      }

      .sidebar-inner {
        flex: 1;
        overflow-y: auto;
        padding: 18px 12px 24px;
        scrollbar-width: thin;
        scrollbar-color: var(--ink-700) transparent;
        position: relative;
      }
      .sidebar-inner::-webkit-scrollbar {
        width: 5px;
      }
      .sidebar-inner::-webkit-scrollbar-thumb {
        background: var(--ink-700);
        border-radius: 4px;
      }

      .sidebar-section {
        margin-bottom: 4px;
        border: 1px solid var(--line-soft);
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.015), transparent);
        overflow: hidden;
      }
      .sidebar-section + .sidebar-section {
        margin-top: 12px;
      }

      .sidebar-group-label {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-dim);
        padding: 12px 14px 8px;
        font-family: var(--font-mono);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .sidebar-group-label::before {
        content: "{";
        color: var(--emerald-deep);
        font-size: 13px;
        font-weight: 800;
      }
      .sidebar-group-label .count {
        margin-left: auto;
        color: var(--ink-700);
        font-weight: 600;
        background: var(--ink-800);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 1px 7px;
        font-size: 9.5px;
        color: var(--text-dim);
      }

      .sidebar a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px 9px 20px;
        text-decoration: none;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--text-mid);
        transition: background 0.15s, color 0.15s;
        position: relative;
      }
      .sidebar a::before {
        content: "";
        position: absolute;
        left: 10px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--line);
      }
      .sidebar a:hover {
        background: rgba(34, 197, 94, 0.07);
        color: var(--text-hi);
      }
      .sidebar a.active {
        background: linear-gradient(90deg, rgba(34, 197, 94, 0.14), rgba(34, 197, 94, 0.02));
        color: var(--emerald-glow);
        font-weight: 600;
      }
      .sidebar a.active::before {
        background: var(--emerald);
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.7);
      }

      .sidebar a .nav-icon {
        width: 27px;
        height: 27px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 14px;
        transition: transform 0.15s, filter 0.15s;
        border: 1px solid transparent;
      }
      .sidebar a:hover .nav-icon {
        transform: scale(1.1) rotate(-2deg);
      }
      .sidebar a.active .nav-icon {
        transform: scale(1.05);
      }

      .sidebar a .link-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }

      .sidebar a .link-badge {
        margin-left: auto;
        font-size: 9px;
        font-weight: 800;
        padding: 2px 7px;
        border-radius: 20px;
        letter-spacing: 0.03em;
        font-family: var(--font-mono);
        flex-shrink: 0;
      }
      .badge-new {
        background: rgba(34, 197, 94, 0.15);
        color: var(--emerald-glow);
      }
      .badge-hot {
        background: rgba(244, 63, 94, 0.15);
        color: #fb7185;
      }
      .badge-beta {
        background: rgba(245, 185, 66, 0.15);
        color: var(--amber);
      }
      .badge-info {
        background: rgba(167, 139, 250, 0.15);
        color: var(--violet);
      }
      .badge-warn {
        background: rgba(245, 158, 11, 0.15);
        color: #fbbf24;
      }

      .sidebar-footer {
        padding: 14px 18px;
        border-top: 1px solid var(--line);
        background: var(--ink-950);
      }
      .sidebar-footer p {
        font-size: 11px;
        color: var(--text-dim);
        line-height: 1.6;
        font-family: var(--font-mono);
      }
      .sidebar-footer strong {
        color: var(--text-mid);
      }

      /* ── OVERLAY (mobile) ────────────────────────────────────── */
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(6, 12, 22, 0.65);
        z-index: 99;
        backdrop-filter: blur(2px);
      }

      /* ── MOBILE ──────────────────────────────────────────────── */
      @media (max-width: 768px) {
        .menu-toggle {
          display: flex;
        }
        .topbar-badge {
          display: none;
        }
        .topbar-title .db-path {
          display: none;
        }

        .sidebar {
          position: fixed;
          top: 58px;
          left: 0;
          height: calc(100vh - 58px);
          transform: translateX(-100%);
          z-index: 150;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .overlay.visible {
          display: block;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cursor-blink {
          animation: none;
        }
        .sidebar a,
        .sidebar a .nav-icon {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- TOPBAR -->
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <i class="ti ti-menu-2"></i>
      </button>
      <a href="../index.html" class="back-btn">
        <i class="ti ti-arrow-left"></i> Dashboard
      </a>
      <span class="topbar-title">
        <span class="db-icon"><i class="ti ti-leaf" aria-hidden="true"></i></span>
        <span class="db-path"
          >db<span class="sep">.</span><span class="leaf">mongo_and_mongoose</span
          ><span class="cursor-blink"></span
        ></span>
      </span>
      <span class="topbar-badge">Docs</span>
    </div>

    <!-- OVERLAY (mobile tap-outside to close) -->
    <div class="overlay" id="overlay"></div>

    <div class="main">
      <!-- SIDEBAR — shell only, filled by buildNav() -->
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-inner" id="sidebarInner"></div>
      </nav>

      <!-- CONTENT IFRAME -->
      <iframe
        name="contentFrame"
        id="contentFrame"
        src="note.html?data=1-mongodb-complete-guide.js"
      ></iframe>
    </div>

    <script>
      /* ─────────────────────────────────────────────────────
     NAV CONFIG — only edit this to update the sidebar
  ───────────────────────────────────────────────────── */

const NAV_CONFIG = [
  // ─────────────────────────────────────────
  // 1. MONGODB FOUNDATIONS
  // ─────────────────────────────────────────
  {
    label: "MongoDB Foundations",
    links: [
      {
        icon: "ti-database",
        color: "#22c55e",
        text: "MongoDB Complete Guide",
        href: "note.html?data=1-mongodb-complete-guide.js",
        target: "contentFrame",
        badge: { text: "Start Here", cls: "badge-hot" },
      },
      {
        icon: "ti-database-share",
        color: "#2dd4bf",
        text: "SQL vs NoSQL",
        href: "note.html?data=2-sql-vs-nosql.js",
        target: "contentFrame",
      },
      {
        icon: "ti-arrows-diff",
        color: "#38bdf8",
        text: "Postgres vs MongoDB",
        href: "note.html?data=3-postgres-vs-mongodb.js",
        target: "contentFrame",
      },
      {
        icon: "ti-binary",
        color: "#60a5fa",
        text: "BSON Data Types",
        href: "note.html?data=4-bson-data-types.js",
        target: "contentFrame",
      },
    ],
  },

  // ─────────────────────────────────────────
  // 2. CRUD OPERATIONS
  // ─────────────────────────────────────────
  {
    label: "CRUD Operations",
    links: [
      {
        icon: "ti-file-pencil",
        color: "#818cf8",
        text: "CRUD Operations",
        href: "note.html?data=5-crud-operations.js",
        target: "contentFrame",
        badge: { text: "Core", cls: "badge-hot" },
      },
      {
        icon: "ti-list-check",
        color: "#a78bfa",
        text: "CRUD Summary",
        href: "./crud-summary.html",
        target: "contentFrame",
        badge: { text: "Cheat Sheet", cls: "badge-info" },
      },
    ],
  },

  // ─────────────────────────────────────────
  // 3. QUERY OPERATORS & DATA TYPES
  // ─────────────────────────────────────────
  {
    label: "Operators & Data Types",
    links: [
      {
        icon: "ti-books",
        color: "#c084fc",
        text: "MongoDB Operator Reference",
        href: "note.html?data=6-operators-and-data-types.js",
        target: "contentFrame",
        badge: { text: "Reference", cls: "badge-info" },
      },
      {
        icon: "ti-filter",
        color: "#e879f9",
        text: "Query Operators",
        href: "note.html?data=7-query-operators.js",
        target: "contentFrame",
        badge: { text: "Core", cls: "badge-hot" },
      },
      {
        icon: "ti-eye",
        color: "#f472b6",
        text: "Projection",
        href: "note.html?data=8-projection.js",
        target: "contentFrame",
      },
      {
        icon: "ti-arrows-sort",
        color: "#fb7185",
        text: "Sorting & Pagination",
        href: "note.html?data=9-sorting-pagination.js",
        target: "contentFrame",
      },
      {
        icon: "ti-list-details",
        color: "#f43f5e",
        text: "Array & Update Operators",
        href: "note.html?data=11-array-update-operators.js",
        target: "contentFrame",
        badge: { text: "Core", cls: "badge-hot" },
      },
    ],
  },

  // ─────────────────────────────────────────
  // 4. MONGOOSE (ODM LAYER)
  // ─────────────────────────────────────────
  {
    label: "Mongoose",
    links: [
      {
        icon: "ti-plug-connected",
        color: "#fb923c",
        text: "Mongoose Model Queries",
        href: "note.html?data=10-mongoose-model-queries.js",
        target: "contentFrame",
        badge: { text: "Core", cls: "badge-hot" },
      },
      {
        icon: "ti-affiliate",
        color: "#f59e0b",
        text: "MongoDB Relationships",
        href: "16-mongodb-relationships-notes.html",
        target: "contentFrame",
      },
    ],
  },

  // ─────────────────────────────────────────
  // 5. PERFORMANCE & SCALING
  // ─────────────────────────────────────────
  {
    label: "Performance & Scaling",
    links: [
      {
        icon: "ti-list-search",
        color: "#eab308",
        text: "MongoDB Indexing",
        href: "15-mongodb-indexing-notes.html",
        target: "contentFrame",
        badge: { text: "Advanced", cls: "badge-warn" },
      },
      {
        icon: "ti-copy",
        color: "#d97706",
        text: "MongoDB Replica Set",
        href: "13-mongodb-replica-set.html",
        target: "contentFrame",
        badge: { text: "Advanced", cls: "badge-warn" },
      },
      {
        icon: "ti-topology-star-3",
        color: "#b45309",
        text: "MongoDB Sharding",
        href: "14-mongodb-sharding-notes.html",
        target: "contentFrame",
        badge: { text: "Advanced", cls: "badge-warn" },
      },
    ],
  },
];


      function buildNav(config) {
        const inner = document.getElementById("sidebarInner");

        const sectionsHTML = config
          .map(
            (section) => `
      <div class="sidebar-section">
        <div class="sidebar-group-label">${section.label}<span class="count">${section.links.length}</span></div>
        ${section.links
          .map(
            (link) => `
          <a href="${link.href}" target="${link.target}"${link.active ? ' class="active"' : ""}>
            <span class="nav-icon" style="background:${link.color}1c; color:${link.color};">
              <i class="ti ${link.icon}" aria-hidden="true"></i>
            </span>
            <span class="link-text">${link.text}</span>
            ${link.badge ? `<span class="link-badge ${link.badge.cls}">${link.badge.text}</span>` : ""}
          </a>
        `,
          )
          .join("")}
      </div>
    `,
          )
          .join("");

        inner.innerHTML =
          sectionsHTML +
          `
      <div class="sidebar-footer">
        <p><strong>SQL &amp; Database Docs</strong><br>Select a topic to load it in the viewer.</p>
      </div>
    `;

        /* Re-attach click listeners after DOM is built */
        inner.querySelectorAll('a[target="contentFrame"]').forEach((link) => {
          link.addEventListener("click", () => {
            inner
              .querySelectorAll("a")
              .forEach((a) => a.classList.remove("active"));
            link.classList.add("active");
            if (window.innerWidth <= 768) closeSidebar();
          });
        });
      }

      /* ─────────────────────────────────────────────────────
     MOBILE SIDEBAR TOGGLE
  ───────────────────────────────────────────────────── */
      const menuToggle = document.getElementById("menuToggle");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      function openSidebar() {
        sidebar.classList.add("open");
        overlay.classList.add("visible");
        menuToggle.innerHTML = '<i class="ti ti-x"></i>';
      }

      function closeSidebar() {
        sidebar.classList.remove("open");
        overlay.classList.remove("visible");
        menuToggle.innerHTML = '<i class="ti ti-menu-2"></i>';
      }

      menuToggle.addEventListener("click", () => {
        sidebar.classList.contains("open") ? closeSidebar() : openSidebar();
      });

      overlay.addEventListener("click", closeSidebar);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeSidebar();
      });

      /* Build nav on load */
      buildNav(NAV_CONFIG);
    </script>
  </body>
</html>
