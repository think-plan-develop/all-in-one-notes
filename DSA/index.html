<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Roadmap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="floating-side-nav.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #1e293b; background: #f1f5f9; }
    button, input { font: inherit; }

    /* Needed because flex/grid display rules override the hidden attribute */
    [hidden] { display: none !important; }

    /* ── Top bar ── */
    .topbar { height: 58px; flex-shrink: 0; position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 0 18px; color: #fff; background: linear-gradient(120deg, #1e3a8a, #2563eb 55%, #0e7490); box-shadow: 0 4px 24px rgba(30, 41, 59, .22); }
    .toggle, .back { border: 1px solid rgba(255,255,255,.24); border-radius: 8px; color: #fff; background: rgba(255,255,255,.14); cursor: pointer; }
    .toggle:hover, .back:hover { background: rgba(255,255,255,.24); }
    .toggle { width: 36px; height: 36px; font-size: 18px; }
    .back { padding: 7px 14px; }
    .title { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
    .title i { font-size: 22px; }
    .search { width: min(360px, 34vw); margin: 0 auto; padding: 8px 14px; border: 0; border-radius: 20px; outline: 0; background: #fff; color: #1e293b; }
    .author { margin-left: auto; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .main { display: flex; flex: 1; min-height: 0; }

    /* ══════════ SIDEBAR (340px → 440px) ══════════ */
    .sidebar { width: 440px; min-width: 440px; padding: 16px 12px 28px; overflow-y: auto; background: #fff; border-right: 1px solid #e2e8f0; }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .sidebar h2 { margin: 2px 8px 14px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #64748b; }
    .main.sidebar-hidden .sidebar { display: none; }

    /* ── LEVEL 1 — static section heading (not clickable, always visible).
       Colours: --c main, --c2 dark, --t tint, --b border ── */
    .grp { margin: 0 0 22px; }
    .grp-head {
      display: flex; align-items: center; gap: 12px;
      margin: 0 0 10px; padding: 10px 12px;
      font-size: 15px; font-weight: 800; color: var(--c2);
      background: var(--t);
      border: 1px solid var(--b); border-left: 5px solid var(--c);
      border-radius: 4px 14px 14px 4px;
    }
    .grp:focus-visible, .sub > summary:focus-visible, .sidebar a:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
    .rng { font-size: 11px; font-weight: 700; opacity: .6; margin-left: 6px; white-space: nowrap; }

    .icon { display: grid; place-items: center; width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; color: #fff; font-size: 19px; background: linear-gradient(135deg, var(--c), var(--c2)); box-shadow: 0 3px 8px var(--b); }
    .nav-badge { margin-left: auto; min-width: 24px; text-align: center; font-size: 11px; font-weight: 800; color: var(--c2); background: var(--t); border: 1px solid var(--b); padding: 2px 8px; border-radius: 10px; }
    .grp-head .nav-badge { background: #fff; }
    .nav-chevron { font-size: 15px; color: var(--c); transition: transform .2s ease; }
    .sub[open] > summary .nav-chevron { transform: rotate(180deg); }

    /* wrapper holding the topic cards (always visible under the heading) */
    .grp > .nav-children { margin: 0 4px; display: grid; gap: 8px; }

    /* ── LEVEL 2 — topic card (always visible; click to open its links) ──
       White card with a thick section-coloured spine on the left.
       When open, the header gets a tinted band so the card reads as a "folder". */
    .sub { position: relative; border: 1px solid var(--b); border-left: 4px solid var(--c); border-radius: 4px 14px 14px 4px; background: #fff; box-shadow: 0 1px 3px rgba(15,23,42,.06); transition: box-shadow .2s, border-color .2s; }
    .sub:hover { box-shadow: 0 4px 14px var(--b); }
    .sub[open] { box-shadow: 0 8px 22px var(--b); border-color: var(--c); }
    .sub > summary { display: flex; align-items: center; gap: 10px; padding: 11px 12px 11px 10px; list-style: none; cursor: pointer; border-radius: 0 13px 0 0; color: var(--c2); }
    .sub > summary::-webkit-details-marker { display: none; }
    .sub > summary:hover { background: var(--t); }
    .sub[open] > summary { background: linear-gradient(90deg, var(--t), #fff); border-bottom: 1px solid var(--b); }
    .sub > summary .ci { display: grid; place-items: center; width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; font-size: 18px; color: #fff; background: linear-gradient(135deg, var(--c), var(--c2)); box-shadow: 0 2px 6px var(--b); }
    .sub > summary .txt { flex: 1; min-width: 0; font-size: 14px; font-weight: 750; line-height: 1.3; color: #0f172a; }
    .sub > summary .num { display: inline-block; min-width: 22px; margin-right: 4px; font-weight: 800; color: var(--c); }
    .sub > summary .nav-badge { margin-left: 0; padding: 1px 7px; background: #fff; }
    .sub > summary .nav-chevron { font-size: 14px; }

    .nav-imp { flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px; font-size: 9.5px; font-weight: 800; color: #b91c1c; background: #fee2e2; padding: 2px 7px 2px 5px; border-radius: 8px; }
    .nav-imp i { font-size: 9px; }

    /* ── LEVEL 3 — leaf links, drawn as a tree under the topic ──
       Curved elbow connectors, a kind tile, title + kind label, and a done tick.
       Each topic header also carries a thin progress bar. */
    .sub > summary { position: relative; }
    .sub > summary::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 3px; width: var(--p, 0%); background: var(--c); border-radius: 0 3px 3px 0; transition: width .3s ease; }

    .sub > .nav-children { display: grid; gap: 6px; margin: 0; padding: 12px 10px 12px 0; border-radius: 0 0 13px 0; animation: unfold .18s ease-out; }
    @keyframes unfold { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    .leaf { position: relative; display: flex; align-items: center; gap: 11px; margin-left: 40px; padding: 10px 10px 10px 12px; border-radius: 10px; border: 1px solid var(--b); background: #fff; color: var(--c2); text-decoration: none; box-shadow: inset 4px 0 0 var(--c), 0 1px 3px rgba(15,23,42,.06); transition: background .18s, border-color .18s, transform .18s, box-shadow .18s; }
    /* trunk continues down to the next sibling */
    .leaf:not(:last-child)::before { content: ""; position: absolute; left: -22px; top: 50%; bottom: -3px; border-left: 2px solid var(--b); }
    /* curved elbow from the trunk to this leaf */
    .leaf::after { content: ""; position: absolute; left: -22px; top: -3px; width: 17px; height: calc(50% + 3px); border-left: 2px solid var(--b); border-bottom: 2px solid var(--b); border-bottom-left-radius: 10px; }
    .leaf:first-child::after { top: -13px; height: calc(50% + 13px); }
    .leaf .dot { position: absolute; left: -9px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: #fff; border: 2px solid var(--c); z-index: 1; transition: background .15s, transform .15s; }

    /* number badge */
    .leaf .ci { display: grid; place-items: center; width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; font-size: 11.5px; font-weight: 800; font-style: normal; font-variant-numeric: tabular-nums; color: var(--c2); background: var(--t); border: 1.5px solid var(--b); transition: background .18s, color .18s, border-color .18s, transform .18s; }
    .leaf .body { flex: 1; min-width: 0; }
    .leaf .ttl { display: block; font-size: 13px; font-weight: 700; line-height: 1.45; color: var(--c2); letter-spacing: .005em; }

    /* kind chip: Learn / Pattern / Practice */
    .kind { flex-shrink: 0; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 8px; }
    .k-l { color: #1d4ed8; background: #dbeafe; }
    .k-p { color: #6d28d9; background: #ede9fe; }
    .k-x { color: #b45309; background: #fef3c7; }
    .leaf.done .kind { opacity: .55; }
    .leaf.active .kind { color: #fff; background: rgba(255,255,255,.22); }

    /* done tick */
    .leaf .chk { display: grid; place-items: center; flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #cbd5e1; background: #fff; color: transparent; font-size: 12px; cursor: pointer; transition: border-color .15s, background .15s, color .15s; }
    .leaf .chk:hover { border-color: var(--c); }
    .leaf.done .chk { background: var(--c); border-color: var(--c); color: #fff; }

    /* hover: soft tinted row, badge fills with the section gradient */
    .leaf:hover { background: var(--t); border-color: var(--c); box-shadow: inset 4px 0 0 var(--c), 0 4px 12px var(--b); transform: translateX(2px); }
    .leaf:hover .ci { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--c), var(--c2)); box-shadow: 0 3px 8px var(--b); }
    .leaf:hover .dot { background: var(--c); transform: scale(1.2); }

    /* done: badge solid, title muted */
    .leaf.done .ci { color: #fff; border-color: transparent; background: var(--c); opacity: .75; }
    .leaf.done { background: #f8fafc; border-color: #e2e8f0; box-shadow: inset 4px 0 0 #cbd5e1; }
    .leaf.done .ttl { color: #94a3b8; text-decoration: line-through; text-decoration-color: #cbd5e1; }

    /* active: solid section gradient */
    .leaf.active, .leaf.active:hover { color: #fff; border-color: transparent; background: linear-gradient(120deg, var(--c2), var(--c)); box-shadow: 0 6px 16px var(--b); transform: none; }
    .leaf.active .ttl { color: #fff; font-weight: 700; text-decoration: none; }
    .leaf.active .ci, .leaf.active:hover .ci { color: #fff; opacity: 1; background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.65); box-shadow: none; }
    .leaf.active .dot { background: var(--c2); border-color: #fff; transform: scale(1.25); }
    .leaf.active .chk { background: transparent; border-color: rgba(255,255,255,.65); }
    .leaf.active.done .chk { background: #fff; border-color: #fff; color: var(--c2); }

    .empty { display: none; margin: 16px 8px; font-size: 13px; color: #64748b; }

    /* ── Section colours ── */
    .t-s1 { --c:#6366f1; --c2:#3730a3; --t:#eef2ff; --b:#c7d2fe; }  /* Foundations: indigo */
    .t-s2 { --c:#10b981; --c2:#047857; --t:#ecfdf5; --b:#a7f3d0; }
    .t-s3 { --c:#f59e0b; --c2:#b45309; --t:#fffbeb; --b:#fde68a; }
    .t-s4 { --c:#8b5cf6; --c2:#5b21b6; --t:#f5f3ff; --b:#ddd6fe; }
    .t-s5 { --c:#f43f5e; --c2:#9f1239; --t:#fff1f2; --b:#fecdd3; }

    /* ── Per-topic colour overrides (applied on the topic card) ── */
    .t-green  { --c:#22c55e; --c2:#15803d; --t:#f0fdf4; --b:#bbf7d0; }  /* Time & Space Complexity */
    .t-orange { --c:#f97316; --c2:#c2410c; --t:#fff7ed; --b:#fed7aa; }  /* Arrays */

    iframe { flex: 1; min-width: 0; border: 0; background: #fff; }
    @media (max-width: 768px) {
      .sidebar { position: absolute; top: 61px; bottom: 0; left: -100%; z-index: 3; transition: transform .2s ease; box-shadow: 4px 0 24px rgba(15,23,42,.18); max-width: 92vw; min-width: 0; }
      .sidebar.open { transform: translateX(100%); }
      .search { width: 34vw; } .author { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="toggle" id="toggle" type="button" title="Toggle navigation" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="true"><i class="ti ti-menu-2"></i></button>
    <div class="title"><i class="ti ti-algorithm"></i><span>DSA Roadmap</span></div>
    <button class="back" id="back" title="Return to Dev Hub"><i class="ti ti-arrow-left"></i> Back</button>
    <input class="search" id="search" type="search" placeholder="Search DSA topics" aria-label="Search DSA topics" />
    <div class="author">Shivam</div>
  </header>
  <main class="main">
    <nav class="sidebar" id="sidebar" aria-label="DSA topics">
      <h2>DSA Preparation</h2>
      <div id="links"></div>
      <p class="empty" id="empty">No topics match your search.</p>
    </nav>
    <iframe name="contentFrame" id="contentFrame" title="DSA content"
      srcdoc="<style>body{margin:0;height:100vh;display:grid;place-items:center;font-family:Segoe UI,system-ui,sans-serif;background:#f8fafc;color:#475569}div{text-align:center;max-width:380px;padding:24px}h1{font-size:22px;color:#1e3a8a;margin:0 0 8px}p{margin:0;line-height:1.6}</style><div><h1>DSA Roadmap</h1><p>Pick a topic from the sidebar. Content pages will load here.</p></div>"></iframe>
  </main>
  <script>
    /* ─────────────────────────────────────────────────────────────
       DATA — 3 levels:  section  >  topic  >  sub-topic link
       Section: static heading (always visible)
       Topic:   T(number, icon, text, isImportant, folder, [ [kind, text], ... ], theme?)
                always visible; click to open its links
                theme (optional): a colour class such as "t-green" / "t-orange"
       Kinds:   l = learn, p = pattern, x = practice problems
       Link URL is built as  <folder>/<slug-of-text>.html
       ───────────────────────────────────────────────────────────── */
    const T = (n, icon, text, star, dir, kids, theme = "") => ({ n, icon, text, star, dir, kids, theme });

    const NAV = [
      { key: "s1", icon: "ti-school", text: "Foundations", range: "1–6", topics: [
        T(1, "ti-clock", "Time and Space Complexity", true, "01-complexity", [
          ["l", "01.01 - ⭐ What are time complexity and space complexity?"],
          ["l", "01.02 - ⭐ Understand O(1), O(log n), O(n), O(n log n) and O(n²)."],
          ["l", "01.03 - Understand O(2ⁿ) and O(n!)."],
          ["l", "01.04 - What are best-case, average-case and worst-case complexity?"],
          ["l", "01.05 - Why do we ignore constants and lower-order terms?"],
          ["p", "01.06 - ⭐ Calculate complexity of single loops and consecutive loops."],
          ["p", "01.07 - ⭐ Calculate complexity of nested loops — including different input sizes, n and m."],
          ["p", "01.08 - Calculate complexity when a loop doubles or halves its variable."],
          ["p", "01.09 - ⭐ Analyse recursive functions — execution time and call-stack space."],
          ["l", "01.10 - Distinguish input space, auxiliary space and output space."],
          ["p", "01.11 - ⭐ Compare in-place solutions with solutions using extra arrays or maps."],
          ["l", "01.12 - Understand time–space trade-offs."] ], "t-green"),
        T(2, "ti-brackets", "Arrays", true, "02-arrays", [
          ["l", "01. Find the sum and average of array elements."],
          ["l", "02. ⭐ Find the largest and smallest elements."],
          ["l", "03. ⭐ Find the second-largest distinct element."],
          ["l", "04. Find the second-smallest distinct element."],
          ["l", "05. Check whether an array is sorted."],
          ["p", "06. Insert an element at a given index."],
          ["p", "07. Delete an element at a given index."],
          ["p", "08. Rotate an array left or right by one position, using shifting."],
          ["p", "09. ⭐ Find the missing number from 1 to n, with exactly one missing."],
          ["p", "10. Find all values that appear more than once."],
          ["p", "11. ⭐ Remove duplicates from an unsorted array, preserving first occurrences."],
          ["p", "12. ⭐ Count the frequency of every element."],
          ["p", "13. Find the union and intersection of two arrays using sets."],
          ["p", "14. Generate all contiguous subarrays."],
          ["p", "15. ⭐ Find the indices of two elements whose sum equals a target — Two Sum using a map."],
          ["p", "16. ⭐ Find the majority element occurring more than n / 2 times, if one exists."],
          ["p", "17. ⭐ Find the length of the longest consecutive sequence in an unsorted array using a set."],
          ["p", "18. ⭐ Find the maximum stock profit with one buy and one sell, tracking the lowest price so far."],
          ["p", "19. Find the maximum stock profit with multiple transactions, holding at most one share at a time."],
          ["p", "20. ⭐ Find the kth-largest element, counting duplicates."] ], "t-orange"),
        T(3, "ti-letter-case", "Strings", false, "02-strings", [
          ["l", "01. ⭐ Reverse a string without using reverse()."],
          ["l", "02. ⭐ Check whether a string is a palindrome."],
          ["l", "03. Count vowels and consonants."],
          ["l", "04. Count letters, digits, spaces and special characters."],
          ["l", "05. Count words in a sentence."],
          ["p", "06. Remove leading/trailing spaces and collapse repeated spaces."],
          ["p", "07. ⭐ Reverse the order of words in a sentence."],
          ["p", "08. Reverse each word while preserving word order."],
          ["p", "09. Find the longest word in a sentence."],
          ["p", "10. ⭐ Count the frequency of every character."],
          ["p", "11. ⭐ Find the first non-repeating character."],
          ["p", "12. Find the first character encountered a second time."],
          ["p", "13. Remove duplicate characters while preserving first occurrences."],
          ["p", "14. ⭐ Check whether two strings are anagrams."],
          ["p", "15. ⭐ Find the longest common prefix among multiple strings."],
          ["p", "16. ⭐ Check whether a string is a palindrome, ignoring case and non-alphanumeric characters."],
          ["p", "17. Check whether a string can become a palindrome by deleting at most one character."],
          ["p", "18. ⭐ Check whether one string is a subsequence of another."],
          ["p", "19. ⭐ Group anagrams from an array of strings."],
          ["p", "20. Find the first occurrence of a substring without using indexOf() or includes()."],
          ["p", "21. ⭐ Find the length of the longest substring without repeating characters."],
          ["p", "22. ⭐ Find the longest palindromic substring."],
          ["p", "23. ⭐ Check whether brackets (), {} and [] are correctly balanced and nested."] ]),
        T(4, "ti-hash", "Hash Map / Hash Set", true, "03-hashing", [
          ["l", "Hashing Basics and Collisions"], ["p", "Frequency Counting"], ["p", "Two Sum and Lookup Patterns"], ["x", "Practice Problems"] ]),
        T(5, "ti-repeat", "Recursion", true, "04-recursion", [
          ["l", "Base Case and Recursive Case"], ["l", "Call Stack and Memoization Intro"], ["p", "Divide and Conquer"], ["x", "Practice Problems"] ]),
        T(6, "ti-sort-ascending", "Sorting", true, "05-sorting", [
          ["l", "Bubble, Selection and Insertion Sort"], ["l", "Merge Sort and Quick Sort"], ["p", "Custom Comparators"], ["x", "Practice Problems"] ])
      ] },

      { key: "s2", icon: "ti-brackets-contain", text: "Array Patterns", range: "7–11", topics: [
        T(7, "ti-arrows-left-right", "Two Pointers", true, "06-two-pointers", [
          ["p", "Opposite-End Pointers"], ["p", "Same-Direction (Fast and Slow) Pointers"], ["x", "Practice Problems"] ]),
        T(8, "ti-sum", "Prefix Sum", true, "07-prefix-sum", [
          ["l", "1D Prefix Sum"], ["p", "Subarray Sum with Hash Map"], ["p", "2D Prefix Sum"], ["x", "Practice Problems"] ]),
        T(9, "ti-app-window", "Sliding Window", true, "08-sliding-window", [
          ["p", "Fixed-Size Window"], ["p", "Variable-Size Window"], ["x", "Practice Problems"] ]),
        T(10, "ti-trending-up", "Kadane's Algorithm", false, "09-kadane", [
          ["l", "Maximum Subarray Sum"], ["p", "Variations (Circular, Product)"], ["x", "Practice Problems"] ]),
        T(11, "ti-search", "Binary Search", true, "10-binary-search", [
          ["l", "Classic Binary Search"], ["p", "First and Last Occurrence"], ["p", "Search on Answer"], ["x", "Practice Problems"] ])
      ] },

      { key: "s3", icon: "ti-link", text: "Linear Structures and Grids", range: "12–16", topics: [
        T(12, "ti-arrows-horizontal", "Intervals", true, "11-intervals", [
          ["p", "Merge Intervals"], ["p", "Insert and Overlap Checks"], ["p", "Meeting Rooms and Scheduling"], ["x", "Practice Problems"] ]),
        T(13, "ti-link", "Linked Lists", true, "12-linked-lists", [
          ["l", "Singly and Doubly Linked List Basics"], ["p", "Reversal and Merge"], ["p", "Fast and Slow Pointers"], ["x", "Practice Problems"] ]),
        T(14, "ti-stack-2", "Stack / Queue / Deque", true, "13-stack-queue-deque", [
          ["l", "Stack Fundamentals"], ["l", "Queue and Deque Fundamentals"], ["p", "Balanced Brackets and Expression Parsing"], ["x", "Practice Problems"] ]),
        T(15, "ti-chart-bar", "Monotonic Stack", false, "14-monotonic-stack", [
          ["p", "Next Greater / Smaller Element"], ["p", "Histogram and Stock Span Problems"], ["x", "Practice Problems"] ]),
        T(16, "ti-layout-grid", "Matrix / Grid", true, "15-matrix-grid", [
          ["l", "Traversal and Rotation"], ["p", "Spiral and Diagonal Patterns"], ["p", "Grid DFS / BFS Basics"], ["x", "Practice Problems"] ])
      ] },

      { key: "s4", icon: "ti-binary-tree", text: "Trees, Heaps and Search", range: "17–21", topics: [
        T(17, "ti-binary-tree", "Binary Trees — DFS / BFS", true, "16-binary-trees", [
          ["l", "Tree Traversals (Pre / In / Post)"], ["p", "Level-Order BFS"], ["p", "Height, Diameter and Path Problems"], ["x", "Practice Problems"] ]),
        T(18, "ti-binary-tree-2", "Binary Search Trees", true, "17-bst", [
          ["l", "BST Properties and Operations"], ["p", "Validate and Search in a BST"], ["x", "Practice Problems"] ]),
        T(19, "ti-triangle", "Heap / Priority Queue", true, "18-heap", [
          ["l", "Heap Fundamentals"], ["p", "Top-K Problems"], ["p", "Merge K Sorted and Two-Heap Pattern"], ["x", "Practice Problems"] ]),
        T(20, "ti-arrow-back-up", "Backtracking", false, "19-backtracking", [
          ["l", "Choose, Explore, Unchoose Template"], ["p", "Subsets, Permutations and Combinations"], ["p", "Constraint Problems (N-Queens, Sudoku)"], ["x", "Practice Problems"] ]),
        T(21, "ti-coin", "Greedy Algorithms", false, "20-greedy", [
          ["l", "Greedy Choice and Proof Intuition"], ["p", "Classic Greedy Patterns"], ["x", "Practice Problems"] ])
      ] },

      { key: "s5", icon: "ti-hierarchy-2", text: "Graphs, DP and Design", range: "22–26", topics: [
        T(22, "ti-hierarchy-2", "Graphs — DFS / BFS", true, "21-graphs", [
          ["l", "Graph Representations"], ["p", "DFS, BFS and Connected Components"], ["p", "Cycle Detection"], ["x", "Practice Problems"] ]),
        T(23, "ti-route", "Topological Sort", false, "22-topological-sort", [
          ["l", "Kahn's Algorithm (BFS)"], ["l", "DFS-based Ordering"], ["p", "Dependency and Scheduling Problems"], ["x", "Practice Problems"] ]),
        T(24, "ti-map-route", "Shortest Paths", false, "23-shortest-paths", [
          ["l", "BFS for Unweighted Graphs"], ["l", "Dijkstra's Algorithm"], ["l", "Bellman-Ford and Negative Weights"], ["x", "Practice Problems"] ]),
        T(25, "ti-table", "Dynamic Programming", true, "24-dynamic-programming", [
          ["l", "Memoization vs Tabulation"], ["p", "1D DP Patterns"], ["p", "2D DP and Knapsack Patterns"], ["x", "Practice Problems"] ]),
        T(26, "ti-blocks", "Data Structure Design", false, "25-ds-design", [
          ["p", "LRU Cache"], ["p", "Min Stack"], ["x", "Practice Problems"] ])
      ] }
    ];

    /* ── Rendering ── */
    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    const IMP = `<span class="nav-imp"><i class="ti ti-star-filled"></i>Imp</span>`;

    // Strip leading "01.01 - " / "01. " prefixes from the visible title (href still uses the original text)
    const cleanTitle = s => s.replace(/^\d+(?:\.\d+)?\s*[-.]\s*/, "");

    const KIND = { l: "Learn", p: "Pattern", x: "Practice" };

    const linkHTML = (t, k, i) => `
      <a class="leaf" href="${t.dir}/${slug(k[1])}.html" target="contentFrame">
        <span class="dot"></span>
        <span class="ci">${String(i + 1).padStart(2, "0")}</span>
        <span class="body"><span class="ttl">${cleanTitle(k[1])}</span></span>
        <span class="kind k-${k[0]}">${KIND[k[0]]}</span>
        <span class="chk" role="checkbox" aria-checked="false" aria-label="Mark as done" tabindex="0" title="Mark as done"><i class="ti ti-check"></i></span>
      </a>`;

    const topicHTML = t => `
      <details class="sub ${t.theme}">
        <summary>
          <i class="ti ${t.icon} ci"></i><span class="txt"><span class="num">${t.n}.</span>${t.text}</span>
          ${t.star ? IMP : ""}
          <span class="nav-badge prog">0/${t.kids.length}</span>
          <i class="ti ti-chevron-down nav-chevron"></i>
        </summary>
        <div class="nav-children">${t.kids.map((k, i) => linkHTML(t, k, i)).join("")}</div>
      </details>`;

    const countLinks = g => g.topics.reduce((n, t) => n + t.kids.length, 0);

    const links = document.getElementById("links");
    links.innerHTML = NAV.map(g => `
      <section class="grp t-${g.key}">
        <h3 class="grp-head">
          <span class="icon"><i class="ti ${g.icon}"></i></span>
          <span>${g.text}<span class="rng">#${g.range}</span></span>
          <span class="nav-badge">${countLinks(g)}</span>
        </h3>
        <div class="nav-children">${g.topics.map(topicHTML).join("")}</div>
      </section>`).join("");

    const groups = [...links.querySelectorAll(".grp")];
    const allLinks = [...links.querySelectorAll("a")];
    const sidebar = document.getElementById("sidebar");
    const main = document.querySelector(".main");
    const toggle = document.getElementById("toggle");
    const mobileLayout = window.matchMedia("(max-width: 768px)");

    function updateToggleState() {
      const expanded = mobileLayout.matches
        ? sidebar.classList.contains("open")
        : !main.classList.contains("sidebar-hidden");
      toggle.setAttribute("aria-expanded", String(expanded));
    }

    function activate(link) {
      allLinks.forEach(a => a.classList.remove("active"));
      link.classList.add("active");
      link.closest(".sub").open = true;
      sidebar.classList.remove("open");
      updateToggleState();
    }
    allLinks.forEach(l => l.addEventListener("click", () => activate(l)));

    /* ── Done tracking (saved in this browser) ── */
    let done = new Set();
    try { done = new Set(JSON.parse(localStorage.getItem("dsaDone") || "[]")); } catch (e) {}
    const saveDone = () => { try { localStorage.setItem("dsaDone", JSON.stringify([...done])); } catch (e) {} };

    function refreshTopic(sub) {
      const ls = [...sub.querySelectorAll("a.leaf")];
      const d = ls.filter(a => done.has(a.getAttribute("href"))).length;
      sub.querySelector(".prog").textContent = d + "/" + ls.length;
      sub.querySelector(":scope > summary").style.setProperty("--p", (d / ls.length * 100) + "%");
    }
    function paint(a) {
      const on = done.has(a.getAttribute("href"));
      a.classList.toggle("done", on);
      a.querySelector(".chk").setAttribute("aria-checked", on);
    }
    function toggleDone(a) {
      const h = a.getAttribute("href");
      done.has(h) ? done.delete(h) : done.add(h);
      saveDone(); paint(a); refreshTopic(a.closest(".sub"));
    }
    allLinks.forEach(a => {
      paint(a);
      const chk = a.querySelector(".chk");
      chk.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); toggleDone(a); });
      chk.addEventListener("keydown", e => {
        if (e.key === " " || e.key === "Enter") { e.preventDefault(); e.stopPropagation(); toggleDone(a); }
      });
    });
    links.querySelectorAll(".sub").forEach(refreshTopic);

    // Start with the first topic expanded (sections are static headings)
    groups[0].querySelector(".sub").open = true;

    toggle.addEventListener("click", () => {
      if (mobileLayout.matches) {
        sidebar.classList.toggle("open");
      } else {
        main.classList.toggle("sidebar-hidden");
      }
      updateToggleState();
    });
    mobileLayout.addEventListener("change", updateToggleState);
    updateToggleState();
    document.getElementById("back").addEventListener("click", () => { window.location.href = "../index.html"; });

    // Search: matches section names, topic names ("imp" lists the important topics) and links.
    document.getElementById("search").addEventListener("input", e => {
      const q = e.target.value.trim().toLowerCase();
      let any = false;
      groups.forEach(g => {
        const gHit = g.querySelector(":scope > .grp-head").textContent.toLowerCase().includes(q);
        let hits = 0;
        g.querySelectorAll(".sub").forEach(s => {
          const sHit = s.querySelector(":scope > summary").textContent.toLowerCase().includes(q);
          let sh = 0;
          s.querySelectorAll("a").forEach(a => {
            const show = !q || gHit || sHit || a.textContent.toLowerCase().includes(q);
            a.hidden = !show;
            if (show) sh++;
          });
          s.hidden = sh === 0;
          if (q && sh) s.open = true;
          hits += sh;
        });
        g.hidden = hits === 0;
        if (hits) any = true;
      });
      document.getElementById("empty").style.display = any ? "none" : "block";
    });
  </script>
</body>
</html>
