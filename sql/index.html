<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Database Documentation</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #f4f7fc;
        color: #222;
        overflow: hidden;
      }

      /* ── TOPBAR ─────────────────────────────────────────── */
      .topbar {
        height: 56px;
        flex-shrink: 0;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
        z-index: 200;
        position: relative;
      }

      .menu-toggle {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        width: 38px;
        height: 38px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        display: none;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
        flex-shrink: 0;
      }
      .menu-toggle:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .back-btn {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        padding: 7px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background 0.2s;
        white-space: nowrap;
      }
      .back-btn:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .topbar-title {
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        letter-spacing: 0.01em;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .topbar-title i {
        font-size: 20px;
      }

      .topbar-badge {
        background: rgba(255, 255, 255, 0.18);
        color: rgba(255, 255, 255, 0.9);
        font-size: 11px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 20px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }

      /* ── MAIN LAYOUT ────────────────────────────────────── */
      .main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ── SIDEBAR ─────────────────────────────────────────── */
      .sidebar {
        width: 260px;
        flex-shrink: 0;
        background: #fff;
        border-right: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 2px 0 12px rgba(0, 0, 0, 0.05);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 100;
      }

      .sidebar-inner {
        flex: 1;
        overflow-y: auto;
        padding: 16px 12px 24px;
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }
      .sidebar-inner::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar-inner::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }

      .sidebar-section {
        margin-bottom: 10px;
      }

      .sidebar-group-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #94a3b8;
        padding: 6px 10px 4px;
        margin-top: 10px;
      }

      .sidebar a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        color: #475569;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.1s;
        position: relative;
      }
      .sidebar a:hover {
        background: #eff6ff;
        color: #2563eb;
        transform: translateX(2px);
      }
      .sidebar a.active {
        background: linear-gradient(135deg, #eff6ff, #f5f3ff);
        color: #2563eb;
        font-weight: 600;
      }
      .sidebar a.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 20%;
        bottom: 20%;
        width: 3px;
        background: linear-gradient(180deg, #2563eb, #7c3aed);
        border-radius: 0 3px 3px 0;
      }

      /* Colored icon pill */
      .sidebar a .nav-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          transform 0.15s,
          filter 0.15s;
      }
      .sidebar a:hover .nav-icon {
        transform: scale(1.12);
        filter: brightness(1.1);
      }
      .sidebar a.active .nav-icon {
        transform: scale(1.08);
      }

      /* Tabler icon sizing inside sidebar links */
      .sidebar a i {
        font-size: 17px;
        width: 22px;
        text-align: center;
        flex-shrink: 0;
        transition:
          transform 0.15s,
          filter 0.15s;
      }
      .sidebar a:hover i {
        transform: scale(1.18);
        filter: brightness(1.15);
      }
      .sidebar a.active i {
        transform: scale(1.12);
      }

      .sidebar a .link-badge {
        margin-left: auto;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 20px;
      }
      .badge-new {
        background: #dcfce7;
        color: #15803d;
      }
      .badge-hot {
        background: #fee2e2;
        color: #b91c1c;
      }
      .badge-beta {
        background: #fef9c3;
        color: #92400e;
      }

      .sidebar-divider {
        height: 1px;
        background: #f1f5f9;
        margin: 8px 10px;
      }

      .sidebar-footer {
        padding: 14px 16px;
        border-top: 1px solid #f1f5f9;
        background: #fafafa;
      }
      .sidebar-footer p {
        font-size: 11px;
        color: #94a3b8;
        line-height: 1.5;
      }
      .sidebar-footer strong {
        color: #64748b;
      }

      /* ── OVERLAY (mobile) ───────────────────────────────── */
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 99;
        backdrop-filter: blur(2px);
      }

      /* ── IFRAME ──────────────────────────────────────────── */
      iframe {
        flex: 1;
        width: 100%;
        height: 100%;
        border: none;
        background: #f4f7fc;
      }

      /* ── MOBILE ──────────────────────────────────────────── */
      @media (max-width: 768px) {
        .menu-toggle {
          display: flex;
        }
        .topbar-badge {
          display: none;
        }

        .sidebar {
          position: fixed;
          top: 56px;
          left: 0;
          height: calc(100vh - 56px);
          transform: translateX(-100%);
          z-index: 150;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .overlay.visible {
          display: block;
        }
      }
    </style>
  </head>
  <body>

      <span class="topbar-title">

        SQL &amp; Database

      <span class="topbar-badge">Docs</span>
    </div>

    <!-- OVERLAY (mobile tap-outside to close) -->
    <div class="overlay" id="overlay"></div>

    <div class="main">
      <!-- SIDEBAR — shell only, filled by buildNav() -->
      <nav class="sidebar" id="sidebar">

      <!-- CONTENT IFRAME -->

      /* ─────────────────────────────────────────────────────
     RENDERER — don't touch this
  ───────────────────────────────────────────────────── */
      function buildNav(config) {
        const inner = document.getElementById("sidebarInner");

        const sectionsHTML = config
          .map(
            (section, i) => `
      ${i > 0 ? '<div class="sidebar-divider"></div>' : ""}
      <div class="sidebar-section">
        <div class="sidebar-group-label">${section.label}</div>
        ${section.links
          .map(
            (link) => `
          <a href="${link.href}" target="${link.target}"${link.active ? ' class="active"' : ""}>
            <span class="nav-icon" style="background:${link.color}18; color:${link.color};">
              <i class="ti ${link.icon}" aria-hidden="true"></i>
            </span>
            ${link.text}
            ${link.badge ? `<span class="link-badge ${link.badge.cls}">${link.badge.text}</span>` : ""}
          </a>
        `,
          )
          .join("")}
      </div>
    `,
          )
          .join("");

        inner.innerHTML =
          sectionsHTML +
          `
      <div class="sidebar-footer">
        <p><strong>SQL &amp; Database Docs</strong><br>Select a topic to load it in the viewer.</p>
      </div>
    `;

        /* Re-attach click listeners after DOM is built */
        inner.querySelectorAll('a[target="contentFrame"]').forEach((link) => {
          link.addEventListener("click", () => {
            inner
              .querySelectorAll("a")
              .forEach((a) => a.classList.remove("active"));
            link.classList.add("active");
            if (window.innerWidth <= 768) closeSidebar();
          });
        });
      }

      /* ─────────────────────────────────────────────────────
     MOBILE SIDEBAR TOGGLE
  ───────────────────────────────────────────────────── */
      const menuToggle = document.getElementById("menuToggle");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      function openSidebar() {
        sidebar.classList.add("open");
        overlay.classList.add("visible");
        menuToggle.innerHTML = '<i class="ti ti-x"></i>';
      }

      function closeSidebar() {
        sidebar.classList.remove("open");
        overlay.classList.remove("visible");
        menuToggle.innerHTML = '<i class="ti ti-menu-2"></i>';
      }

      menuToggle.addEventListener("click", () => {
        sidebar.classList.contains("open") ? closeSidebar() : openSidebar();
      });

      overlay.addEventListener("click", closeSidebar);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeSidebar();
      });

      /* Build nav on load */
      buildNav(NAV_CONFIG);
    </script>
  </body>
</html>
