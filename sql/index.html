<!DOCTYPE html>
<html>
<head>
    <title>Database Documentation</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            display:flex;
            height:100vh;
            font-family:Arial;
        }

        .sidebar{
            width:250px;
            overflow-y:auto;
            border-right:1px solid #ccc;
            padding:10px;
            transition: transform 0.3s ease;
        }

        .sidebar a{
            display:block;
            padding:10px;
            text-decoration:none;
            color:black;
            border-radius:5px;
        }

        .sidebar a:hover{
            background:#f2f2f2;
        }

        .content{
            flex:1;
            display:flex;
            flex-direction:column;
        }

        iframe{
            width:100%;
            height:100%;
            border:none;
        }

        .header {
            padding: 10px;
            border-bottom: 2px solid #ff9900;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: #ff9900;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #cc7700;
        }

        .menu-toggle {
            display: none;
            background: #ff9900;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        .menu-toggle:hover {
            background: #cc7700;
        }

        h3 {
            margin-top: 15px;
            color: #333;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                position: absolute;
                left: 0;
                top: 60px;
                height: calc(100vh - 60px);
                width: 250px;
                background: white;
                z-index: 1000;
                transform: translateX(-100%);
                box-shadow: 2px 0 5px rgba(0,0,0,0.2);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .content {
                width: 100%;
                height: calc(100vh - 60px);
            }

            .menu-toggle {
                display: block;
            }

            .header {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="header">
        <a href="../index.html" class="back-btn">← Dashboard</a>
    </div>
    <h3>🗄️ SQL Topics</h3>

    <a href="database-design.html" target="contentFrame">
        Database Design
    </a>

    <a href="sql-basics.html" target="contentFrame">
        SQL Basics
    </a>

    <a href="nosql-vs-sql.html" target="contentFrame">
        NoSQL vs SQL
    </a>

    <a href="optimization.html" target="contentFrame">
        Optimization
    </a>
</div>

<div class="content">
    <div class="header">
        <button class="menu-toggle" id="menuToggle">☰ Menu</button>
        <h3 style="margin: 0;">SQL Documentation</h3>
    </div>
    <iframe
        name="contentFrame"
        src="database-design.html">
    </iframe>
</div>

<script>
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');

    // Toggle sidebar on mobile
    menuToggle.addEventListener('click', () => {
        sidebar.classList.toggle('active');
    });

    // Close sidebar when a link is clicked
    const sidebarLinks = sidebar.querySelectorAll('a[target="contentFrame"]');
    sidebarLinks.forEach(link => {
        link.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                sidebar.classList.remove('active');
            }
        });
    });

    // Close sidebar when clicking outside on mobile
    document.addEventListener('click', (e) => {
        if (window.innerWidth <= 768) {
            if (!sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                sidebar.classList.remove('active');
            }
        }
    });
</script>
</body>
</html>
