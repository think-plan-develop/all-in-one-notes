<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Roadmap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="floating-side-nav.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #1e293b; background: #f1f5f9; }
    button, input { font: inherit; }
    [hidden] { display: none !important; }

    .topbar { height: 58px; flex-shrink: 0; position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 0 18px; color: #fff; background: linear-gradient(120deg, #1e3a8a, #2563eb 55%, #0e7490); box-shadow: 0 4px 24px rgba(30, 41, 59, .22); }
    .toggle, .back { border: 1px solid rgba(255,255,255,.24); border-radius: 8px; color: #fff; background: rgba(255,255,255,.14); cursor: pointer; }
    .toggle:hover, .back:hover { background: rgba(255,255,255,.24); }
    .toggle { width: 36px; height: 36px; font-size: 18px; }
    .back { padding: 7px 14px; }
    .title { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
    .title i { font-size: 22px; }
    .search { width: min(320px, 30vw); margin-left: auto; padding: 8px 14px; border: 0; border-radius: 20px; outline: 0; background: #fff; color: #1e293b; }
    .author { font-size: 13px; font-weight: 700; white-space: nowrap; }
    .main { display: flex; flex: 1; min-height: 0; }

    .sidebar { width: 440px; min-width: 440px; padding: 16px 12px 28px; overflow-y: auto; background: #fff; border-right: 1px solid #e2e8f0; }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .sidebar h2 { margin: 2px 8px 14px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #64748b; }
    .main.sidebar-hidden .sidebar { display: none; }
    .empty { display: none; margin: 16px 8px; font-size: 13px; color: #64748b; text-align: center; }

    .grp { margin: 0 0 8px; }
    .grp-head { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; padding: 10px 12px; font-size: 15px; font-weight: 800; color: var(--c2); background: var(--t); border: 1px solid var(--b); border-left: 5px solid var(--c); border-radius: 4px 14px 14px 4px; }
    .sub > summary:focus-visible, .sidebar a:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
    .rng { font-size: 11px; font-weight: 700; opacity: .6; margin-left: 6px; white-space: nowrap; }
    .icon { display: grid; place-items: center; width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; color: #fff; font-size: 19px; background: linear-gradient(135deg, var(--c), var(--c2)); box-shadow: 0 3px 8px var(--b); }
    .nav-badge { margin-left: auto; min-width: 24px; text-align: center; font-size: 11px; font-weight: 800; color: var(--c2); background: var(--t); border: 1px solid var(--b); padding: 2px 8px; border-radius: 10px; }
    .grp-head .nav-badge { background: #fff; }
    .nav-chevron { font-size: 15px; color: var(--c); transition: transform .2s ease; }
    .sub[open] > summary .nav-chevron { transform: rotate(180deg); }
    .grp > .nav-children { margin: 0 4px; display: grid; gap: 8px; }

    .sub { position: relative; border: 1px solid var(--b); border-left: 4px solid var(--c); border-radius: 4px 14px 14px 4px; background: #fff; box-shadow: 0 1px 3px rgba(15,23,42,.06); transition: box-shadow .2s, border-color .2s; }
    .sub:hover { box-shadow: 0 4px 14px var(--b); }
    .sub[open] { box-shadow: 0 8px 22px var(--b); border-color: var(--c); }
    .sub > summary { position: relative; display: flex; align-items: center; gap: 10px; padding: 11px 12px 11px 10px; list-style: none; cursor: pointer; border-radius: 0 13px 0 0; color: var(--c2); }
    .sub > summary::-webkit-details-marker { display: none; }
    .sub > summary:hover { background: var(--t); }
    .sub[open] > summary { background: linear-gradient(90deg, var(--t), #fff); border-bottom: 1px solid var(--b); }
    .sub > summary .ci { display: grid; place-items: center; width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; font-size: 18px; color: #fff; background: linear-gradient(135deg, var(--c), var(--c2)); box-shadow: 0 2px 6px var(--b); }
    .sub > summary .txt { flex: 1; min-width: 0; font-size: 14px; font-weight: 750; line-height: 1.3; color: #0f172a; }
    .sub > summary .num { display: inline-block; min-width: 22px; margin-right: 4px; font-weight: 800; color: var(--c); }
    .sub > summary .nav-badge { margin-left: 0; padding: 1px 7px; background: #fff; }
    .sub > summary .nav-chevron { font-size: 14px; }
    .sub > summary::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 3px; width: var(--p, 0%); background: var(--c); border-radius: 0 3px 3px 0; transition: width .3s ease; }
    .nav-imp { flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px; font-size: 9.5px; font-weight: 800; color: #b91c1c; background: #fee2e2; padding: 2px 7px 2px 5px; border-radius: 8px; }
    .nav-imp i { font-size: 9px; }

    .sub > .nav-children { display: grid; gap: 6px; margin: 0; padding: 12px 10px 12px 0; border-radius: 0 0 13px 0; animation: unfold .18s ease-out; }
    @keyframes unfold { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    .leaf { position: relative; display: flex; align-items: center; gap: 11px; margin-left: 40px; padding: 10px 10px 10px 12px; border-radius: 10px; border: 1px solid var(--b); background: #fff; color: var(--c2); text-decoration: none; box-shadow: inset 4px 0 0 var(--c), 0 1px 3px rgba(15,23,42,.06); transition: background .18s, border-color .18s, transform .18s, box-shadow .18s; }
    .leaf:not(:last-child)::before { content: ""; position: absolute; left: -22px; top: 50%; bottom: -3px; border-left: 2px solid var(--b); }
    .leaf::after { content: ""; position: absolute; left: -22px; top: -3px; width: 17px; height: calc(50% + 3px); border-left: 2px solid var(--b); border-bottom: 2px solid var(--b); border-bottom-left-radius: 10px; }
    .leaf:first-child::after { top: -13px; height: calc(50% + 13px); }
    .leaf .dot { position: absolute; left: -9px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: #fff; border: 2px solid var(--c); z-index: 1; transition: background .15s, transform .15s; }
    .leaf .ci { display: grid; place-items: center; width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; font-size: 11.5px; font-weight: 800; font-style: normal; font-variant-numeric: tabular-nums; color: var(--c2); background: var(--t); border: 1.5px solid var(--b); transition: background .18s, color .18s, border-color .18s; }
    .leaf .body { flex: 1; min-width: 0; }
    .leaf .ttl { display: block; font-size: 13px; font-weight: 700; line-height: 1.45; color: var(--c2); letter-spacing: .005em; }
    .leaf .det { display: block; margin-top: 2px; font-size: 11px; font-weight: 600; line-height: 1.35; color: #64748b; }
    .leaf.active .det { color: rgba(255,255,255,.85); }

    .kind { flex-shrink: 0; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 8px; }
    .k-l { color: #1d4ed8; background: #dbeafe; } .k-p { color: #6d28d9; background: #ede9fe; } .k-x { color: #b45309; background: #fef3c7; }
    .leaf.done .kind { opacity: .55; }
    .leaf.active .kind { color: #fff; background: rgba(255,255,255,.22); }

    .leaf .chk { display: grid; place-items: center; flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #cbd5e1; background: #fff; color: transparent; font-size: 12px; cursor: pointer; transition: border-color .15s, background .15s, color .15s; }
    .leaf .chk:hover { border-color: var(--c); }
    .leaf.done .chk { background: var(--c); border-color: var(--c); color: #fff; }

    .leaf:hover { background: var(--t); border-color: var(--c); box-shadow: inset 4px 0 0 var(--c), 0 4px 12px var(--b); transform: translateX(2px); }
    .leaf:hover .ci { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--c), var(--c2)); box-shadow: 0 3px 8px var(--b); }
    .leaf:hover .dot { background: var(--c); transform: scale(1.2); }
    .leaf.done .ci { color: #fff; border-color: transparent; background: var(--c); opacity: .75; }
    .leaf.done { background: #f8fafc; border-color: #e2e8f0; box-shadow: inset 4px 0 0 #cbd5e1; }
    .leaf.done .ttl { color: #94a3b8; text-decoration: line-through; text-decoration-color: #cbd5e1; }
    .leaf.active, .leaf.active:hover { color: #fff; border-color: transparent; background: linear-gradient(120deg, var(--c2), var(--c)); box-shadow: 0 6px 16px var(--b); transform: none; }
    .leaf.active .ttl { color: #fff; font-weight: 700; text-decoration: none; }
    .leaf.active .ci, .leaf.active:hover .ci { color: #fff; opacity: 1; background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.65); box-shadow: none; }
    .leaf.active .dot { background: var(--c2); border-color: #fff; transform: scale(1.25); }
    .leaf.active .chk { background: transparent; border-color: rgba(255,255,255,.65); }
    .leaf.active.done .chk { background: #fff; border-color: #fff; color: var(--c2); }


    /* single-page topic: shown directly as a card, no dropdown */
    .leaf.solo { margin-left: 0; padding: 11px 12px 11px 10px; border-left: 4px solid var(--c); border-radius: 4px 14px 14px 4px; box-shadow: 0 1px 3px rgba(15,23,42,.06); }
    .leaf.solo::before, .leaf.solo::after, .leaf.solo .dot { display: none; }
    .leaf.solo .ci { width: 34px; height: 34px; border-radius: 10px; font-size: 18px; color: #fff; border: 0; background: linear-gradient(135deg, var(--c), var(--c2)); box-shadow: 0 2px 6px var(--b); }
    .leaf.solo .num { display: inline-block; min-width: 22px; margin-right: 4px; font-weight: 800; color: var(--c); }
    .leaf.solo .ttl { font-size: 14px; font-weight: 750; color: #0f172a; }
    .leaf.solo:hover { box-shadow: 0 4px 14px var(--b); }
    .leaf.solo:hover .ci { background: linear-gradient(135deg, var(--c), var(--c2)); }
    .leaf.solo.done { box-shadow: 0 1px 3px rgba(15,23,42,.06); border-left-color: var(--c); }
    .leaf.solo.done .ci { opacity: .7; background: linear-gradient(135deg, var(--c), var(--c2)); }
    .leaf.solo.active, .leaf.solo.active:hover { border-left-color: var(--c2); }
    .leaf.solo.active .num, .leaf.solo.active .ttl { color: #fff; }
    .leaf.solo.active .ci { background: rgba(255,255,255,.2); }

    .t-s1 { --c:#6366f1; --c2:#3730a3; --t:#eef2ff; --b:#c7d2fe; }
    .t-s2 { --c:#10b981; --c2:#047857; --t:#ecfdf5; --b:#a7f3d0; }
    .t-s3 { --c:#f59e0b; --c2:#b45309; --t:#fffbeb; --b:#fde68a; }
    .t-s4 { --c:#8b5cf6; --c2:#5b21b6; --t:#f5f3ff; --b:#ddd6fe; }
    .t-green   { --c:#22c55e; --c2:#15803d; --t:#f0fdf4; --b:#bbf7d0; }
    .t-orange  { --c:#f97316; --c2:#c2410c; --t:#fff7ed; --b:#fed7aa; }
    .t-sky     { --c:#0ea5e9; --c2:#0369a1; --t:#f0f9ff; --b:#bae6fd; }
    .t-blue    { --c:#3b82f6; --c2:#1d4ed8; --t:#eff6ff; --b:#bfdbfe; }
    .t-fuchsia { --c:#d946ef; --c2:#86198f; --t:#fdf4ff; --b:#f5d0fe; }
    .t-pink    { --c:#ec4899; --c2:#9d174d; --t:#fdf2f8; --b:#fbcfe8; }
    .t-slate   { --c:#64748b; --c2:#1e293b; --t:#f8fafc; --b:#cbd5e1; }

    iframe { flex: 1; min-width: 0; border: 0; background: #fff; }
    .reopen { display: none; position: fixed; top: 10px; left: 10px; z-index: 5; width: 38px; height: 38px; place-items: center; border: 1px solid #e2e8f0; border-radius: 10px; color: #1e293b; font-size: 19px; cursor: pointer; background: #fff; box-shadow: 0 2px 10px rgba(15,23,42,.15); }
    .reopen:hover { background: #f1f5f9; }
    body.nav-hidden .topbar { display: none; }
    body.nav-hidden .reopen { display: grid; }

    @media (max-width: 768px) {
      .sidebar { position: absolute; top: 61px; bottom: 0; left: -100%; z-index: 3; transition: transform .2s ease; box-shadow: 4px 0 24px rgba(15,23,42,.18); max-width: 92vw; min-width: 0; }
      .sidebar.open { transform: translateX(100%); }
      body.nav-hidden .sidebar { top: 0; }
      body.nav-hidden .reopen { z-index: 4; }
      .author { display: none; } .search { width: 34vw; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <button class="reopen" id="reopen" type="button" title="Show navigation" aria-label="Show navigation"><i class="ti ti-menu-2"></i></button>
  <header class="topbar">
    <button class="toggle" id="toggle" type="button" title="Toggle navigation" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="true"><i class="ti ti-menu-2"></i></button>
    <div class="title"><i class="ti ti-database"></i><span>SQL &amp; Database</span></div>
    <button class="back" id="back" title="Return to Dev Hub"><i class="ti ti-arrow-left"></i> Back</button>
    <input class="search" id="search" type="search" placeholder="Search topics" aria-label="Search topics" />
    <div class="author">Shivam</div>
  </header>
  <main class="main">
    <nav class="sidebar" id="sidebar" aria-label="Database topics">
      <h2>Database Preparation</h2>
      <div id="links"></div>
      <p class="empty" id="empty">No topics match your search.</p>
    </nav>
    <iframe name="contentFrame" id="contentFrame" title="Database content" src="note.html?data=01-sql-summary.js"></iframe>
  </main>
  <script>
    /* DATA — 3 levels: section (static) > topic (collapsible) > page link
       T(number, icon, text, isImportant, [ [kind, text, href, imp?, badge?], ... ], theme?)
       Kinds: l = learn, p = pattern, x = practice
       Text in ( ) inside a page title is shown as a small detail line. */
    const T = (n, icon, text, star, kids, theme = "") => ({ n, icon, text, star, kids, theme });
    const D = "SQL%20fundamentals/", DMS = "Date-Math-String/";

    const NAV = [
      { key: "s1", icon: "ti-school", text: "Foundations", range: "1–3", topics: [
        T(1, "ti-database", "Core Foundations", true, [
          ["l", "Summary", "note.html?data=01-sql-summary.js"],
          ["l", "SQL Basics", "note.html?data=02-sql-basics-data.js"],
          ["l", "PostgreSQL Data-Types", "./03-sql-data-types.html", true, "Key"],
          ["l", "Specific Data-Types", "./05-specific-data-types.html"],
          ["l", "Database & Table Operations", "note.html?data=06-database-table-operations.js", true] ], "t-green"),
        T(2, "ti-table", "SQL Fundamentals", true, [
          ["l", "CRUD (INSERT, SELECT, UPDATE, DELETE)", "note.html?data=" + D + "crud-operations.js", true],
          ["l", "Constraints (PRIMARY KEY, FOREIGN KEY, UNIQUE, NOT NULL, CHECK, DEFAULT)", "note.html?data=" + D + "constraints.js", true],
          ["l", "Filtering (WHERE, AND, OR, IN, BETWEEN, LIKE, IS NULL, IS NOT NULL)", "note.html?data=" + D + "filtering-data.js", true],
          ["l", "Sorting & Pagination (ORDER BY, LIMIT, OFFSET)", "note.html?data=" + D + "sorting-pagination.js"],
          ["l", "Distinct Values (DISTINCT)", "note.html?data=" + D + "distinct.js"],
          ["l", "NULL Handling & Conditional Logic (COALESCE, CASE WHEN)", "note.html?data=" + D + "null-handling-conditional-logic.js"],
          ["l", "Aggregate Functions (COUNT, SUM, AVG, MIN, MAX)", "note.html?data=" + D + "aggregate-functions.js", true],
          ["l", "Grouping & Aggregate Filtering (GROUP BY, HAVING)", "note.html?data=" + D + "grouping-having.js", true],
          ["p", "Conversion Conditional", "./SQL%20fundamentals/postgresql_conversion_conditional_compact_notes.html"] ], "t-fuchsia"),
        T(3, "ti-calendar-stats", "Date, Math & String", false, [
          ["l", "Date Functions (DATE)", "note.html?data=" + DMS + "date-functions.js"],
          ["l", "Math Functions (MATH)", "note.html?data=" + DMS + "math-functions.js"],
          ["l", "String Functions (STRING)", "note.html?data=" + DMS + "string-functions.js"] ])
      ] },

      { key: "s2", icon: "ti-arrows-join", text: "Querying Across Tables", range: "4–6", topics: [
        T(4, "ti-layout-columns", "Window Functions", true, [
          ["p", "Window Functions", "./window_functions.html", true] ]),
        T(5, "ti-arrows-join", "Joins", true, [
          ["l", "All Joins", "./09-all-joins.html", true, "Key"],
          ["l", "Natural Join", "./10-natural-join.html"],
          ["x", "Join 30 Q&A", "./11-joins-30qna.html"] ], "t-sky"),
        T(6, "ti-code-dots", "Subqueries & CTEs", true, [
          ["l", "SubQuery", "./12-subqueries.html", true],
          ["l", "CTE, WITH", "./13-cte-with.html", true] ], "t-slate")
      ] },

      { key: "s3", icon: "ti-function", text: "Programmability and Safety", range: "7–8", topics: [
        T(7, "ti-function", "Programmability", false, [
          ["l", "Functions", "./14-functions.html"],
          ["l", "Triggers", "./15-triggers.html"],
          ["l", "Stored Procedure", "./16-stored-procedure.html"] ]),
        T(8, "ti-shield-check", "Reliability & Safety", true, [
          ["l", "Transactions", "./17-transactions.html", true] ], "t-orange")
      ] },

      { key: "s4", icon: "ti-sitemap", text: "Design, Types and Scale", range: "9–11", topics: [
        T(9, "ti-layers-intersect", "Design & Structure", true, [
          ["l", "Normalization", "./18-normalization.html", false, "Key"],
          ["l", "Indexes", "./19-sql-indexes.html"],
          ["l", "Views", "./20-views.html"] ], "t-blue"),
        T(10, "ti-braces", "Advanced Types", false, [
          ["l", "JsonB", "./21-jsonb.html"] ], "t-pink"),
        T(11, "ti-sitemap", "Scaling & Architecture", false, [
          ["l", "Partition & Replication", "./22-partition-replication.html"],
          ["l", "Catalog & Information Schema", "note.html?data=23-catalog-information-schema.js"] ])
      ] }
    ];

    /* ── Rendering ── */
    const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const IMP = `<span class="nav-imp"><i class="ti ti-star-filled"></i>Imp</span>`;
    const KIND = { l: "Learn", p: "Pattern", x: "Practice" };
    const split = t => { const m = t.match(/^(.*?)\s*\((.+)\)\s*$/); return m ? { title: m[1], det: m[2] } : { title: t, det: "" }; };

    const linkHTML = (k, i) => {
      const { title, det } = split(k[1]);
      return `
      <a class="leaf" href="${k[2]}" target="contentFrame" data-search="${esc(k[1].toLowerCase())}">
        <span class="dot"></span>
        <span class="ci">${String(i + 1).padStart(2, "0")}</span>
        <span class="body"><span class="ttl">${k[3] ? `${IMP} ` : ""}${esc(title)}</span>${det ? `<span class="det">${esc(det)}</span>` : ""}</span>
        ${k[4] ? `<span class="kind k-p">${k[4]}</span>` : `<span class="kind k-${k[0]}">${KIND[k[0]]}</span>`}
        <span class="chk" role="checkbox" aria-checked="false" aria-label="Mark as done" tabindex="0" title="Mark as done"><i class="ti ti-check"></i></span>
      </a>`;
    };
    const soloHTML = (t, k, num) => {
      const { title, det } = split(k[1]);
      return `
      <a class="leaf solo ${t.theme}" href="${k[2]}" target="contentFrame" data-search="${esc((t.text + " " + k[1]).toLowerCase())}">
        <i class="ti ${t.icon} ci"></i>
        <span class="body"><span class="ttl"><span class="num">${num}.</span>${esc(title)}</span>${det ? `<span class="det">${esc(det)}</span>` : ""}</span>
        ${k[3] ? IMP : ""}
        ${k[4] ? `<span class="kind k-p">${k[4]}</span>` : `<span class="kind k-${k[0]}">${KIND[k[0]]}</span>`}
        <span class="chk" role="checkbox" aria-checked="false" aria-label="Mark as done" tabindex="0" title="Mark as done"><i class="ti ti-check"></i></span>
      </a>`;
    };
    /* topics 1-3, 5-7, and the last one are dropdowns; everything in between is shown directly.
       Numbers run 1..N in order (a dropdown = 1 number, each direct page = 1 number). */
    let counter = 0;
    NAV.forEach(g => g.topics.forEach((t, i) => {
      t.flat = t.n >= 4 && t.n <= 10 && ![5, 6, 7].includes(t.n);
      if (t.flat) t.nums = t.kids.map(() => ++counter); else t.num = ++counter;
    }));
    const topicHTML = t => t.flat ? t.kids.map((k, i) => soloHTML(t, k, t.nums[i])).join("") : `
      <details class="sub ${t.theme}" data-search="${esc(t.text.toLowerCase())}">
        <summary>
          <i class="ti ${t.icon} ci"></i><span class="txt"><span class="num">${t.num}.</span>${esc(t.text)}</span>
          ${t.star ? IMP : ""}
          <span class="nav-badge prog">0/${t.kids.length}</span>
          <i class="ti ti-chevron-down nav-chevron"></i>
        </summary>
        <div class="nav-children">${t.kids.map(linkHTML).join("")}</div>
      </details>`;
    const countLinks = g => g.topics.reduce((n, t) => n + t.kids.length, 0);

    const links = document.getElementById("links");
    links.innerHTML = NAV.map(g => `
      <section class="grp t-${g.key}" data-search="${esc(g.text.toLowerCase())}">
        <div class="nav-children">${g.topics.map(topicHTML).join("")}</div>
      </section>`).join("");

    const groups = [...links.querySelectorAll(".grp")];
    const allLinks = [...links.querySelectorAll("a.leaf")];
    const frame = document.getElementById("contentFrame");
    const sidebar = document.getElementById("sidebar");
    const main = document.querySelector(".main");
    const toggle = document.getElementById("toggle");
    const mobileLayout = window.matchMedia("(max-width: 768px)");

    const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
    const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
    let done = new Set(load("sqlDone", []));
    let state = load("sqlHubState", { active: null });

    function updateToggleState() {
      toggle.setAttribute("aria-expanded", String(mobileLayout.matches ? sidebar.classList.contains("open") : !main.classList.contains("sidebar-hidden")));
    }
    function activate(link, openParent = true) {
      allLinks.forEach(a => a.classList.remove("active"));
      link.classList.add("active");
      const sb = link.closest(".sub"); if (sb && openParent) sb.open = true;
      state.active = link.getAttribute("href"); save("sqlHubState", state);
      sidebar.classList.remove("open"); updateToggleState();
    }
    allLinks.forEach(l => l.addEventListener("click", () => activate(l)));

    function refreshTopic(sub) {
      const ls = [...sub.querySelectorAll("a.leaf")], d = ls.filter(a => done.has(a.getAttribute("href"))).length;
      sub.querySelector(".prog").textContent = d + "/" + ls.length;
      sub.querySelector(":scope > summary").style.setProperty("--p", (d / ls.length * 100) + "%");
    }
    function paint(a) { const on = done.has(a.getAttribute("href")); a.classList.toggle("done", on); a.querySelector(".chk").setAttribute("aria-checked", on); }
    function toggleDone(a) { const h = a.getAttribute("href"); done.has(h) ? done.delete(h) : done.add(h); save("sqlDone", [...done]); paint(a); const sb = a.closest(".sub"); if (sb) refreshTopic(sb); }
    allLinks.forEach(a => {
      paint(a);
      const chk = a.querySelector(".chk");
      chk.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); toggleDone(a); });
      chk.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); e.stopPropagation(); toggleDone(a); } });
    });
    links.querySelectorAll(".sub").forEach(refreshTopic);

    /* start: restore last topic (or first) */
    const start = allLinks.find(a => a.getAttribute("href") === state.active) || allLinks[0];
    activate(start, false);
    if (start !== allLinks[0]) frame.src = start.getAttribute("href");

    /* search */
    document.getElementById("search").addEventListener("input", e => {
      const q = e.target.value.trim().toLowerCase();
      let any = false;
      groups.forEach(g => {
        const gHit = g.dataset.search.includes(q);
        let gShow = 0;
        g.querySelectorAll(".sub, a.solo").forEach(s => {
          const tHit = gHit || s.dataset.search.includes(q);
          if (s.matches("a.solo")) { s.hidden = !(!q || tHit); if (!s.hidden) gShow++; return; }
          let n = 0;
          s.querySelectorAll("a.leaf").forEach(a => { const show = !q || tHit || a.dataset.search.includes(q); a.hidden = !show; if (show) n++; });
          s.hidden = n === 0; if (n) { gShow++; if (q) s.open = true; }
        });
        g.hidden = gShow === 0; if (gShow) any = true;
      });
      document.getElementById("empty").style.display = any ? "none" : "block";
    });

    /* sidebar + top bar toggle */
    function setNavHidden(hide) {
      main.classList.toggle("sidebar-hidden", hide && !mobileLayout.matches);
      document.body.classList.toggle("nav-hidden", hide);
      if (!hide) sidebar.classList.remove("open");
      updateToggleState();
    }
    toggle.addEventListener("click", () => {
      if (mobileLayout.matches) {
        if (sidebar.classList.contains("open")) { sidebar.classList.remove("open"); setNavHidden(true); }
        else { sidebar.classList.add("open"); updateToggleState(); }
      } else setNavHidden(!main.classList.contains("sidebar-hidden"));
    });
    document.getElementById("reopen").addEventListener("click", () => {
      setNavHidden(false);
      if (mobileLayout.matches) { sidebar.classList.add("open"); updateToggleState(); }
    });
    mobileLayout.addEventListener("change", updateToggleState);
    updateToggleState();
    document.getElementById("back").addEventListener("click", () => { window.location.href = "../index.html"; });
  </script>
  <nav class="side-nav" aria-label="Section navigation"></nav>
  <script src="floating-side-nav.js"></script>
</body>
</html>
