<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="floating-side-nav.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #1e293b; background: #f1f5f9; }
    button, input { font: inherit; }

    /* Needed because flex/grid display rules override the hidden attribute */
    [hidden] { display: none !important; }

    /* ── Top bar ── */
    .topbar { height: 58px; flex-shrink: 0; position: relative; z-index: 200; display: flex; align-items: center; gap: 12px; padding: 0 18px; color: #fff; background: linear-gradient(120deg, #1e3a8a, #2563eb 55%, #7c3aed); box-shadow: 0 4px 24px rgba(30, 41, 59, .22); }
    .toggle, .back { border: 1px solid rgba(255,255,255,.24); border-radius: 8px; color: #fff; background: rgba(255,255,255,.14); cursor: pointer; text-decoration: none; }
    .toggle:hover, .back:hover { background: rgba(255,255,255,.24); }
    .toggle { display: none; place-items: center; width: 36px; height: 36px; font-size: 18px; }
    .back { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .title { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; white-space: nowrap; }
    .title i { font-size: 22px; }
    .search { width: min(360px, 34vw); margin: 0 auto; padding: 8px 14px; border: 0; border-radius: 20px; outline: 0; background: #fff; color: #1e293b; }
    .author { margin-left: auto; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; color: #4338ca; background: linear-gradient(135deg, #fff, #e0e7ff); padding: 6px 12px; border-radius: 999px; box-shadow: 0 4px 10px rgba(0,0,0,.12); }
    .main { display: flex; flex: 1; min-height: 0; }

    /* ══════════ SIDEBAR ══════════ */
    .sidebar { width: 360px; min-width: 360px; padding: 16px 12px 28px; overflow-y: auto; background: #fff; border-right: 1px solid #e2e8f0; }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .sidebar h2 { margin: 2px 8px 14px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #64748b; }

    /* ── LEVEL 1 — static section heading (not clickable, always visible).
       Colours: --c main, --c2 dark, --t tint, --b border ── */
    .grp { margin: 0 0 22px; }
    .grp-head { position: relative; display: flex; align-items: center; gap: 12px; margin: 0 0 10px; padding: 10px 12px; font-size: 15px; font-weight: 800; color: var(--c2); background: var(--t); border: 1px solid var(--b); border-left: 5px solid var(--c); border-radius: 4px 14px 14px 4px; }
    .grp-head::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 3px; width: var(--p, 0%); background: var(--c); border-radius: 0 3px 3px 0; transition: width .3s ease; }
    .grp-head .label { flex: 1; min-width: 0; line-height: 1.3; }
    .icon { display: grid; place-items: center; width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; color: #fff; font-size: 19px; background: linear-gradient(135deg, var(--c), var(--c2)); box-shadow: 0 3px 8px var(--b); }
    .nav-badge { min-width: 24px; text-align: center; font-size: 11px; font-weight: 800; color: var(--c2); background: #fff; border: 1px solid var(--b); padding: 2px 8px; border-radius: 10px; }

    /* ── LEVEL 2 — topic card (always visible, one per page) ── */
    .grp > .nav-children { margin: 0 4px; display: grid; gap: 8px; }
    .item { position: relative; display: flex; align-items: center; gap: 11px; padding: 10px 12px 10px 10px; border: 1px solid var(--b); border-left: 4px solid var(--c); border-radius: 4px 14px 14px 4px; background: #fff; color: #0f172a; text-decoration: none; box-shadow: 0 1px 3px rgba(15,23,42,.06); transition: background .18s, box-shadow .18s, transform .18s, border-color .18s; }
    .item:hover { background: var(--t); box-shadow: 0 6px 16px var(--b); transform: translateX(2px); }
    .item:focus-visible, .grp-head:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
    .item .ci { display: grid; place-items: center; width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; font-size: 18px; color: #fff; background: linear-gradient(135deg, var(--c), var(--c2)); box-shadow: 0 2px 6px var(--b); }
    .item .txt { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 650; line-height: 1.4; color: var(--c2); }

    .link-badge { flex-shrink: 0; display: inline-flex; align-items: center; font-size: 9.5px; font-weight: 800; padding: 2px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: .03em; }
    .badge-hot { background: #fee2e2; color: #b91c1c; }
    .badge-new { background: #dcfce7; color: #15803d; }
    .badge-beta { background: #fef9c3; color: #92400e; }

    /* done tick */
    .item .chk { display: grid; place-items: center; flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #cbd5e1; background: #fff; color: transparent; font-size: 12px; cursor: pointer; transition: border-color .15s, background .15s, color .15s; }
    .item .chk:hover { border-color: var(--c); }
    .item.done .chk { background: var(--c); border-color: var(--c); color: #fff; }
    .item.done .ttl { color: #94a3b8; text-decoration: line-through; text-decoration-color: #cbd5e1; }
    .item.done .ci { opacity: .7; }

    /* active: solid section gradient */
    .item.active, .item.active:hover { background: linear-gradient(120deg, var(--c2), var(--c)); border-color: transparent; border-left-color: var(--c2); box-shadow: 0 6px 16px var(--b); transform: none; }
    .item.active .ttl { color: #fff; font-weight: 750; text-decoration: none; }
    .item.active .ci { background: rgba(255,255,255,.2); box-shadow: none; opacity: 1; }
    .item.active .chk { background: transparent; border-color: rgba(255,255,255,.65); }
    .item.active.done .chk { background: #fff; border-color: #fff; color: var(--c2); }


    /* ── Important marker ── */
    .nav-imp { flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px; font-size: 9.5px; font-weight: 800; color: #b91c1c; background: #fee2e2; padding: 2px 7px 2px 5px; border-radius: 8px; }
    .nav-imp i { font-size: 9px; }
    .item.active .nav-imp { background: rgba(255,255,255,.95); }

    /* ── Sub text (inside brackets): small chips, hidden until hover / focus / active ── */
    .item .ttl { display: block; }
    .item .sub { display: flex; flex-wrap: wrap; gap: 4px; max-height: 0; opacity: 0; margin-top: 0; overflow: hidden; transition: max-height .25s ease, opacity .2s ease, margin-top .2s ease; }
    .item .chip { font-size: 10.5px; font-weight: 700; line-height: 1.4; padding: 1px 8px; border-radius: 8px; color: var(--c2); background: var(--t); border: 1px solid var(--b); }
    .item:hover .sub, .item:focus-visible .sub, .item.active .sub { max-height: 140px; opacity: 1; margin-top: 7px; }
    .item.active .chip { color: #fff; background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.4); }
    .item .sub-chev { flex-shrink: 0; font-size: 14px; color: var(--c); transition: transform .2s ease; }
    .item:hover .sub-chev, .item:focus-visible .sub-chev, .item.active .sub-chev { transform: rotate(180deg); }
    .item.active .sub-chev { color: #fff; }
    @media (hover: none) { .item .sub { max-height: 140px; opacity: 1; margin-top: 7px; } .item .sub-chev { display: none; } }

    .empty { display: none; margin: 16px 8px; font-size: 13px; color: #64748b; }

    /* ── Section colours (cycled across sections) ── */
    .t-0 { --c:#6366f1; --c2:#3730a3; --t:#eef2ff; --b:#c7d2fe; }
    .t-1 { --c:#10b981; --c2:#047857; --t:#ecfdf5; --b:#a7f3d0; }
    .t-2 { --c:#f59e0b; --c2:#b45309; --t:#fffbeb; --b:#fde68a; }
    .t-3 { --c:#8b5cf6; --c2:#5b21b6; --t:#f5f3ff; --b:#ddd6fe; }
    .t-4 { --c:#f43f5e; --c2:#9f1239; --t:#fff1f2; --b:#fecdd3; }
    .t-5 { --c:#0ea5e9; --c2:#0369a1; --t:#f0f9ff; --b:#bae6fd; }
    .t-6 { --c:#14b8a6; --c2:#0f766e; --t:#f0fdfa; --b:#99f6e4; }
    .t-7 { --c:#f97316; --c2:#c2410c; --t:#fff7ed; --b:#fed7aa; }

    /* ── Content iframe ── */
    iframe { flex: 1; min-width: 0; width: 100%; height: 100%; display: block; border: 0; background: #f4f7fc; }

    /* ── Mobile overlay ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 99; backdrop-filter: blur(2px); }

    @media (max-width: 768px) {
      .toggle { display: grid; }
      .author { display: none; }
      .search { width: 34vw; }
      .title { font-size: 15px; }
      .sidebar { position: fixed; top: 58px; left: 0; height: calc(100vh - 58px); z-index: 150; transform: translateX(-100%); transition: transform .25s ease; box-shadow: 4px 0 24px rgba(15,23,42,.18); max-width: 92vw; min-width: 0; }
      .sidebar.open { transform: translateX(0); }
      .overlay.visible { display: block; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <!-- TOPBAR -->
  <header class="topbar">
    <button class="toggle" id="menuToggle" aria-label="Toggle menu"><i class="ti ti-menu-2"></i></button>
    <a href="../index.html" class="back"><i class="ti ti-arrow-left"></i> Dashboard</a>
    <div class="title"><i class="ti ti-database" aria-hidden="true"></i><span>SQL &amp; Database</span></div>
    <input class="search" id="search" type="search" placeholder="Search topics" aria-label="Search topics" />
    <div class="author">Maintained by Shivam Singh</div>
  </header>

  <!-- OVERLAY (mobile tap-outside to close) -->
  <div class="overlay" id="overlay"></div>

  <main class="main">
    <!-- SIDEBAR — shell only, filled by buildNav() -->
    <nav class="sidebar" id="sidebar" aria-label="Database topics">
      <h2>Database Docs</h2>
      <div id="links"></div>
      <p class="empty" id="empty">No topics match your search.</p>
    </nav>

    <!-- CONTENT IFRAME -->
    <iframe name="contentFrame" id="contentFrame" title="Database content" src="note.html?data=01-sql-summary.js"></iframe>
  </main>

  <script>
    /* ─────────────────────────────────────────────────────
       NAV CONFIG — only edit this to update the sidebar
       Section: static heading (always visible), coloured automatically
       Link:    always-visible card that loads into the viewer
       ───────────────────────────────────────────────────── */
    const NAV_CONFIG = [
      // 1. CORE FOUNDATIONS
      {
        label: "Core Foundations",
        icon: "ti-school",
        links: [
          { icon: "ti-database", text: "01. Summary", href: "note.html?data=01-sql-summary.js", target: "contentFrame" },
          { icon: "ti-database", text: "02. SQL Basics", href: "note.html?data=02-sql-basics-data.js", target: "contentFrame" },
          { icon: "ti-category", text: "03. PostgreSQL Data-Types", href: "./03-sql-data-types.html", target: "contentFrame", imp: true, badge: { text: "Key", cls: "badge-hot" } },
          { icon: "ti-category-2", text: "04. Specific Data-Types", href: "./05-specific-data-types.html", target: "contentFrame" },
          { icon: "ti-table-options", text: "05. Database & Table Operations", href: "note.html?data=06-database-table-operations.js", target: "contentFrame", imp: true },
        ],
      },

      // 2. SQL FUNDAMENTALS
      {
        label: "SQL Fundamentals",
        icon: "ti-table",
        links: [
          { icon: "ti-edit", text: "CRUD (INSERT, SELECT, UPDATE, DELETE)", href: "note.html?data=SQL%20fundamentals/crud-operations.js", target: "contentFrame", imp: true },
          { icon: "ti-lock", text: "Constraints (PRIMARY KEY, FOREIGN KEY, UNIQUE, NOT NULL, CHECK, DEFAULT)", href: "note.html?data=SQL%20fundamentals/constraints.js", target: "contentFrame", imp: true },
          { icon: "ti-filter", text: "Filtering (WHERE, AND, OR, IN, BETWEEN, LIKE, IS NULL, IS NOT NULL)", href: "note.html?data=SQL%20fundamentals/filtering-data.js", target: "contentFrame", imp: true },
          { icon: "ti-sort-ascending", text: "Sorting & Pagination (ORDER BY, LIMIT, OFFSET)", href: "note.html?data=SQL%20fundamentals/sorting-pagination.js", target: "contentFrame" },
          { icon: "ti-adjustments-horizontal", text: "Distinct Values (DISTINCT)", href: "note.html?data=SQL%20fundamentals/distinct.js", target: "contentFrame" },
          { icon: "ti-arrows-join", text: "NULL Handling & Conditional Logic (COALESCE, CASE WHEN)", href: "note.html?data=SQL%20fundamentals/null-handling-conditional-logic.js", target: "contentFrame" },
          { icon: "ti-calculator", text: "Aggregate Functions (COUNT, SUM, AVG, MIN, MAX)", href: "note.html?data=SQL%20fundamentals/aggregate-functions.js", target: "contentFrame", imp: true },
          { icon: "ti-layout-list", text: "Grouping & Aggregate Filtering (GROUP BY, HAVING)", href: "note.html?data=SQL%20fundamentals/grouping-having.js", target: "contentFrame", imp: true },
          { icon: "ti-layout-list", text: "Conversion Conditional", href: "./SQL%20fundamentals/postgresql_conversion_conditional_compact_notes.html", target: "contentFrame" },
        ],
      },

      // 3. DATE, MATH & STRING
      {
        label: "Date, Math & String",
        icon: "ti-calendar-stats",
        links: [
          { icon: "ti-calendar", text: "Date Functions (DATE)", href: "note.html?data=Date-Math-String/date-functions.js", target: "contentFrame" },
          { icon: "ti-math-function", text: "Math Functions (MATH)", href: "note.html?data=Date-Math-String/math-functions.js", target: "contentFrame" },
          { icon: "ti-text-size", text: "String Functions (STRING)", href: "note.html?data=Date-Math-String/string-functions.js", target: "contentFrame" },
        ],
      },

      // 4. WINDOW FUNCTIONS
      {
        label: "Window Functions",
        icon: "ti-layout-columns",
        links: [
          { icon: "ti-layout-columns", text: "Window Functions", href: "./window_functions.html", target: "contentFrame", imp: true },
        ],
      },

      // 5. JOINS
      {
        label: "Joins",
        icon: "ti-arrows-join",
        links: [
          { icon: "ti-arrows-join", text: "09. All Joins", href: "./09-all-joins.html", target: "contentFrame", imp: true, badge: { text: "Key", cls: "badge-hot" } },
          { icon: "ti-arrows-join-2", text: "10. Natural Join", href: "./10-natural-join.html", target: "contentFrame" },
          { icon: "ti-help-square", text: "11. Join 30 Q&A", href: "./11-joins-30qna.html", target: "contentFrame" },
        ],
      },

      // 6. SUBQUERIES & CTEs
      {
        label: "Subqueries & CTEs",
        icon: "ti-code-dots",
        links: [
          { icon: "ti-code-dots", text: "12. SubQuery", href: "./12-subqueries.html", target: "contentFrame", imp: true },
          { icon: "ti-brackets-contain", text: "13. CTE, WITH", href: "./13-cte-with.html", target: "contentFrame", imp: true },
        ],
      },

      // 7. PROGRAMMABILITY
      {
        label: "Programmability",
        icon: "ti-function",
        links: [
          { icon: "ti-function", text: "14. Functions", href: "./14-functions.html", target: "contentFrame" },
          { icon: "ti-bolt", text: "15. Triggers", href: "./15-triggers.html", target: "contentFrame" },
          { icon: "ti-package", text: "16. Stored Procedure", href: "./16-stored-procedure.html", target: "contentFrame" },
        ],
      },

      // 8. RELIABILITY & SAFETY
      {
        label: "Reliability & Safety",
        icon: "ti-shield-check",
        links: [
          { icon: "ti-shield-check", text: "17. Transactions", href: "./17-transactions.html", target: "contentFrame", imp: true },
        ],
      },

      // 9. DESIGN & STRUCTURE
      {
        label: "Design & Structure",
        icon: "ti-layers-intersect",
        links: [
          { icon: "ti-layers-intersect", text: "18. Normalization", href: "./18-normalization.html", target: "contentFrame", badge: { text: "Key", cls: "badge-hot" } },
          { icon: "ti-list-search", text: "19. Indexes", href: "./19-sql-indexes.html", target: "contentFrame" },
          { icon: "ti-eye", text: "20. Views", href: "./20-views.html", target: "contentFrame" },
        ],
      },

      // 10. ADVANCED TYPES
      {
        label: "Advanced Types",
        icon: "ti-braces",
        links: [
          { icon: "ti-braces", text: "21. JsonB", href: "./21-jsonb.html", target: "contentFrame" },
        ],
      },

      // 11. SCALING & ARCHITECTURE
      {
        label: "Scaling & Architecture",
        icon: "ti-sitemap",
        links: [
          { icon: "ti-sitemap", text: "22. Partition & Replication", href: "./22-partition-replication.html", target: "contentFrame" },
          { icon: "ti-schema", text: "23. Catalog & Information Schema", href: "note.html?data=23-catalog-information-schema.js", target: "contentFrame" },
        ],
      },
    ];

    /* ─────────────────────────────────────────────────────
       RENDERER — don't touch this
       ───────────────────────────────────────────────────── */
    const COLOR_COUNT = 8;
    const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

    const IMP = `<span class="nav-imp" title="Important"><i class="ti ti-star-filled"></i>Imp</span>`;

    // "CRUD (INSERT, SELECT)"  ->  title "CRUD" + sub-items ["INSERT", "SELECT"]
    const parseText = t => {
      const m = t.match(/^(.*?)\s*\((.+)\)\s*$/);
      return m ? { title: m[1], subs: m[2].split(",").map(x => x.trim()).filter(Boolean) } : { title: t, subs: [] };
    };

    const itemHTML = link => {
      const { title, subs } = parseText(link.text);
      return `
      <a class="item${subs.length ? " has-sub" : ""}" href="${link.href}" target="${link.target || "contentFrame"}">
        <i class="ti ${link.icon} ci" aria-hidden="true"></i>
        <span class="txt">
          <span class="ttl">${esc(title)}</span>
          ${subs.length ? `<span class="sub">${subs.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</span>` : ""}
        </span>
        ${link.imp ? IMP : ""}
        ${link.badge ? `<span class="link-badge ${link.badge.cls}">${link.badge.text}</span>` : ""}
        ${subs.length ? `<i class="ti ti-chevron-down sub-chev" aria-hidden="true"></i>` : ""}
        <span class="chk" role="checkbox" aria-checked="false" aria-label="Mark as done" tabindex="0" title="Mark as done"><i class="ti ti-check"></i></span>
      </a>`;
    };

    const links = document.getElementById("links");
    links.innerHTML = NAV_CONFIG.map((g, i) => `
      <section class="grp t-${i % COLOR_COUNT}">
        <h3 class="grp-head">
          <span class="icon"><i class="ti ${g.icon || "ti-folder"}" aria-hidden="true"></i></span>
          <span class="label">${esc(g.label)}</span>
          <span class="nav-badge prog">0/${g.links.length}</span>
        </h3>
        <div class="nav-children">${g.links.map(itemHTML).join("")}</div>
      </section>`).join("");

    const groups = [...links.querySelectorAll(".grp")];
    const allLinks = [...links.querySelectorAll("a.item")];
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const menuToggle = document.getElementById("menuToggle");

    /* ── Mobile sidebar ── */
    function openSidebar() { sidebar.classList.add("open"); overlay.classList.add("visible"); menuToggle.innerHTML = '<i class="ti ti-x"></i>'; }
    function closeSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("visible"); menuToggle.innerHTML = '<i class="ti ti-menu-2"></i>'; }
    menuToggle.addEventListener("click", () => sidebar.classList.contains("open") ? closeSidebar() : openSidebar());
    overlay.addEventListener("click", closeSidebar);
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeSidebar(); });

    /* ── Active link ── */
    function activate(link) {
      allLinks.forEach(a => a.classList.remove("active"));
      link.classList.add("active");
      if (window.innerWidth <= 768) closeSidebar();
    }
    allLinks.forEach(l => l.addEventListener("click", () => activate(l)));
    allLinks[0].classList.add("active");   // matches the page the iframe loads first

    /* ── Done tracking (saved in this browser) ── */
    let done = new Set();
    try { done = new Set(JSON.parse(localStorage.getItem("sqlDone") || "[]")); } catch (e) {}
    const saveDone = () => { try { localStorage.setItem("sqlDone", JSON.stringify([...done])); } catch (e) {} };

    function refreshGroup(g) {
      const ls = [...g.querySelectorAll("a.item")];
      const d = ls.filter(a => done.has(a.getAttribute("href"))).length;
      g.querySelector(".prog").textContent = d + "/" + ls.length;
      g.querySelector(".grp-head").style.setProperty("--p", (d / ls.length * 100) + "%");
    }
    function paint(a) {
      const on = done.has(a.getAttribute("href"));
      a.classList.toggle("done", on);
      a.querySelector(".chk").setAttribute("aria-checked", on);
    }
    function toggleDone(a) {
      const h = a.getAttribute("href");
      done.has(h) ? done.delete(h) : done.add(h);
      saveDone(); paint(a); refreshGroup(a.closest(".grp"));
    }
    allLinks.forEach(a => {
      paint(a);
      const chk = a.querySelector(".chk");
      chk.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); toggleDone(a); });
      chk.addEventListener("keydown", e => {
        if (e.key === " " || e.key === "Enter") { e.preventDefault(); e.stopPropagation(); toggleDone(a); }
      });
    });
    groups.forEach(refreshGroup);

    /* ── Search: matches section names and topic names ── */
    document.getElementById("search").addEventListener("input", e => {
      const q = e.target.value.trim().toLowerCase();
      let any = false;
      groups.forEach(g => {
        const gHit = g.querySelector(".grp-head").textContent.toLowerCase().includes(q);
        let hits = 0;
        g.querySelectorAll("a.item").forEach(a => {
          const show = !q || gHit || a.textContent.toLowerCase().includes(q);
          a.hidden = !show;
          if (show) hits++;
        });
        g.hidden = hits === 0;
        if (hits) any = true;
      });
      document.getElementById("empty").style.display = any ? "none" : "block";
    });
