<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Documentation</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
 
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f4f7fc;
    color: #222;
    overflow: hidden;
  }
 
  /* ── TOPBAR ─────────────────────────────────────────── */
  .topbar {
    height: 56px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    box-shadow: 0 4px 20px rgba(37,99,235,.3);
    z-index: 200;
    position: relative;
  }
 
  .menu-toggle {
    background: rgba(255,255,255,.15);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,.3);
    width: 38px;
    height: 38px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    display: none;               /* hidden on desktop */
    align-items: center;
    justify-content: center;
    transition: background .2s;
    flex-shrink: 0;
  }
  .menu-toggle:hover { background: rgba(255,255,255,.25); }
 
  .back-btn {
    background: rgba(255,255,255,.15);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,.3);
    padding: 7px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .2s;
    white-space: nowrap;
  }
  .back-btn:hover { background: rgba(255,255,255,.25); }
 
  .topbar-title {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    letter-spacing: .01em;
    flex: 1;
  }
  .topbar-badge {
    background: rgba(255,255,255,.18);
    color: rgba(255,255,255,.9);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: .05em;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,.25);
  }
 
  /* ── MAIN LAYOUT ────────────────────────────────────── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
 
  /* ── SIDEBAR ─────────────────────────────────────────── */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 2px 0 12px rgba(0,0,0,.05);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    z-index: 100;
  }
 
  .sidebar-inner {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px 24px;
    scrollbar-width: thin;
    scrollbar-color: #cbd5e1 transparent;
  }
  .sidebar-inner::-webkit-scrollbar { width: 4px; }
  .sidebar-inner::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
 
  .sidebar-section { margin-bottom: 10px; }
 
  .sidebar-group-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #94a3b8;
    padding: 6px 10px 4px;
    margin-top: 10px;
  }
 
  .sidebar a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    color: #475569;
    transition: background .15s, color .15s, transform .1s;
    position: relative;
  }
  .sidebar a:hover {
    background: #eff6ff;
    color: #2563eb;
    transform: translateX(2px);
  }
  .sidebar a.active {
    background: linear-gradient(135deg, #eff6ff, #f5f3ff);
    color: #2563eb;
    font-weight: 600;
  }
  .sidebar a.active::before {
    content: '';
    position: absolute;
    left: 0; top: 20%; bottom: 20%;
    width: 3px;
    background: linear-gradient(180deg, #2563eb, #7c3aed);
    border-radius: 0 3px 3px 0;
  }
  .sidebar a .icon {
    font-size: 16px;
    width: 22px;
    text-align: center;
    flex-shrink: 0;
  }
  .sidebar a .link-badge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
  }
  .badge-new  { background: #dcfce7; color: #15803d; }
  .badge-hot  { background: #fee2e2; color: #b91c1c; }
  .badge-beta { background: #fef9c3; color: #92400e; }
 
  .sidebar-divider {
    height: 1px;
    background: #f1f5f9;
    margin: 8px 10px;
  }
 
  /* Sidebar footer branding */
  .sidebar-footer {
    padding: 14px 16px;
    border-top: 1px solid #f1f5f9;
    background: #fafafa;
  }
  .sidebar-footer p {
    font-size: 11px;
    color: #94a3b8;
    line-height: 1.5;
  }
  .sidebar-footer strong { color: #64748b; }
 
  /* ── OVERLAY (mobile) ───────────────────────────────── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 99;
    backdrop-filter: blur(2px);
  }
 
  /* ── IFRAME ──────────────────────────────────────────── */
  iframe {
    flex: 1;
    width: 100%;
    height: 100%;
    border: none;
    background: #f4f7fc;
  }
 
  /* ── MOBILE ──────────────────────────────────────────── */
  @media (max-width: 768px) {
    .menu-toggle {
      display: flex;       /* show hamburger on mobile */
    }
 
    .topbar-badge {
      display: none;       /* hide badge to save space */
    }
 
    .sidebar {
      position: fixed;
      top: 56px;
      left: 0;
      height: calc(100vh - 56px);
      transform: translateX(-100%);   /* hidden off-screen by default */
      z-index: 150;
    }
 
    .sidebar.open {
      transform: translateX(0);       /* slide in when .open is added */
    }
 
    .overlay.visible {
      display: block;
    }
  }
</style>
</head>
<body>
 
<!-- TOPBAR -->
<div class="topbar">
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
  <a href="../index.html" class="back-btn">← Dashboard</a>
  <span class="topbar-title">🗄️ SQL &amp; Database</span>
  <span class="topbar-badge">Docs</span>
</div>
 
<!-- OVERLAY (mobile tap-outside to close) -->
<div class="overlay" id="overlay"></div>
 
<div class="main">
 
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-inner">
 
      <div class="sidebar-section">
        <div class="sidebar-group-label">Foundations</div>
        <a href="note.html?data=0-database-fundamental.js" target="contentFrame" class="active">
          <span class="icon">🏗️</span> Database Design
        </a>
        <a href="note.html?data=1-sql-basics-data.js" target="contentFrame">
          <span class="icon">📘</span> SQL Basics
        </a>
      </div>
 
      <div class="sidebar-divider"></div>
 
      <div class="sidebar-section">
        <div class="sidebar-group-label">Operations</div>
        <a href="note.html?data=2-sql-operations-01-data.js" target="contentFrame">
          <span class="icon">⚙️</span> SQL Operations — 01
        </a>
        <a href="note.html?data=3-sql-operations-02-data.js" target="contentFrame">
          <span class="icon">🔧</span> SQL Operations — 02
        </a>
      </div>
 
      <div class="sidebar-divider"></div>
 
      <div class="sidebar-section">
        <div class="sidebar-group-label">Advanced</div>
        <a href="./4-normalization.html" target="contentFrame">
          <span class="icon">📐</span> Normalization
          <span class="link-badge badge-hot">Key</span>
        </a>
        <a href="optimization.html" target="contentFrame">
          <span class="icon">⚡</span> Optimization
          <span class="link-badge badge-new">New</span>
        </a>
      </div>
 
      <div class="sidebar-divider"></div>
 
      <div class="sidebar-section">
        <div class="sidebar-group-label">Practice &amp; More</div>
        <a href="note.html?data=4-sql-QnA-data.js" target="contentFrame">
          <span class="icon">🎯</span> SQL Q&amp;A
          <span class="link-badge badge-beta">Interview</span>
        </a>
        <a href="../mongodb/2-mongodb-complete-guide/index.html" target="contentFrame">
          <span class="icon">🍃</span> MongoDB
        </a>
      </div>
 
    </div>
 
    <div class="sidebar-footer">
      <p><strong>SQL &amp; Database Docs</strong><br>Select a topic to load it in the viewer.</p>
    </div>
  </nav>
 
  <!-- CONTENT IFRAME -->
  <iframe name="contentFrame" id="contentFrame" src="note.html?data=0-database-fundamental.js"></iframe>
 
</div>
 
<script>
  const menuToggle = document.getElementById('menuToggle');
  const sidebar    = document.getElementById('sidebar');
  const overlay    = document.getElementById('overlay');
 
  function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('visible');
    menuToggle.textContent = '✕';
  }
 
  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('visible');
    menuToggle.textContent = '☰';
  }
 
  menuToggle.addEventListener('click', () => {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
 
  overlay.addEventListener('click', closeSidebar);
 
  // Active link highlight + auto-close on mobile
  sidebar.querySelectorAll('a[target="contentFrame"]').forEach(link => {
    link.addEventListener('click', () => {
      sidebar.querySelectorAll('a').forEach(a => a.classList.remove('active'));
      link.classList.add('active');
      if (window.innerWidth <= 768) closeSidebar();
    });
  });
 
  // Close on Escape key
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeSidebar();
  });
</script>
</body>
</html>
