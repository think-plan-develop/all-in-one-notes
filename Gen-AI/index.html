<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>GenAI Documentation</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        color: #1e293b;
        background: #f4f5fa;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin: 0;
        overflow: hidden;
      }

      .topbar {
        z-index: 2;
        display: flex;
        flex: 0 0 58px;
        align-items: center;
        gap: 14px;
        padding: 0 18px;
        color: #fff;
        background: linear-gradient(120deg, #111827, #312e81 58%, #6d28d9);
        box-shadow: 0 4px 18px #1e1b4b33;
      }

      .menu-toggle,
      .back-btn {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 36px;
        border: 1px solid #ffffff40;
        border-radius: 9px;
        color: #fff;
        background: #ffffff1c;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }

      .menu-toggle {
        display: none;
        width: 38px;
        font-size: 18px;
      }

      .back-btn {
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 600;
      }

      .menu-toggle:hover,
      .back-btn:hover {
        background: #ffffff33;
      }

      .topbar-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 750;
      }

      .topbar-title i {
        color: #c4b5fd;
        font-size: 22px;
      }

      .topbar-badge {
        margin-left: auto;
        padding: 5px 11px;
        border: 1px solid #c4b5fd55;
        border-radius: 20px;
        color: #ddd6fe;
        background: #8b5cf622;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .main {
        position: relative;
        display: flex;
        flex: 1;
        min-height: 0;
      }

      .sidebar {
        z-index: 1;
        display: flex;
        flex: 0 0 290px;
        flex-direction: column;
        overflow-y: auto;
        padding: 16px 12px;
        border-right: 1px solid #e2e8f0;
        background: #fff;
      }

      .sidebar-heading {
        margin: 0 5px 12px;
        color: #64748b;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .sidebar a {
        display: flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 4px;
        padding: 10px;
        border: 1px solid transparent;
        border-radius: 10px;
        color: #475569;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }

      .sidebar a:hover,
      .sidebar a.active {
        border-color: #ddd6fe;
        color: #5b21b6;
        background: #f5f3ff;
      }

      .sidebar a i {
        width: 20px;
        color: #7c3aed;
        font-size: 18px;
        text-align: center;
      }

      .sidebar-footer {
        margin-top: auto;
        padding: 14px 6px 0;
        color: #64748b;
        font-size: 11px;
        line-height: 1.5;
      }

      iframe {
        flex: 1;
        width: 100%;
        min-width: 0;
        border: 0;
        background: #f4f5fa;
      }

      .overlay {
        display: none;
      }

      @media (max-width: 700px) {
        .topbar {
          gap: 9px;
          padding: 0 10px;
        }

        .menu-toggle {
          display: inline-flex;
        }

        .back-btn {
          padding: 7px 9px;
          font-size: 12px;
        }

        .topbar-title {
          gap: 6px;
          font-size: 14px;
        }

        .topbar-badge {
          display: none;
        }

        .sidebar {
          position: fixed;
          top: 58px;
          bottom: 0;
          left: 0;
          width: 290px;
          transform: translateX(-100%);
          transition: transform 0.2s ease;
        }

        .sidebar.open {
          transform: translateX(0);
        }

        .overlay.visible {
          position: fixed;
          z-index: 0;
          inset: 58px 0 0;
          display: block;
          background: #0f172a66;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-expanded="false">
        <i class="ti ti-menu-2" aria-hidden="true"></i>
      </button>
      <a class="back-btn" href="../index.html">
        <i class="ti ti-arrow-left" aria-hidden="true"></i>
        Dashboard
      </a>
      <div class="topbar-title">
        <i class="ti ti-brain" aria-hidden="true"></i>
        <span>GenAI Reference</span>
      </div>
      <span class="topbar-badge">GenAI Roadmap</span>
    </header>

    <main class="main">
      <nav class="sidebar" id="sidebar" aria-label="GenAI topics">
        <p class="sidebar-heading">GenAI Roadmap</p>
        <a class="active" href="./genai-roadmap-1-overview.html" target="contentFrame" aria-current="page">
          <i class="ti ti-map-2" aria-hidden="true"></i>
          Overview &amp; scope
        </a>
        <a href="./genai-roadmap-2-days-1-14.html" target="contentFrame">
          <i class="ti ti-building-arch" aria-hidden="true"></i>
          Part 1 · Days 1–14
        </a>
        <a href="./genai-roadmap-3-days-15-30.html" target="contentFrame">
          <i class="ti ti-rocket" aria-hidden="true"></i>
          Part 2 · Days 15–30
        </a>
        <p class="sidebar-footer">Select a roadmap topic to open it in the viewer.</p>
      </nav>
      <div class="overlay" id="overlay"></div>
      <iframe
        name="contentFrame"
        id="contentFrame"
        src="./genai-roadmap-1-overview.html"
        title="GenAI roadmap content"
      ></iframe>
    </main>

    <script>
      const sidebar = document.getElementById("sidebar");
      const menuToggle = document.getElementById("menuToggle");
      const overlay = document.getElementById("overlay");
      const navLinks = sidebar.querySelectorAll('a[target="contentFrame"]');

      function closeSidebar() {
        sidebar.classList.remove("open");
        overlay.classList.remove("visible");
        menuToggle.setAttribute("aria-expanded", "false");
      }

      menuToggle.addEventListener("click", () => {
        const isOpen = sidebar.classList.toggle("open");
        overlay.classList.toggle("visible", isOpen);
        menuToggle.setAttribute("aria-expanded", String(isOpen));
      });

      overlay.addEventListener("click", closeSidebar);

      navLinks.forEach((link) => {
        link.addEventListener("click", () => {
          navLinks.forEach((navLink) => {
            navLink.classList.remove("active");
            navLink.removeAttribute("aria-current");
          });
          link.classList.add("active");
          link.setAttribute("aria-current", "page");
          if (window.innerWidth <= 700) closeSidebar();
        });
      });
    </script>
  </body>
</html>
