<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Guides</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="floating-side-nav.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #1e293b; background: #eef1f8; }
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(circle at 8% 8%, #bfdbfe 0, transparent 30%), radial-gradient(circle at 90% 15%, #ddd6fe 0, transparent 28%), linear-gradient(135deg, #eef1f8, #e0f2fe); }
    .topbar { height: 58px; flex-shrink: 0; position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 0 18px; color: #fff; background: linear-gradient(120deg, #1e3a8a, #2563eb 55%, #0e7490); box-shadow: 0 4px 24px rgba(30, 41, 59, .22); }
    button, input { font: inherit; }
    .toggle, .back { border: 1px solid rgba(255,255,255,.24); border-radius: 8px; color: #fff; background: rgba(255,255,255,.14); cursor: pointer; }
    .toggle { width: 36px; height: 36px; font-size: 18px; }
    .back { padding: 7px 14px; margin-left: 6px; }
    .title { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
    .title i { font-size: 22px; }
    .search { width: min(360px, 34vw); margin: 0 auto; padding: 8px 14px; border: 0; border-radius: 20px; outline: 0; }
    .author { margin-left: auto; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .main { display: flex; flex: 1; min-height: 0; position: relative; z-index: 1; }

    /* ══════════ SIDEBAR — redesigned ══════════ */
    .sidebar {
      width: 300px; min-width: 300px; padding: 18px 14px 24px; overflow-y: auto;
      background: #ffffff; border-right: 1px solid rgba(15,23,42,.08);
      box-shadow: 2px 0 18px rgba(30,41,59,.05);
    }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    .sidebar h2 {
      display: flex; align-items: center; gap: 8px;
      margin: 4px 6px 16px; font-size: 12px; font-weight: 900; letter-spacing: .1em;
      text-transform: uppercase; color: #2563eb;
    }
    .sidebar h2::before {
      content: ''; width: 4px; height: 16px; border-radius: 3px;
      background: linear-gradient(180deg,#2563eb,#7c3aed); display:inline-block;
    }

    .sidebar a, .sidebar summary {
      display: flex; gap: 12px; align-items: center; position: relative;
      margin: 6px 0; padding: 12px 12px 12px 14px; border-radius: 12px;
      color: #334155; text-decoration: none; font-size: 14.5px; font-weight: 700;
      line-height: 1.35; cursor: pointer; transition: background .15s ease, color .15s ease, transform .1s ease;
      border: 1px solid transparent;
    }
    .sidebar a::before {
      content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:3px;
      background:transparent; transition: background .15s ease;
    }
    .sidebar summary { list-style: none; font-weight: 800; }
    .sidebar summary::-webkit-details-marker { display: none; }

    .sidebar a:hover, .sidebar summary:hover {
      color: #1d4ed8; background: #eff6ff; transform: translateX(2px);
    }
    .sidebar a.active {
      color: #1d4ed8; background: linear-gradient(90deg,#dbeafe,#eff6ff);
      border-color: #bfdbfe; box-shadow: 0 4px 14px rgba(37,99,235,.12);
    }
    .sidebar a.active::before { background: linear-gradient(180deg,#2563eb,#1d4ed8); }

    .sidebar details { margin: 6px 0; }
    .sidebar .nav-chevron { margin-left: auto; font-size: 15px; color: #94a3b8; transition: transform .2s ease; }
    .sidebar details[open] .nav-chevron { transform: rotate(180deg); color: #2563eb; }
    .sidebar details[open] > summary { color: #1d4ed8; background: #eff6ff; }
    .sidebar .nav-children {
      margin: 4px 0 4px 16px; padding-left: 14px;
      border-left: 2px dashed #bfdbfe;
    }
    .sidebar .nav-children a { font-size: 13.5px; font-weight: 650; padding: 10px 10px 10px 14px; }

    .icon {
      display: grid; place-items: center; width: 32px; height: 32px; flex-shrink: 0;
      border-radius: 9px; color: #fff; font-size: 15px;
      background: linear-gradient(135deg,#2563eb,#3b82f6);
      box-shadow: 0 3px 8px rgba(37,99,235,.35);
    }
    .icon.mern   { background: linear-gradient(135deg,#059669,#10b981); box-shadow:0 3px 8px rgba(5,150,105,.35); }
    .icon.react  { background: linear-gradient(135deg,#0891b2,#06b6d4); box-shadow:0 3px 8px rgba(8,145,178,.35); }
    .icon.js     { background: linear-gradient(135deg,#d97706,#f59e0b); box-shadow:0 3px 8px rgba(217,119,6,.35); }
    .icon.sql    { background: linear-gradient(135deg,#7c3aed,#a855f7); box-shadow:0 3px 8px rgba(124,58,237,.35); }
    .nav-children .icon { width: 26px; height: 26px; font-size: 13px; border-radius: 7px; }

    .nav-badge {
      margin-left: auto; font-size: 10.5px; font-weight: 800; color: #2563eb;
      background: #dbeafe; padding: 2px 8px; border-radius: 10px; flex-shrink: 0;
    }

    iframe { flex: 1; min-width: 0; border: 0; background: #fff; }
    @media (max-width: 768px) { .sidebar { position: absolute; inset: 0 auto 0 -300px; z-index: 3; transition: transform .2s ease; } .sidebar.open { transform: translateX(300px); } .search { width: 34vw; } .author { display: none; } }
  </style>
</head>
<body>
  <div class="bg"></div>
  <header class="topbar">
    <button class="toggle" id="toggle" title="Toggle navigation"><i class="ti ti-menu-2"></i></button>
    <div class="title"><i class="ti ti-presentation"></i><span>Interview Guides</span></div>
    <button class="back" id="back" title="Return to Dev Hub"><i class="ti ti-arrow-left"></i> Back</button>

    <div class="author">Shivam</div>
  </header>
  <main class="main">
    <nav class="sidebar" id="sidebar" aria-label="Interview guides"><h2>Interview Preparation</h2><div id="links"></div></nav>
    <iframe name="contentFrame" id="contentFrame" title="Interview guide content" src="mern/1-mern-stack-developer-90-minute.html"></iframe>
  </main>
  <script>
    const NAV_CONFIG = [{ label: "Interview Preparation", links: [
      { icon: "ti-stack-2", cls: "mern", text: "MERN Stack", badge: "2", children: [
        { icon: "ti-stack-2", cls: "mern", text: "1. MERN Stack Developer - 90 Minute", href: "mern/1-mern-stack-developer-90-minute.html" },
        { icon: "ti-stack-2", cls: "mern", text: "2. MERN Stack Developer - Set 2", href: "mern/2-mern-stack-developer-90-minute-set-2.html" }
      ] },
      { icon: "ti-brand-react", cls: "react", text: "React", badge: "4", children: [
        { icon: "ti-brand-react", cls: "react", text: "1. React Developer - 90 Minute", href: "react/1-react-developer-90-minute.html" },
        { icon: "ti-brand-react", cls: "react", text: "2. React Developer - 60 Minute JavaScript Heavy", href: "react/2-react-developer-60-minute-javascript-heavy.html" },
        { icon: "ti-brand-react", cls: "react", text: "3. React Developer - 90 Minute Set 2", href: "react/3-react-developer-90-minute-set-2.html" },
        { icon: "ti-bug", cls: "react", text: "4. React Debugging Interview Questions", href: "react/4-react-debugging.html" }
      ] },
      { icon: "ti-database", cls: "mongodb", text: "MongoDB", badge: "2", children: [
        { icon: "ti-database", cls: "mongodb", text: "1. MongoDB & Mongoose Quick Notes", href: "mongodb/mongodb-quick.html" },
        { icon: "ti-database", cls: "mongodb", text: "2. MongoDB Query Operators", href: "mongodb/mongodb-query.html" }
      ] },
      { icon: "ti-brand-javascript", cls: "js", text: "JavaScript", badge: "1", children: [
        { icon: "ti-brand-javascript", cls: "js", text: "5. JavaScript Developer - 60 Minute", href: "javascript/5-javascript-60-minute.html" }
      ] },
      { icon: "ti-database", cls: "sql", text: "SQL Interview Prep", badge: "2", children: [
        { icon: "ti-table", cls: "sql", text: "1. PSQL Table Creation Practice", href: "sql/1-table-creation.html" },
        { icon: "ti-table", cls: "sql", text: "2. PSQL Table Insertion Practice", href: "sql/2-table-insertion.html" }
      ] }
    ] }];
    const links = document.getElementById("links");
    const renderLink = link => link.children
      ? `<details><summary><span class="icon ${link.cls||''}"><i class="ti ${link.icon}"></i></span>${link.text}${link.badge ? `<span class="nav-badge">${link.badge}</span>` : ''}<i class="ti ti-chevron-down nav-chevron"></i></summary><div class="nav-children">${link.children.map(renderLink).join("")}</div></details>`
      : `<a href="${link.href}" target="contentFrame"><span class="icon ${link.cls||''}"><i class="ti ${link.icon}"></i></span>${link.text}</a>`;
    links.innerHTML = NAV_CONFIG[0].links.map(renderLink).join("");
    const allLinks = [...links.querySelectorAll("a")];
    allLinks[0].classList.add("active");
    allLinks.forEach(link => link.addEventListener("click", () => { allLinks.forEach(item => item.classList.remove("active")); link.classList.add("active"); document.getElementById("sidebar").classList.remove("open"); }));
    document.getElementById("toggle").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
    document.getElementById("back").addEventListener("click", () => { window.location.href = "../index.html"; });
    document.getElementById("search").addEventListener("input", event => { const query = event.target.value.toLowerCase(); allLinks.forEach(link => { link.hidden = !link.textContent.toLowerCase().includes(query); }); });
  </script>
</body>
</html>
