<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Guides</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="floating-side-nav.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #1e293b; background: #eef1f8; }
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(circle at 8% 8%, #bfdbfe 0, transparent 30%), radial-gradient(circle at 90% 15%, #ddd6fe 0, transparent 28%), linear-gradient(135deg, #eef1f8, #e0f2fe); }
    .topbar { height: 58px; flex-shrink: 0; position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 0 18px; color: #fff; background: linear-gradient(120deg, #1e3a8a, #2563eb 55%, #0e7490); box-shadow: 0 4px 24px rgba(30, 41, 59, .22); }
    button, input { font: inherit; }
    .toggle, .back { border: 1px solid rgba(255,255,255,.24); border-radius: 8px; color: #fff; background: rgba(255,255,255,.14); cursor: pointer; }
    .toggle { width: 36px; height: 36px; font-size: 18px; }
    .back { padding: 7px 14px; margin-left: 6px; }
    .title { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
    .title i { font-size: 22px; }
    .search { width: min(360px, 34vw); margin: 0 auto; padding: 8px 14px; border: 0; border-radius: 20px; outline: 0; }
    .author { margin-left: auto; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .main { display: flex; flex: 1; min-height: 0; position: relative; z-index: 1; }
    .sidebar { width: 296px; min-width: 296px; padding: 16px 12px; overflow-y: auto; background: #fff; border-right: 1px solid rgba(15,23,42,.08); }
    .sidebar h2 { margin: 4px 8px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #2563eb; }
    .sidebar a { display: flex; gap: 10px; align-items: center; margin: 5px 0; padding: 11px 10px; border: 1px solid transparent; border-radius: 10px; color: #475569; text-decoration: none; font-size: 14px; line-height: 1.35; }
    .sidebar a:hover, .sidebar a.active { color: #1d4ed8; background: #dbeafe; border-color: #93c5fd; }
    .icon { display: grid; place-items: center; width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; color: #fff; background: #2563eb; }
    iframe { flex: 1; min-width: 0; border: 0; background: #fff; }
    @media (max-width: 768px) { .sidebar { position: absolute; inset: 0 auto 0 -296px; z-index: 3; transition: transform .2s ease; } .sidebar.open { transform: translateX(296px); } .search { width: 34vw; } .author { display: none; } }
  </style>
</head>
<body>
  <div class="bg"></div>
  <header class="topbar">
    <button class="toggle" id="toggle" title="Toggle navigation"><i class="ti ti-menu-2"></i></button>
    <div class="title"><i class="ti ti-presentation"></i><span>Interview Guides</span></div>
    <button class="back" id="back" title="Return to Dev Hub"><i class="ti ti-arrow-left"></i> Back</button>
    <input class="search" id="search" type="search" placeholder="Search guides..." aria-label="Search guides" />
    <div class="author">Shivam</div>
  </header>
  <main class="main">
    <nav class="sidebar" id="sidebar" aria-label="Interview guides"><h2>Interview Preparation</h2><div id="links"></div></nav>
    <iframe name="contentFrame" id="contentFrame" title="Interview guide content" src="1-mern-stack-developer-90-minute.html"></iframe>
  </main>
  <script>
    const NAV_CONFIG = [{ label: "Interview Preparation", links: [
      { icon: "ti-stack-2", text: "1. MERN Stack Developer - 90 Minute", href: "1-mern-stack-developer-90-minute.html" },
      { icon: "ti-stack-2", text: "2. MERN Stack Developer - Set 2", href: "2-mern-stack-developer-90-minute-set-2.html" },
      { icon: "ti-brand-react", text: "3. React Developer - 90 Minute", href: "3-react-developer-90-minute.html" },
      { icon: "ti-brand-react", text: "4. React Developer - 60 Minute JavaScript Heavy", href: "4-react-developer-60-minute-javascript-heavy.html" }
    ] }];
    const links = document.getElementById("links");
    links.innerHTML = NAV_CONFIG[0].links.map(link => `<a href="${link.href}" target="contentFrame"><span class="icon"><i class="ti ${link.icon}"></i></span>${link.text}</a>`).join("");
    const allLinks = [...links.querySelectorAll("a")];
    allLinks[0].classList.add("active");
    allLinks.forEach(link => link.addEventListener("click", () => { allLinks.forEach(item => item.classList.remove("active")); link.classList.add("active"); document.getElementById("sidebar").classList.remove("open"); }));
    document.getElementById("toggle").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
    document.getElementById("back").addEventListener("click", () => { window.location.href = "../index.html"; });
    document.getElementById("search").addEventListener("input", event => { const query = event.target.value.toLowerCase(); allLinks.forEach(link => { link.hidden = !link.textContent.toLowerCase().includes(query); }); });
  </script>
</body>
</html>
