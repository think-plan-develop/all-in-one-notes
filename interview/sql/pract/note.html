<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Interview Practice</title>
    <link rel="stylesheet" href="../../../sql/shared/content-types.css">
    <link rel="stylesheet" href="../../../sql/floating-side-nav.css">
</head>
<body>
    <main class="page-shell" id="page"></main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const dataFile = params.get("data");

        function loadRenderer() {
            const renderer = document.createElement("script");
            renderer.src = "../../../sql/shared/note-renderer.js";
            renderer.defer = true;
            document.head.append(renderer);
        }

        if (dataFile) {
            const dataScript = document.createElement("script");
            dataScript.src = dataFile;
            dataScript.onload = loadRenderer;
            dataScript.onerror = loadRenderer;
            document.head.append(dataScript);
        } else {
            loadRenderer();
        }
    </script>
    <nav class="side-nav" aria-label="Section navigation"></nav>
    <script src="../../../sql/floating-side-nav.js"></script>
</body>
</html>
