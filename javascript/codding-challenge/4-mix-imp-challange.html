<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top JavaScript Interview Problems</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1e2330; --muted:#5d6578; --accent:#4f46e5; --border:#e3e6ef; --code-bg:#12161f; --code-text:#e6e9f2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1220; --card:#181c2e; --text:#e8eaf4; --muted:#9aa2bb; --accent:#8b85ff; --border:#2a3050; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px 16px 64px; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.6; }
  .wrap { max-width:860px; margin:0 auto; }
  h1 { font-size:1.9rem; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  #search { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:10px; background:var(--card); color:var(--text); font-size:1rem; margin-bottom:8px; }
  h2 { margin:32px 0 12px; font-size:1.25rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:16px; }
  .card h3 { margin:0 0 10px; font-size:1.05rem; color:var(--accent); }
  .num { display:inline-block; min-width:28px; margin-right:6px; color:var(--muted); }
  pre { margin:0; padding:14px 16px; background:var(--code-bg); color:var(--code-text); border-radius:8px; overflow-x:auto; font-size:.86rem; line-height:1.5; }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .out { margin:8px 0 0; font-size:.86rem; color:var(--muted); }
  .out code { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Top JavaScript Interview Problems</h1>
  <p class="sub">Highest priority, frequently asked. Every problem is stored in one array and rendered by a loop.</p>
  <input id="search" type="search" placeholder="Search problems...">
  <div id="root"></div>
</div>

<script>
// ---------- All problems live in one array ----------
const problems = [
  // ===== Arrays =====
  { cat: "Arrays", title: "Remove Duplicates from an Array",
    code: `const arr = [1, 2, 2, 3, 4, 4, 5];
const unique = [...new Set(arr)];
console.log(unique);`,
    output: "[1, 2, 3, 4, 5]" },
  { cat: "Arrays", title: "Merge Two Arrays and Remove Duplicates",
    code: `const a = [1, 2, 3], b = [3, 4, 5];
const merged = [...new Set([...a, ...b])];
console.log(merged);`,
    output: "[1, 2, 3, 4, 5]" },
  { cat: "Arrays", title: "Sort Array of Objects by Property",
    code: `const users = [
  { name: "Ravi", age: 30 },
  { name: "Asha", age: 25 },
  { name: "Kiran", age: 35 }
];
users.sort((x, y) => x.age - y.age);            // numbers
// users.sort((x, y) => x.name.localeCompare(y.name)); // strings
console.log(users.map(u => u.name));`,
    output: "['Asha', 'Ravi', 'Kiran']" },
  { cat: "Arrays", title: "Extract Specific Property Values from Objects as an Array",
    code: `const users = [{ name: "Ravi", age: 30 }, { name: "Asha", age: 25 }];
const names = users.map(u => u.name);
console.log(names);`,
    output: "['Ravi', 'Asha']" },
  { cat: "Arrays", title: "Find the Intersection of Two Arrays",
    code: `const a = [1, 2, 3, 4], b = [3, 4, 5, 6];
const common = a.filter(x => b.includes(x));
console.log(common);`,
    output: "[3, 4]" },
  { cat: "Arrays", title: "Compare Two Arrays for Equality",
    code: `function isEqual(a, b) {
  return a.length === b.length && a.every((v, i) => v === b[i]);
}
console.log(isEqual([1, 2, 3], [1, 2, 3]));
console.log(isEqual([1, 2, 3], [1, 3, 2]));`,
    output: "true, false" },
  { cat: "Arrays", title: "Chunk an Array into Smaller Sub-arrays",
    code: `function chunk(arr, size) {
  const result = [];
  for (let i = 0; i < arr.length; i += size) {
    result.push(arr.slice(i, i + size));
  }
  return result;
}
console.log(chunk([1, 2, 3, 4, 5, 6, 7], 3));`,
    output: "[[1, 2, 3], [4, 5, 6], [7]]" },

  // ===== Strings =====
  { cat: "Strings", title: "Count Character Occurrences in a String",
    code: `const str = "hello";
const count = {};
for (const ch of str) {
  count[ch] = (count[ch] || 0) + 1;
}
console.log(count);`,
    output: "{ h: 1, e: 1, l: 2, o: 1 }" },
  { cat: "Strings", title: "Reverse a String",
    code: `const str = "hello";
const reversed = str.split("").reverse().join("");
console.log(reversed);`,
    output: "olleh" },
  { cat: "Strings", title: "Check if a String is a Palindrome",
    code: `function isPalindrome(s) {
  const clean = s.toLowerCase().replace(/[^a-z0-9]/g, "");
  return clean === clean.split("").reverse().join("");
}
console.log(isPalindrome("Madam"));
console.log(isPalindrome("hello"));`,
    output: "true, false" },
  { cat: "Strings", title: "Sort Words Alphabetically",
    code: `const sentence = "banana apple cherry";
const sorted = sentence.split(" ").sort((a, b) => a.localeCompare(b));
console.log(sorted.join(" "));`,
    output: "apple banana cherry" },

  // ===== Numbers =====
  { cat: "Numbers", title: "Find the Largest of Three Numbers",
    code: `const a = 10, b = 45, c = 30;
console.log(Math.max(a, b, c));`,
    output: "45" },
  { cat: "Numbers", title: "Check If a Number is Prime",
    code: `function isPrime(n) {
  if (n < 2) return false;
  for (let i = 2; i * i <= n; i++) {
    if (n % i === 0) return false;
  }
  return true;
}
console.log(isPrime(7), isPrime(10));`,
    output: "true false" },
  { cat: "Numbers", title: "Find the Factorial of a Number",
    code: `function factorial(n) {
  let result = 1;
  for (let i = 2; i <= n; i++) result *= i;
  return result;
}
console.log(factorial(5));`,
    output: "120" },
  { cat: "Numbers", title: "Print Fibonacci Sequence",
    code: `function fib(n) {
  const seq = [0, 1];
  for (let i = 2; i < n; i++) {
    seq.push(seq[i - 1] + seq[i - 2]);
  }
  return seq.slice(0, n);
}
console.log(fib(8));`,
    output: "[0, 1, 1, 2, 3, 5, 8, 13]" },
  { cat: "Numbers", title: "Find HCF / GCD",
    code: `function gcd(a, b) {
  return b === 0 ? a : gcd(b, a % b);
}
console.log(gcd(48, 18));`,
    output: "6" },

  // ===== Data Structures =====
  { cat: "Data Structures", title: "Implement a Stack Using JavaScript",
    code: `class Stack {
  constructor() { this.items = []; }
  push(x)   { this.items.push(x); }
  pop()     { return this.items.pop(); }
  peek()    { return this.items[this.items.length - 1]; }
  isEmpty() { return this.items.length === 0; }
  size()    { return this.items.length; }
}
const s = new Stack();
s.push(1); s.push(2); s.push(3);
console.log(s.pop(), s.peek(), s.size());`,
    output: "3 2 2   (LIFO: last in, first out)" },
  { cat: "Data Structures", title: "Implement a Queue in JavaScript",
    code: `class Queue {
  constructor() { this.items = []; }
  enqueue(x) { this.items.push(x); }
  dequeue()  { return this.items.shift(); }
  front()    { return this.items[0]; }
  isEmpty()  { return this.items.length === 0; }
  size()     { return this.items.length; }
}
const q = new Queue();
q.enqueue(1); q.enqueue(2); q.enqueue(3);
console.log(q.dequeue(), q.front(), q.size());`,
    output: "1 2 2   (FIFO: first in, first out)" },

  // ===== Objects =====
  { cat: "Objects", title: "Clone a JavaScript Object",
    code: `const obj = { name: "Ravi", address: { city: "Hyderabad" } };

const shallow = { ...obj };             // nested objects are shared
const deep = structuredClone(obj);      // fully independent copy

deep.address.city = "Pune";
console.log(obj.address.city);`,
    output: "Hyderabad" },
  { cat: "Objects", title: "Merge Properties of Two Objects",
    code: `const a = { name: "Ravi", age: 30 };
const b = { age: 31, city: "Hyderabad" };
const merged = { ...a, ...b };   // or Object.assign({}, a, b)
console.log(merged);`,
    output: "{ name: 'Ravi', age: 31, city: 'Hyderabad' }" },
  { cat: "Objects", title: "Delete an Object Property",
    code: `const obj = { name: "Ravi", age: 30 };
delete obj.age;
console.log(obj);`,
    output: "{ name: 'Ravi' }" },
  { cat: "Objects", title: "Check for Key Presence in JavaScript Object",
    code: `const obj = { name: "Ravi", age: 30 };
console.log("name" in obj);
console.log(Object.hasOwn(obj, "age"));
console.log(obj.hasOwnProperty("city"));`,
    output: "true, true, false" },
  { cat: "Objects", title: "Iterate Through Object Properties",
    code: `const obj = { name: "Ravi", age: 30 };

for (const key in obj) {
  console.log(key, obj[key]);
}

Object.entries(obj).forEach(([key, value]) => {
  console.log(key, value);
});`,
    output: "name Ravi, age 30 (printed twice)" },

  // ===== Type Checks =====
  { cat: "Type Checks", title: "Check if a Given Object is an Array",
    code: `console.log(Array.isArray([1, 2, 3]));
console.log(Array.isArray({ a: 1 }));`,
    output: "true, false" },
  { cat: "Type Checks", title: "Check if a Variable is undefined or null",
    code: `let x;
console.log(x === undefined);
console.log(x === null);
console.log(x == null);   // true for both undefined and null
console.log(x ?? "default");`,
    output: "true, false, true, default" }
];

// ---------- Helpers ----------
function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => { node[k] = v; });
  children.forEach(c => node.append(c));
  return node;
}

// ---------- Render (loops) ----------
const root = document.getElementById("root");

function render(list) {
  root.textContent = "";
  let lastCat = "";
  list.forEach(p => {
    if (p.cat !== lastCat) {
      root.append(el("h2", { textContent: p.cat }));
      lastCat = p.cat;
    }
    root.append(el("div", { className: "card" }, [
      el("h3", {}, [el("span", { className: "num", textContent: p.id + "." }), p.title]),
      el("pre", {}, [el("code", { textContent: p.code })]),
      el("p", { className: "out" }, ["Output: ", el("code", { textContent: p.output })])
    ]));
  });
  if (list.length === 0) root.append(el("p", { className: "sub", textContent: "No problems found." }));
}

problems.forEach((p, i) => { p.id = i + 1; });
render(problems);

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  render(problems.filter(p => p.title.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q)));
});
</script>
</body>
</html>
