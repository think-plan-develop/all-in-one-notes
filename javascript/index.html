<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Documentation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { display: flex; flex-direction: column; height: 100vh; font-family: "Segoe UI", system-ui, sans-serif; background: #f8fafc; color: #1e293b; overflow: hidden; }

      /* Topbar */
      .topbar { height: 56px; flex-shrink: 0; background: linear-gradient(135deg, #2563eb, #4f46e5); display: flex; align-items: center; gap: 12px; padding: 0 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); z-index: 200; color: #fff; }

      .sidebar-toggle {
        width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        border-radius: 8px; border: none; background: rgba(255,255,255,0.15); color: #fff; cursor: pointer;
        transition: background 0.2s ease; font-size: 18px;
      }
      .sidebar-toggle:hover { background: rgba(255,255,255,0.28); }

      .topbar-title { display: flex; align-items: center; gap: 12px; }

      .main { display: flex; flex: 1; overflow: hidden; position: relative; }

      /* Sidebar */
      .sidebar {
        width: 280px; min-width: 280px; background: #ffffff; border-right: 1px solid #e2e8f0;
        display: flex; flex-direction: column; overflow: hidden;
        transition: width 0.22s ease, min-width 0.22s ease, transform 0.3s ease;
      }
      .main.collapsed .sidebar { width: 0; min-width: 0; border-right: none; }

      .sidebar-inner { flex: 1; overflow-y: auto; padding: 16px; scrollbar-width: thin; width: 280px; }
      .sidebar-group-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; padding: 12px 10px 8px; }
      .sidebar a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 2px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; color: #475569; transition: all 0.2s ease; }
      .sidebar a:hover { background: #f1f5f9; color: #1e293b; }
      .sidebar a.active { background: #eff6ff; color: #2563eb; }
      .nav-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 7px; }

      /* Mobile Overlay */
      .sidebar-overlay {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 150;
      }

      iframe { flex: 1; border: none; background: #fff; }

      /* Mobile Styles */
      @media (max-width: 768px) {
        .sidebar {
          position: absolute; left: -280px; height: 100%; z-index: 1000; box-shadow: 10px 0 15px rgba(0,0,0,0.1);
        }
        .sidebar.mobile-open { left: 0; }
        .sidebar.mobile-open + .sidebar-overlay { display: block; }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
        <i class="ti ti-menu-2"></i>
      </button>
      <div class="topbar-title">
        <i class="ti ti-brand-javascript" style="font-size: 24px;"></i>
        <span style="font-weight: 700; font-size: 18px;">JavaScript Reference</span>
      </div>
    </div>

    <div class="main" id="main">
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-inner" id="sidebarInner"></div>
      </nav>
      <div class="sidebar-overlay" id="sidebarOverlay"></div>
      <iframe name="contentFrame" id="contentFrame" src="./01-basics.html"></iframe>
    </div>

    <script>
      const NAV_CONFIG = [
        {
          label: "Core Fundamentals",
          links: [
            { icon: "ti-braces", color: "#2563eb", text: "01. Basics", href: "./01-basics.html" },
            { icon: "ti-layers-intersect", color: "#7c3aed", text: "02. Execution Context", href: "./02-execution-context.html" },
            { icon: "ti-arrow-up", color: "#7c3aed", text: "03. Hoisting", href: "./03-hoisting.html" },
            { icon: "ti-scope", color: "#7c3aed", text: "04. Scope", href: "./04-scope.html" },
            { icon: "ti-function", color: "#0891b2", text: "05. Functions", href: "./05-functions.html" },
            { icon: "ti-lock", color: "#db2777", text: "06. Closures", href: "./06-closures.html" }
          ]
        },
        {
          label: "Objects & Data",
          links: [
            { icon: "ti-rectangle", color: "#d97706", text: "07. This Keyword", href: "./07-this-keyword.html" },
            { icon: "ti-briefcase", color: "#d97706", text: "08. Call, Apply, Bind", href: "./08-call-apply-bind.html" },
            { icon: "ti-box", color: "#059669", text: "09. Objects", href: "./09-objects.html" },
            { icon: "ti-list", color: "#7c3aed", text: "10. Arrays", href: "./10-arrays.html" },
            { icon: "ti-letter-case", color: "#0d9488", text: "11. Strings", href: "./11-strings.html" },
            { icon: "ti-affiliate", color: "#7e22ce", text: "12. Prototypes", href: "./12-prototypes.html" }
          ]
        },
        {
          label: "Async & Advanced",
          links: [
            { icon: "ti-sparkles", color: "#ea580c", text: "13. ES6 Features", href: "./13-es6-features.html" },
            { icon: "ti-clock-bolt", color: "#7c3aed", text: "14. callback", href: "./14.1-callback.html" },
            { icon: "ti-clock-bolt", color: "#7c3aed", text: "14. Promise", href: "./14-promise.html" },
            { icon: "ti-clock-bolt", color: "#7c3aed", text: "15. Async JS", href: "./15-async-js.html" },
            { icon: "ti-refresh", color: "#0891b2", text: "16. Event Loop", href: "./16-event-loop.html" },
            { icon: "ti-browser", color: "#4338ca", text: "17. DOM", href: "./17-dom.html" },
            { icon: "ti-cube", color: "#dc2626", text: "18. OOP Concepts", href: "./18-oop-concepts.html" },
            { icon: "ti-wand", color: "#db2777", text: "19. Special Functions", href: "./19-special-functions.html" },
            { icon: "ti-database", color: "#0891b2", text: "20. Browser Storage", href: "./20-browser-storage.html" },
            { icon: "ti-api", color: "#059669", text: "21. Web APIs", href: "./21-web-apis.html" }
          ]
        },
        {
          label: "Interview Q&A",
          links: [
            { icon: "ti-bolt", color: "#d97706", text: "22. Short Q&A Part I", href: "./22-short-qna-part-i.html" },
            { icon: "ti-file-description", color: "#7c3aed", text: "23. Long Q&A Part II", href: "./23-long-qna-part-ii.html" },
            { icon: "ti-variable", color: "#2563eb", text: "24. Var, Func & Obj Q&A", href: "./24-var-func-obj-qna.html" },
            { icon: "ti-list-numbers", color: "#7c3aed", text: "25. Array Q&A", href: "./25-array-qna.html" },
            { icon: "ti-sparkles", color: "#ea580c", text: "26. ES6 Q&A", href: "./26-es6-qna.html" },
            { icon: "ti-browser-check", color: "#0d9488", text: "27. DOM & Browser Q&A", href: "./27-dom-browser-qna.html" },
            { icon: "ti-code", color: "#0d9488", text: "28. Coding Challenges", href: "./28-coding-challenges.html" },
            { icon: "ti-question-mark", color: "#0d9488", text: "29. Frequently Asked", href: "./29-frequently-asked.html" }
          ]
        }
      ];

      function buildNav(config) {
        const inner = document.getElementById("sidebarInner");
        inner.innerHTML = config.map(section => `
          <div class="sidebar-section">
            <div class="sidebar-group-label">${section.label}</div>
            ${section.links.map(link => `
              <a href="${link.href}" target="contentFrame">
                <span class="nav-icon" style="background:${link.color}15; color:${link.color};">
                  <i class="ti ${link.icon}"></i>
                </span>
                ${link.text}
              </a>
            `).join('')}
          </div>
        `).join('');

        // Close mobile sidebar when clicking a link
        inner.querySelectorAll('a').forEach(link => {
          link.addEventListener("click", () => {
            if (window.innerWidth <= 768) {
              sidebar.classList.remove("mobile-open");
            }
            inner.querySelectorAll("a").forEach(a => a.classList.remove("active"));
            link.classList.add("active");
          });
        });
      }

      buildNav(NAV_CONFIG);

      // Toggle Logic
      const sidebar = document.getElementById("sidebar");
      const main = document.getElementById("main");
      const toggleBtn = document.getElementById("sidebarToggle");
      const overlay = document.getElementById("sidebarOverlay");

      // Toggle action
      toggleBtn.addEventListener("click", () => {
        if (window.innerWidth <= 768) {
          sidebar.classList.toggle("mobile-open");
        } else {
          main.classList.toggle("collapsed");
        }
      });

      // Close on overlay click
      overlay.addEventListener("click", () => {
        sidebar.classList.remove("mobile-open");
      });
    </script>
  </body>
</html>
