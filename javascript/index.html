<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Documentation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex; flex-direction: column; height: 100vh; font-family: "Segoe UI", system-ui, sans-serif;
        color: #1e293b; overflow: hidden; position: relative;
        background: #eef1f8;
      }

      /* ── Ambient color blobs behind everything, so the glass panels have color to refract ── */
      .bg-blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
      .bg-blobs span {
        position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55;
      }
      .bg-blobs .b1 { width: 480px; height: 480px; top: -160px; left: -120px; background: radial-gradient(circle, #6366f1, transparent 70%); }
      .bg-blobs .b2 { width: 460px; height: 460px; top: 10%; left: 60%; background: radial-gradient(circle, #ec4899, transparent 70%); }
      .bg-blobs .b3 { width: 420px; height: 420px; bottom: -140px; left: 10%; background: radial-gradient(circle, #10b981, transparent 70%); }
      .bg-blobs .b4 { width: 400px; height: 400px; bottom: -100px; right: -100px; background: radial-gradient(circle, #f59e0b, transparent 70%); }
      .bg-blobs .b5 { width: 360px; height: 360px; top: 40%; left: 28%; background: radial-gradient(circle, #06b6d4, transparent 70%); }

      /* Topbar */
      .topbar {
        height: 58px; flex-shrink: 0; position: relative; z-index: 200;
        background: linear-gradient(120deg, rgba(30,58,138,0.92), rgba(79,70,229,0.92) 60%, rgba(109,40,217,0.92));
        backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
        display: flex; align-items: center; gap: 12px; padding: 0 18px;
        box-shadow: 0 4px 24px rgba(30, 41, 59, 0.22); color: #fff;
        border-bottom: 1px solid rgba(255,255,255,0.14);
      }

      .sidebar-toggle {
        width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        border-radius: 9px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.14); color: #fff; cursor: pointer;
        transition: background 0.2s ease, transform 0.15s ease; font-size: 18px;
      }
      .sidebar-toggle:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }

      .topbar-title { display: flex; align-items: center; gap: 10px; }
      .topbar-title i { font-size: 22px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); background: linear-gradient(120deg,#fde68a,#fca5f5); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .topbar-title span { font-weight: 700; font-size: 17.5px; letter-spacing: .2px; }

      .back-btn {
        display: flex; align-items: center; gap: 6px; padding: 7px 14px; margin-left: 6px;
        border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.14);
        color: #fff; font-size: 13.5px; font-weight: 600; text-decoration: none; cursor: pointer;
        transition: background 0.2s ease, transform 0.15s ease;
      }
      .back-btn:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }
      .back-btn i { font-size: 16px; }

      .topbar-author {
        margin-left: auto; display: flex; align-items: center; gap: 8px;
        font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.92);
        background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
        padding: 6px 12px; border-radius: 20px; white-space: nowrap;
      }
      .topbar-author i { font-size: 15px; opacity: 0.85; }

      .main { display: flex; flex: 1; overflow: hidden; position: relative; z-index: 1; }

      /* ── Glassy sidebar ── */
      .sidebar {
        width: 296px; min-width: 296px;
        background: #ffffff;
        border-right: 1px solid rgba(15,23,42,0.08);
        display: flex; flex-direction: column; overflow: hidden;
        transition: width 0.22s ease, min-width 0.22s ease, transform 0.3s ease;
        box-shadow: 8px 0 32px rgba(30, 41, 59, 0.08);
      }
      .main.collapsed .sidebar { width: 0; min-width: 0; border-right: none; box-shadow: none; }

      .sidebar-inner { flex: 1; overflow-y: auto; padding: 16px 12px 24px; scrollbar-width: thin; width: 296px; }
      .sidebar-inner::-webkit-scrollbar { width: 6px; }
      .sidebar-inner::-webkit-scrollbar-thumb { background: linear-gradient(180deg,#818cf8,#f472b6); border-radius: 10px; }

      /* Each topic gets its own solid, tinted panel */
      .sidebar-section {
        margin-bottom: 12px; padding: 10px 8px 10px; border-radius: 16px;
        background: var(--sec-tint-a);
        border: 1px solid var(--sec-border);
      }

      .sidebar-group-label {
        display: flex; align-items: center; gap: 8px;
        font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px;
        color: var(--sec-color); padding: 4px 6px 8px;
      }
      .sidebar-group-label .dot {
        width: 7px; height: 7px; border-radius: 50%; background: var(--sec-color); flex-shrink: 0;
      }

      .sidebar a {
        display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 9px; margin-bottom: 3px;
        border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #475569;
        border: 1px solid transparent;
        transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease, transform 0.12s ease, box-shadow 0.16s ease;
      }
      .sidebar a:hover {
        background: var(--tint-strong);
        color: var(--c);
        border-color: var(--tint-strong);
      }
      .sidebar a.active {
        background: var(--tint-strong);
        color: var(--c);
        font-weight: 700;
        border-color: var(--c);
      }

      .nav-icon {
        width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        border-radius: 9px; font-size: 14.5px; color: #fff;
        background: var(--c);
      }
      .sidebar a:hover .nav-icon, .sidebar a.active .nav-icon { transform: scale(1.1) rotate(-3deg); }

      /* Mobile Overlay */
      .sidebar-overlay {
        display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35); z-index: 150;
      }

      iframe { flex: 1; border: none; background: #fff; position: relative; z-index: 1; }

      /* Mobile Styles */
      @media (max-width: 768px) {
        .sidebar {
          position: absolute; left: -296px; height: 100%; z-index: 1000; box-shadow: 10px 0 30px rgba(0,0,0,0.2);
        }
        .sidebar.mobile-open { left: 0; }
        .sidebar.mobile-open + .sidebar-overlay { display: block; }
      }
    </style>
  </head>
  <body>
    <div class="bg-blobs">
      <span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span><span class="b5"></span>
    </div>

    <div class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
        <i class="ti ti-menu-2"></i>
      </button>
      <div class="topbar-title">
        <i class="ti ti-brand-javascript"></i>
        <span>JavaScript Reference</span>
      </div>
      <button class="back-btn" id="backBtn" title="Go back">
        <i class="ti ti-arrow-left"></i>
        Back
      </button>
      <div class="topbar-author">
        <i class="ti ti-user"></i>
        Author: Shivam
      </div>
    </div>

    <div class="main" id="main">
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-inner" id="sidebarInner"></div>
      </nav>
      <div class="sidebar-overlay" id="sidebarOverlay"></div>
      <iframe name="contentFrame" id="contentFrame" src="./01-javascript-basics.html"></iframe>
    </div>

    <script>
     const NAV_CONFIG = [
  {
    label: "JavaScript Fundamentals",
    color: "#2563eb",
    links: [
      { icon: "ti-braces", color: "#2563eb", light: "#60a5fa", text: "01. JavaScript Basics", href: "./01-javascript-basics.html" },
      { icon: "ti-code", color: "#1d4ed8", light: "#3b82f6", text: "02. JavaScript Basics - Part 2", href: "./02-javascript-basics-part-2.html" }
    ]
  },

  {
    label: "Execution & Scope",
    color: "#7c3aed",
    links: [
      { icon: "ti-cpu", color: "#7c3aed", light: "#a78bfa", text: "03. Execution Context", href: "./03-execution-context.html" },
      { icon: "ti-arrow-up", color: "#8b5cf6", light: "#c4b5fd", text: "04. Hoisting", href: "./04-hoisting.html" },
      { icon: "ti-focus-2", color: "#a855f7", light: "#d8b4fe", text: "05. Scope", href: "./05-scope.html" },
      { icon: "ti-function", color: "#7c3aed", light: "#a78bfa", text: "06. Functions", href: "./06-functions.html" },
      { icon: "ti-lock", color: "#9333ea", light: "#c084fc", text: "07. Closures", href: "./07-closures.html" },
      { icon: "ti-target-arrow", color: "#8b5cf6", light: "#c4b5fd", text: "08. this Keyword", href: "./08-this-keyword.html" },
      { icon: "ti-briefcase", color: "#a855f7", light: "#d8b4fe", text: "09. call(), apply() & bind()", href: "./09-call-apply-bind.html" }
    ]
  },

  {
    label: "Data Structures",
    color: "#059669",
    links: [
      { icon: "ti-box", color: "#059669", light: "#34d399", text: "10. Objects", href: "./10-objects.html" },
      { icon: "ti-list", color: "#10b981", light: "#6ee7b7", text: "11. Arrays", href: "./11-arrays.html" },
      { icon: "ti-letter-case", color: "#0d9488", light: "#5eead4", text: "12. Strings", href: "./12-strings.html" }
    ]
  },

  {
    label: "Object-Oriented JavaScript",
    color: "#4d7c0f",
    links: [
      { icon: "ti-affiliate", color: "#4d7c0f", light: "#bef264", text: "13. Prototypes", href: "./13-prototypes.html" },
      { icon: "ti-cube", color: "#65a30d", light: "#d9f99d", text: "14. Object-Oriented Programming (OOP)", href: "./14-object-oriented-programming.html" }
    ]
  },

  {
    label: "Modern JavaScript (ES6+)",
    color: "#ea580c",
    links: [
      { icon: "ti-sparkles", color: "#ea580c", light: "#fb923c", text: "15. ES6 Features", href: "./15-es6-features.html" },
      { icon: "ti-stars", color: "#f97316", light: "#fdba74", text: "16. Advanced ES6 Features", href: "./16-advanced-es6-features.html" },
      { icon: "ti-category", color: "#d97706", light: "#fbbf24", text: "17. Map & Set", href: "./17-map-set.html" },
      { icon: "ti-repeat", color: "#ea580c", light: "#fb923c", text: "18. Iterators & Generators", href: "./18-iterators-generators.html" },
      { icon: "ti-wand", color: "#f97316", light: "#fdba74", text: "19. Special Functions", href: "./19-special-functions.html" }
    ]
  },

  {
    label: "Asynchronous JavaScript",
    color: "#0891b2",
    links: [
      { icon: "ti-clock-bolt", color: "#0891b2", light: "#22d3ee", text: "20. Callback Functions", href: "./20-callback-functions.html" },
      { icon: "ti-checklist", color: "#0ea5e9", light: "#7dd3fc", text: "21. Promises", href: "./21-promises.html" },
      { icon: "ti-hourglass", color: "#06b6d4", light: "#67e8f9", text: "22. Async / Await", href: "./22-async-await.html" },
      { icon: "ti-refresh", color: "#0891b2", light: "#22d3ee", text: "23. Event Loop", href: "./23-event-loop.html" }
    ]
  },

  {
    label: "Browser Environment",
    color: "#4338ca",
    links: [
      { icon: "ti-browser", color: "#4338ca", light: "#818cf8", text: "24. DOM & Event System", href: "./24-dom-event-system.html" },
      { icon: "ti-api", color: "#4f46e5", light: "#a5b4fc", text: "25. Web APIs", href: "./25-web-apis.html" },
      { icon: "ti-database", color: "#6366f1", light: "#a5b4fc", text: "26. Browser Storage", href: "./26-browser-storage.html" }
    ]
  },

  {
    label: "Interview Preparation",
    color: "#0c4a6e",
    links: [
      { icon: "ti-bolt", color: "#0c4a6e", light: "#7dd3fc", text: "27. JavaScript Short Q&A", href: "./27-javascript-short-questions.html" },
      { icon: "ti-file-description", color: "#0369a1", light: "#67e8f9", text: "28. JavaScript Long Q&A", href: "./28-javascript-long-questions.html" },
      { icon: "ti-variable", color: "#0284c7", light: "#93c5fd", text: "29. Variables, Functions & Objects Q&A", href: "./29-variables-functions-objects-questions.html" },
      { icon: "ti-list-numbers", color: "#0c4a6e", light: "#7dd3fc", text: "30. Array Interview Questions", href: "./30-array-interview-questions.html" },
      { icon: "ti-sparkles", color: "#0369a1", light: "#67e8f9", text: "31. ES6 Interview Questions", href: "./31-es6-interview-questions.html" },
      { icon: "ti-code", color: "#0c4a6e", light: "#7dd3fc", text: "33. Coding Challenges", href: "./33-coding-challenges.html" },
      { icon: "ti-question-mark", color: "#0369a1", light: "#67e8f9", text: "34. Frequently Asked Questions", href: "./34-frequently-asked-questions.html" }
    ]
  }
];
      function buildNav(config) {
        const inner = document.getElementById("sidebarInner");
        inner.innerHTML = config.map(section => `
          <div class="sidebar-section" style="--sec-color:${section.color}; --sec-tint-a:${section.color}22; --sec-tint-b:${section.color}05; --sec-border:${section.color}30;">
            <div class="sidebar-group-label"><span class="dot"></span>${section.label}</div>
            ${section.links.map(link => `
              <a href="${link.href}" target="contentFrame" style="--c:${link.color}; --c-light:${link.light}; --tint-strong:${link.color}33;">
                <span class="nav-icon">
                  <i class="ti ${link.icon}"></i>
                </span>
                ${link.text}
              </a>
            `).join('')}
          </div>
        `).join('');

        // Close mobile sidebar when clicking a link
        inner.querySelectorAll('a').forEach(link => {
          link.addEventListener("click", () => {
            if (window.innerWidth <= 768) {
              sidebar.classList.remove("mobile-open");
            }
            inner.querySelectorAll("a").forEach(a => a.classList.remove("active"));
            link.classList.add("active");
          });
        });
      }

      buildNav(NAV_CONFIG);

      // Toggle Logic
      const sidebar = document.getElementById("sidebar");
      const main = document.getElementById("main");
      const toggleBtn = document.getElementById("sidebarToggle");
      const overlay = document.getElementById("sidebarOverlay");

      // Toggle action
      toggleBtn.addEventListener("click", () => {
        if (window.innerWidth <= 768) {
          sidebar.classList.toggle("mobile-open");
        } else {
          main.classList.toggle("collapsed");
        }
      });

      // Back button — return to the previous page if available, otherwise go to the parent index
      const backBtn = document.getElementById("backBtn");
      backBtn.addEventListener("click", () => {
       
          window.location.href = "../index.html";
        
      });

      // Close on overlay click
      overlay.addEventListener("click", () => {
        sidebar.classList.remove("mobile-open");
      });
    </script>
  </body>
</html>
