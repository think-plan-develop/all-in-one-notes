<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeScript Documentation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex; flex-direction: column; height: 100vh; font-family: "Segoe UI", system-ui, sans-serif;
        color: #1e293b; overflow: hidden; position: relative;
        background: #eef1f8;
      }

      /* ── Ambient color blobs behind everything ── */
      .bg-blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
      .bg-blobs span { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; }
      .bg-blobs .b1 { width: 480px; height: 480px; top: -160px; left: -120px; background: radial-gradient(circle, #3178c6, transparent 70%); }
      .bg-blobs .b2 { width: 460px; height: 460px; top: 10%; left: 60%; background: radial-gradient(circle, #60a5fa, transparent 70%); }
      .bg-blobs .b3 { width: 420px; height: 420px; bottom: -140px; left: 10%; background: radial-gradient(circle, #06b6d4, transparent 70%); }
      .bg-blobs .b4 { width: 400px; height: 400px; bottom: -100px; right: -100px; background: radial-gradient(circle, #6366f1, transparent 70%); }
      .bg-blobs .b5 { width: 360px; height: 360px; top: 40%; left: 28%; background: radial-gradient(circle, #2563eb, transparent 70%); }

      /* Topbar */
      .topbar {
        height: 58px; flex-shrink: 0; position: relative; z-index: 200;
        background: linear-gradient(120deg, rgba(30,58,138,0.92), rgba(49,120,198,0.92) 55%, rgba(6,95,166,0.92));
        backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
        display: flex; align-items: center; gap: 12px; padding: 0 18px;
        box-shadow: 0 4px 24px rgba(30, 41, 59, 0.22); color: #fff;
        border-bottom: 1px solid rgba(255,255,255,0.14);
      }

      .sidebar-toggle {
        width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        border-radius: 9px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.14); color: #fff; cursor: pointer;
        transition: background 0.2s ease, transform 0.15s ease; font-size: 18px;
      }
      .sidebar-toggle:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }

      .topbar-title { display: flex; align-items: center; gap: 10px; }
      .topbar-title i { font-size: 22px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); background: linear-gradient(120deg,#7dd3fc,#fde68a); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .topbar-title span { font-weight: 700; font-size: 17.5px; letter-spacing: .2px; }

      .back-btn {
        display: flex; align-items: center; gap: 6px; padding: 7px 14px; margin-left: 6px;
        border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.14);
        color: #fff; font-size: 13.5px; font-weight: 600; text-decoration: none; cursor: pointer;
        transition: background 0.2s ease, transform 0.15s ease;
      }
      .back-btn:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }
      .back-btn i { font-size: 16px; }

      /* Topbar search box (center) */
      .topbar-search {
        position: relative; flex: 1; max-width: 360px; margin: 0 auto;
        display: flex; align-items: center;
      }
      .topbar-search i.ti-search {
        position: absolute; left: 12px; font-size: 14px; color: #94a3b8; pointer-events: none;
      }
      .topbar-search input {
        width: 100%; padding: 8px 30px 8px 34px; font-size: 13px; font-weight: 500;
        border: 1px solid transparent; border-radius: 20px; outline: none;
        background: #ffffff; color: #1e293b;
        box-shadow: 0 2px 8px rgba(15,23,42,0.18);
        transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .topbar-search input::placeholder { color: #94a3b8; }
      .topbar-search input:focus {
        background: #ffffff; border-color: #3178c6;
        box-shadow: 0 0 0 3px rgba(49,120,198,0.3), 0 2px 8px rgba(15,23,42,0.18);
      }
      .topbar-search .clear-btn {
        position: absolute; right: 8px; display: none; align-items: center; justify-content: center;
        width: 18px; height: 18px; border: none; border-radius: 50%;
        background: #e2e8f0; color: #64748b; cursor: pointer; font-size: 11px;
      }
      .topbar-search .clear-btn:hover { background: #cbd5e1; }
      .topbar-search.has-value .clear-btn { display: flex; }

      @media (max-width: 768px) {
        .topbar-search { max-width: 140px; }
      }

      /* ── Author badge ── */
      .topbar-author {
        margin-left: auto; display: flex; align-items: center; gap: 0; white-space: nowrap;
        border-radius: 20px; overflow: hidden;
        background: #0f172a;
        border: 1px solid rgba(255,255,255,0.15);
        box-shadow: 0 3px 10px rgba(0,0,0,0.25);
      }
      .ed-label {
        display: flex; align-items: center; gap: 5px;
        font-size: 11px; font-weight: 900; letter-spacing: 0.6px; text-transform: uppercase;
        color: #ffffff;
        background: linear-gradient(160deg, #22d3ee 0%, #2563eb 55%, #1e3a8a 100%);
        padding: 7px 10px 7px 12px;
        text-shadow: 0 1px 0 rgba(255,255,255,0.35), 0 -1px 1px rgba(0,0,0,0.45);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.5),
          inset 0 -3px 4px rgba(0,0,0,0.35),
          inset 2px 0 3px rgba(255,255,255,0.15),
          0 2px 3px rgba(0,0,0,0.3);
        position: relative;
      }
      .ed-label i { font-size: 13px; filter: drop-shadow(0 1px 0 rgba(0,0,0,0.4)); }
      .author-name {
        position: relative; padding: 7px 14px 7px 12px;
        font-size: 13.5px; font-weight: 800; letter-spacing: 0.2px;
        background: linear-gradient(90deg, #facc15, #fb7185, #a3e635, #facc15);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 3.5s linear infinite, pulse 2.2s ease-in-out infinite;
        display: inline-block;
      }
      @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

      .main { display: flex; flex: 1; overflow: hidden; position: relative; z-index: 1; }

      /* ── Sidebar ── */
      .sidebar {
        width: 296px; min-width: 296px;
        background: #ffffff;
        border-right: 1px solid rgba(15,23,42,0.08);
        display: flex; flex-direction: column; overflow: hidden;
        transition: width 0.22s ease, min-width 0.22s ease, transform 0.3s ease;
        box-shadow: 8px 0 32px rgba(30, 41, 59, 0.08);
      }
      .main.collapsed .sidebar { width: 0; min-width: 0; border-right: none; box-shadow: none; }

      .sidebar-inner { flex: 1; overflow-y: auto; padding: 16px 12px 24px; scrollbar-width: thin; width: 296px; }
      .sidebar-inner::-webkit-scrollbar { width: 6px; }
      .sidebar-inner::-webkit-scrollbar-thumb { background: linear-gradient(180deg,#60a5fa,#3178c6); border-radius: 10px; }

      /* Search box (in sidebar) */
      .sidebar-search { position: relative; margin: 4px 8px 12px; flex-shrink: 0; }
      .sidebar-search i {
        position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
        font-size: 13px; color: #94a3b8; pointer-events: none;
      }
      .sidebar-search input {
        width: 100%; padding: 7px 28px 7px 30px; font-size: 12.5px; font-weight: 500;
        border: 1px solid #e2e8f0; border-radius: 9px; outline: none; color: #334155;
        background: #f8fafc; transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }
      .sidebar-search input::placeholder { color: #94a3b8; }
      .sidebar-search input:focus {
        border-color: #3178c6; background: #fff; box-shadow: 0 0 0 3px rgba(49,120,198,0.15);
      }
      .sidebar-search .clear-btn {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        width: 18px; height: 18px; display: none; align-items: center; justify-content: center;
        border: none; border-radius: 50%; background: #e2e8f0; color: #64748b; cursor: pointer; font-size: 11px;
      }
      .sidebar-search .clear-btn:hover { background: #cbd5e1; }
      .sidebar-search.has-value .clear-btn { display: flex; }

      .sidebar-section.search-hidden,
      .sidebar-parent-row.search-hidden,
      .sidebar-nested > a.search-hidden,
      .sidebar > .sidebar-inner > a.search-hidden {
        display: none !important;
      }
      mark.search-hit { background: #fde68a; color: inherit; border-radius: 3px; padding: 0 2px; }

      /* Each topic gets its own solid, tinted panel */
      .sidebar-section {
        margin-bottom: 12px; padding: 10px 8px 10px; border-radius: 16px;
        background: var(--sec-tint-a);
        border: 1px solid var(--sec-border);
      }

      .sidebar-group-label {
        display: flex; align-items: center; gap: 8px;
        font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px;
        color: var(--sec-color); padding: 4px 6px 8px;
      }
      .sidebar-group-label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sec-color); flex-shrink: 0; }

      .sidebar a {
        display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 9px; margin-bottom: 3px;
        border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #475569;
        border: 1px solid transparent;
        transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease, transform 0.12s ease, box-shadow 0.16s ease;
      }
      .sidebar a:hover { background: var(--tint-strong); color: var(--c); border-color: var(--tint-strong); }
      .sidebar a.active { background: var(--tint-strong); color: var(--c); font-weight: 700; border-color: var(--c); }

      .nav-icon {
        width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        border-radius: 9px; font-size: 14.5px; color: #fff; background: var(--c);
      }
      .sidebar a:hover .nav-icon, .sidebar a.active .nav-icon { transform: scale(1.1) rotate(-3deg); }

      .sidebar-parent-row { display: flex; align-items: stretch; gap: 4px; margin-bottom: 3px; }
      .sidebar-parent-row a { flex: 1; margin-bottom: 0; }
      .dropdown-toggle {
        width: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        border-radius: 10px; border: 1px solid transparent; background: transparent; color: #64748b;
        cursor: pointer; font-size: 14px; transition: background 0.16s ease, transform 0.2s ease, color 0.16s ease;
      }
      .dropdown-toggle:hover { background: var(--tint-strong); color: var(--c); }
      .dropdown-toggle i { transition: transform 0.2s ease; }
      .dropdown-toggle.open i { transform: rotate(90deg); }

      .sidebar-nested {
        margin: 0 0 4px 18px; padding-left: 10px; border-left: 1px solid var(--sec-border);
        overflow: hidden; max-height: 0; opacity: 0;
        transition: max-height 0.25s ease, opacity 0.2s ease;
      }
      .sidebar-nested.open { max-height: 600px; opacity: 1; }
      .sidebar-nested a { font-size: 13px; padding-left: 8px; }

      /* Important-item badge */
      .imp-badge {
        margin-left: auto; flex-shrink: 0; font-size: 9px; font-weight: 800; letter-spacing: .4px;
        text-transform: uppercase; color: #fff; background: linear-gradient(120deg,#f43f5e,#f97316);
        padding: 2px 7px; border-radius: 999px; box-shadow: 0 1px 4px rgba(244,63,94,0.4);
      }
      .sidebar a.is-important { border-color: #f43f5e33; }
      .sidebar a.is-important:not(:hover):not(.active) { background: #f43f5e0d; }

      /* Mobile Overlay */
      .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35); z-index: 150; }

      iframe { flex: 1; border: none; background: #fff; position: relative; z-index: 1; }

      /* Mobile Styles */
      @media (max-width: 768px) {
        .sidebar {
          position: absolute; left: -296px; height: 100%; z-index: 1000; box-shadow: 10px 0 30px rgba(0,0,0,0.2);
        }
        .sidebar.mobile-open { left: 0; }
        .sidebar.mobile-open + .sidebar-overlay { display: block; }

        .sidebar-inner { padding: 16px 12px 96px; }
        .sidebar-inner::after { content: ""; display: block; height: 24px; }

        .topbar-title span,
        .topbar-author i { display: none !important; }

        .main { justify-content: center; }
        iframe { flex: none; width: 97%; max-width: 97%; margin: 0 auto; }
      }
    </style>
  </head>
  <body>
    <div class="bg-blobs">
      <span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span><span class="b5"></span>
    </div>

    <div class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
        <i class="ti ti-menu-2"></i>
      </button>
      <div class="topbar-title">
        <i class="ti ti-brand-typescript"></i>
        <span>TypeScript Reference</span>
      </div>
      <button class="back-btn" id="backBtn" title="Go back">
        <i class="ti ti-arrow-left"></i>
        Back
      </button>

      <div class="topbar-search" id="topbarSearch">
        <i class="ti ti-search"></i>
        <input type="text" id="topNavSearchInput" placeholder="Search topics..." autocomplete="off" />
        <button type="button" class="clear-btn" id="topNavSearchClear" title="Clear">
          <i class="ti ti-x"></i>
        </button>
      </div>
      
      <div class="topbar-author">
        <span class="ed-label"><i class="ti ti-user"></i>ED</span><span class="author-name">Shivam</span>
      </div>
    </div>

    <div class="main" id="main">
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-search" id="sidebarSearch">
          <i class="ti ti-search"></i>
          <input type="text" id="navSearchInput" placeholder="Search docs..." autocomplete="off" />
          <button type="button" class="clear-btn" id="navSearchClear" title="Clear">
            <i class="ti ti-x"></i>
          </button>
        </div>
        <div class="sidebar-inner" id="sidebarInner"></div>
      </nav>
      <div class="sidebar-overlay" id="sidebarOverlay"></div>
      <iframe name="contentFrame" id="contentFrame" src="1-typescript.html"></iframe>
    </div>

    <script>
      const NAV_CONFIG = [
        {
          label: "TypeScript Learning Path",
          color: "#3178c6",
          links: [
            { icon: "ti-file-code", color: "#3178c6", light: "#60a5fa", text: "1. Fundamentals, Types & Inference", href: "1-typescript.html", important: true },
            { icon: "ti-function", color: "#2563eb", light: "#60a5fa", text: "2. Functions & Objects", href: "2-typescript.html", important: true },
            { icon: "ti-code-dots", color: "#1d4ed8", light: "#3b82f6", text: "3. Generics & Advanced Types", href: "3-typescripts.html", important: true },
            { icon: "ti-tool", color: "#0d9488", light: "#5eead4", text: "4. Classes, Modules & Tooling", href: "4-typescript.html" }
          ]
        }
      ];

      let dropdownId = 0;

      function renderLinks(links, nested = false) {
        return links.map(link => {
          const linkHtml = `
            <a href="${link.href || '#'}" target="contentFrame" class="${link.important ? 'is-important' : ''}" style="--c:${link.color}; --c-light:${link.light}; --tint-strong:${link.color}33;">
              <span class="nav-icon">
                <i class="ti ${link.icon}"></i>
              </span>
              ${link.text}
              ${link.important ? '<span class="imp-badge">Imp</span>' : ''}
            </a>
          `;

          if (link.children) {
            const id = `dd-${dropdownId++}`;
            return `
              <div class="sidebar-parent-row">
                ${linkHtml}
                <button type="button" class="dropdown-toggle open" data-target="${id}" style="--c:${link.color}; --tint-strong:${link.color}33;" title="Toggle">
                  <i class="ti ti-chevron-right"></i>
                </button>
              </div>
              <div class="sidebar-nested open" id="${id}">${renderLinks(link.children, true)}</div>
            `;
          }

          return linkHtml;
        }).join('');
      }

      function buildNav(config) {
        const inner = document.getElementById("sidebarInner");
        inner.innerHTML = config.map(section => `
          <div class="sidebar-section" style="--sec-color:${section.color}; --sec-tint-a:${section.color}22; --sec-tint-b:${section.color}05; --sec-border:${section.color}30;">
            <div class="sidebar-group-label"><span class="dot"></span>${section.label}</div>
            ${renderLinks(section.links)}
          </div>
        `).join('');

        inner.querySelectorAll('a').forEach(link => {
          link.addEventListener("click", () => {
            if (window.innerWidth <= 768) {
              sidebar.classList.remove("mobile-open");
            }
            inner.querySelectorAll("a").forEach(a => a.classList.remove("active"));
            link.classList.add("active");
          });
        });

        inner.querySelectorAll('.dropdown-toggle').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const target = document.getElementById(btn.dataset.target);
            const isOpen = target.classList.toggle('open');
            btn.classList.toggle('open', isOpen);
          });
        });

        const first = inner.querySelector("a");
        if (first) first.classList.add("active");
      }

      buildNav(NAV_CONFIG);

      // ── Sidebar search / filter ──
      const searchWrap = document.getElementById("sidebarSearch");
      const searchInput = document.getElementById("navSearchInput");
      const searchClear = document.getElementById("navSearchClear");
      const sidebarInner = document.getElementById("sidebarInner");

      function clearHighlights(root) {
        root.querySelectorAll("mark.search-hit").forEach(m => {
          m.replaceWith(document.createTextNode(m.textContent));
        });
      }

      function highlightText(a, query) {
        a.childNodes.forEach(node => {
          if (node.nodeType === Node.TEXT_NODE && node.textContent.trim()) {
            const original = node.textContent;
            const idx = original.toLowerCase().indexOf(query);
            if (idx !== -1) {
              const before = original.slice(0, idx);
              const match = original.slice(idx, idx + query.length);
              const after = original.slice(idx + query.length);
              const frag = document.createDocumentFragment();
              frag.appendChild(document.createTextNode(before));
              const mark = document.createElement("mark");
              mark.className = "search-hit";
              mark.textContent = match;
              frag.appendChild(mark);
              frag.appendChild(document.createTextNode(after));
              node.replaceWith(frag);
            }
          }
        });
      }

      function filterNav(rawQuery) {
        const query = rawQuery.trim().toLowerCase();
        searchWrap.classList.toggle("has-value", query.length > 0);

        const allLinks = sidebarInner.querySelectorAll("a");
        clearHighlights(sidebarInner);

        if (!query) {
          allLinks.forEach(a => a.classList.remove("search-hidden"));
          sidebarInner.querySelectorAll(".sidebar-section").forEach(s => s.classList.remove("search-hidden"));
          sidebarInner.querySelectorAll(".sidebar-parent-row").forEach(r => r.classList.remove("search-hidden"));
          return;
        }

        sidebarInner.querySelectorAll(".sidebar-section").forEach(section => {
          let sectionHasMatch = false;

          section.querySelectorAll(":scope > a").forEach(a => {
            const text = a.textContent.toLowerCase();
            const match = text.includes(query);
            a.classList.toggle("search-hidden", !match);
            if (match) { sectionHasMatch = true; highlightText(a, query); }
          });

          section.querySelectorAll(".sidebar-parent-row").forEach(row => {
            const parentLink = row.querySelector("a");
            const nested = row.nextElementSibling;
            const toggle = row.querySelector(".dropdown-toggle");
            const parentMatch = parentLink.textContent.toLowerCase().includes(query);

            let childMatch = false;
            if (nested) {
              nested.querySelectorAll("a").forEach(childA => {
                const cMatch = childA.textContent.toLowerCase().includes(query);
                childA.classList.toggle("search-hidden", !cMatch);
                if (cMatch) { childMatch = true; highlightText(childA, query); }
              });
            }

            const rowMatch = parentMatch || childMatch;
            row.classList.toggle("search-hidden", !rowMatch);
            if (rowMatch) {
              sectionHasMatch = true;
              if (parentMatch) highlightText(parentLink, query);
              if (nested) {
                nested.classList.add("open");
                if (toggle) toggle.classList.add("open");
              }
            }
          });

          section.classList.toggle("search-hidden", !sectionHasMatch);
        });
      }

      searchInput.addEventListener("input", (e) => { filterNav(e.target.value); syncSearchInputs(e.target.value); });
      searchClear.addEventListener("click", () => {
        searchInput.value = "";
        filterNav("");
        searchInput.focus();
      });

      // ── Topbar search — mirrors sidebar search, and reveals sidebar as needed ──
      const topSearchWrap = document.getElementById("topbarSearch");
      const topSearchInput = document.getElementById("topNavSearchInput");
      const topSearchClear = document.getElementById("topNavSearchClear");

      function revealSidebarForSearch() {
        if (window.innerWidth <= 768) {
          sidebar.classList.add("mobile-open");
        } else {
          main.classList.remove("collapsed");
        }
      }

      function syncSearchInputs(value) {
        if (searchInput.value !== value) searchInput.value = value;
        if (topSearchInput.value !== value) topSearchInput.value = value;
        topSearchWrap.classList.toggle("has-value", value.trim().length > 0);
      }

      topSearchInput.addEventListener("input", (e) => {
        const value = e.target.value;
        if (value.trim().length > 0) revealSidebarForSearch();
        syncSearchInputs(value);
        filterNav(value);
      });
      topSearchClear.addEventListener("click", () => {
        syncSearchInputs("");
        filterNav("");
        topSearchInput.focus();
      });

      // Toggle Logic
      const sidebar = document.getElementById("sidebar");
      const main = document.getElementById("main");
      const toggleBtn = document.getElementById("sidebarToggle");
      const overlay = document.getElementById("sidebarOverlay");

      toggleBtn.addEventListener("click", () => {
        if (window.innerWidth <= 768) {
          sidebar.classList.toggle("mobile-open");
        } else {
          main.classList.toggle("collapsed");
        }
      });

      const backBtn = document.getElementById("backBtn");
      backBtn.addEventListener("click", () => {
        window.location.href = "../index.html";
      });

      overlay.addEventListener("click", () => {
        sidebar.classList.remove("mobile-open");
      });
    </script>
  </body>
</html>
