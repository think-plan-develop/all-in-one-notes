<!doctype html>
<html>
  <head>
    <title>Documentation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        height: 100vh;
        font-family: Arial, sans-serif;
      }

      .sidebar {
        width: 240px;
        background: #fff;
        border-right: 1px solid #e8e7e2;
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease;
        overflow: hidden;
      }

      .sidebar-brand {
        padding: 18px 14px 12px;
        border-bottom: 1px solid #e8e7e2;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        color: white;
        text-decoration: none;
        background: #667eea;
        border-radius: 8px;
        padding: 7px 14px;
        margin-bottom: 14px;
        transition: background 0.2s;
      }
      .back-btn:hover {
        background: #764ba2;
      }

      .sidebar-title {
        font-size: 14px;
        font-weight: 700;
        color: #333;
        margin-top: 2px;
      }

      .nav-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .nav-divider {
        height: 1px;
        background: #f0eeea;
        margin: 4px 0;
      }

      /* Each item gets a color class */
      .sidebar a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13.5px;
        border: 1px solid transparent;
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s;
        position: relative;
      }

      .num {
        min-width: 22px;
        height: 22px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          background 0.15s,
          color 0.15s;
      }

      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        margin-left: auto;
        flex-shrink: 0;
        display: none;
      }
      .sidebar a.active .dot {
        display: block;
      }

      /* ── Color themes per item ── */

      /* Purple */
      .c-purple {
        color: #4c35b5;
        background: #eeedfe;
        border-color: #c9c4f5;
        font-weight:bold;
      }
      .c-purple .num {
        background: #c9c4f5;
        color: #2e1e8f;
      }
      .c-purple .dot {
        background: #7f77dd;
      }
      .c-purple:hover {
        background: #dddafc;
        border-color: #afa9ec;
        color: #3b2da0;
      }
      .c-purple.active {
        background: #7f77dd;
        border-color: #534ab7;
        color: #fff;
      }
      .c-purple.active .num {
        background: #534ab7;
        color: #fff;
      }

      /* Teal */
      .c-teal {
        color: #0f6e56;
        background: #e1f5ee;
        border-color: #9fe1cb;
        font-weight:bold;
      }
      .c-teal .num {
        background: #9fe1cb;
        color: #085041;
      }
      .c-teal .dot {
        background: #1d9e75;
      }
      .c-teal:hover {
        background: #c2edd8;
        border-color: #5dcaa5;
        color: #085041;
      }
      .c-teal.active {
        background: #1d9e75;
        border-color: #0f6e56;
        color: #fff;
      }
      .c-teal.active .num {
        background: #0f6e56;
        color: #fff;
      }

      /* Coral */
      .c-coral {
        color: #993c1d;
        background: #faece7;
        border-color: #f5c4b3;
        font-weight:bold;
      }
      .c-coral .num {
        background: #f5c4b3;
        color: #712b13;
      }
      .c-coral .dot {
        background: #d85a30;
      }
      .c-coral:hover {
        background: #f5cfc2;
        border-color: #f0997b;
        color: #712b13;
      }
      .c-coral.active {
        background: #d85a30;
        border-color: #993c1d;
        color: #fff;
      }
      .c-coral.active .num {
        background: #993c1d;
        color: #fff;
      }

      /* Blue */
      .c-blue {
        color: #185fa5;
        background: #e6f1fb;
        border-color: #b5d4f4;
        font-weight:bold;
      }
      .c-blue .num {
        background: #b5d4f4;
        color: #0c447c;
      }
      .c-blue .dot {
        background: #378add;
      }
      .c-blue:hover {
        background: #cce2f8;
        border-color: #85b7eb;
        color: #0c447c;
      }
      .c-blue.active {
        background: #378add;
        border-color: #185fa5;
        color: #fff;
      }
      .c-blue.active .num {
        background: #185fa5;
        color: #fff;
      }

      /* Amber */
      .c-amber {
        color: #854f0b;
        background: #faeeda;
        border-color: #fac775;
        font-weight:bold;
      }
      .c-amber .num {
        background: #fac775;
        color: #633806;
      }
      .c-amber .dot {
        background: #ba7517;
      }
      .c-amber:hover {
        background: #f8dba8;
        border-color: #ef9f27;
        color: #633806;
      }
      .c-amber.active {
        background: #ba7517;
        border-color: #854f0b;
        color: #fff;
      }
      .c-amber.active .num {
        background: #854f0b;
        color: #fff;
      }

      /* Pink */
      .c-pink {
        color: #993556;
        background: #fbeaf0;
        border-color: #f4c0d1;
        font-weight:bold;
      }
      .c-pink .num {
        background: #f4c0d1;
        color: #72243e;
      }
      .c-pink .dot {
        background: #d4537e;
      }
      .c-pink:hover {
        background: #f5cad9;
        border-color: #ed93b1;
        color: #72243e;
      }
      .c-pink.active {
        background: #d4537e;
        border-color: #993556;
        color: #fff;
      }
      .c-pink.active .num {
        background: #993556;
        color: #fff;
      }

      /* Green */
      .c-green {
        color: #3b6d11;
        background: #eaf3de;
        border-color: #c0dd97;
        font-weight:bold;
      }
      .c-green .num {
        background: #c0dd97;
        color: #27500a;
      }
      .c-green .dot {
        background: #639922;
      }
      .c-green:hover {
        background: #d0e8ae;
        border-color: #97c459;
        color: #27500a;
      }
      .c-green.active {
        background: #639922;
        border-color: #3b6d11;
        color: #fff;
      }
      .c-green.active .num {
        background: #3b6d11;
        color: #fff;
      }

      /* Red */
      .c-red {
        color: #a32d2d;
        background: #fcebeb;
        border-color: #f7c1c1;
        font-weight:bold;
      }
      .c-red .num {
        background: #f7c1c1;
        color: #791f1f;
      }
      .c-red .dot {
        background: #e24b4a;
      }
      .c-red:hover {
        background: #f8cece;
        border-color: #f09595;
        color: #791f1f;
      }
      .c-red.active {
        background: #e24b4a;
        border-color: #a32d2d;
        color: #fff;
      }
      .c-red.active .num {
        background: #a32d2d;
        color: #fff;
      }

      /* Gray */
      .c-gray {
        color: #5f5e5a;
        background: #f1efe8;
        border-color: #d3d1c7;
        font-weight:bold;
      }
      .c-gray .num {
        background: #d3d1c7;
        color: #444441;
      }
      .c-gray .dot {
        background: #888780;
      }
      .c-gray:hover {
        background: #e2e0d8;
        border-color: #b4b2a9;
        color: #2c2c2a;
      }
      .c-gray.active {
        background: #888780;
        border-color: #5f5e5a;
        color: #fff;
      }
      .c-gray.active .num {
        background: #5f5e5a;
        color: #fff;
      }

      /* ── Content ── */
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* ── Mobile header ── */
      .header {
        padding: 10px;
        border-bottom: 2px solid #667eea;
        background: #f8f9fa;
        display: none;
        align-items: center;
        gap: 10px;
      }

      .menu-toggle {
        background: #667eea;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background 0.3s ease;
      }
      .menu-toggle:hover {
        background: #764ba2;
      }

      /* ── Mobile ── */
      @media (max-width: 768px) {
        body {
          flex-direction: column;
        }
        .header {
          display: flex;
        }

        .sidebar {
          position: absolute;
          left: 0;
          top: 52px;
          height: calc(100vh - 52px);
          z-index: 1000;
          transform: translateX(-100%);
          box-shadow: 3px 0 12px rgba(0, 0, 0, 0.1);
        }
        .sidebar.active {
          transform: translateX(0);
        }
        .content {
          height: calc(100vh - 52px);
        }
      }
    </style>
  </head>
  <body>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <a href="../index.html" class="back-btn">← Dashboard</a>
        <div class="sidebar-title">📚 Node.js Topics</div>
      </div>

      <nav class="nav-list">
        <a
          href="1-node-ts-setup.html"
          target="contentFrame"
          class="menu-link c-blue active"
        >
          <span class="num">1</span> Node-TS Setup <span class="dot"></span>
        </a>
        <a
          href="2-node-mongo-setup.html"
          target="contentFrame"
          class="menu-link c-blue"
        >
          <span class="num">2</span> Node.js Mongo Setup
          <span class="dot"></span>
        </a>
        <a
          href="3-mongodb-schema-advance.html"
          target="contentFrame"
          class="menu-link c-blue"
        >
          <span class="num">3</span> Mongo Schema Advance
          <span class="dot"></span>
        </a>

        <div class="nav-divider"></div>

        <a
          href="4-ts-interfaces-advance.html"
          target="contentFrame"
          class="menu-link c-amber"
        >
          <span class="num">4</span> TypeScript of Schema
          <span class="dot"></span>
        </a>
        <a
          href="5-typescript-Q&A.html"
          target="contentFrame"
          class="menu-link c-amber"
        >
          <span class="num">5</span> TypeScript Q&A <span class="dot"></span>
        </a>

        <div class="nav-divider"></div>

        <a
          href="6-validation-handling.html"
          target="contentFrame"
          class="menu-link c-teal"
        >
          <span class="num">6</span> Validation Handling
          <span class="dot"></span>
        </a>
        <a
          href="7-error-handling.html"
          target="contentFrame"
          class="menu-link c-teal"
        >
          <span class="num">7</span> Error Handling <span class="dot"></span>
        </a>

        <div class="nav-divider"></div>

        <a
          href="8-Mongose-Q&A.html"
          target="contentFrame"
          class="menu-link c-red"
        >
          <span class="num">8</span> Mongo Q&A <span class="dot"></span>
        </a>
        <a
          href="9-Mongo-Indexex.html"
          target="contentFrame"
          class="menu-link c-red"
        >
          <span class="num">9</span> Mongo Index Q&A <span class="dot"></span>
        </a>
      </nav>
    </div>

    <div class="content">
      <div class="header">
        <button class="menu-toggle" id="menuToggle">☰ Menu</button>
        <h3 style="margin: 0; font-size: 15px; color: #333">
          Node.js Documentation
        </h3>
      </div>
      <iframe name="contentFrame" src="1-node-ts-setup.html"></iframe>
    </div>

    <script>
      const menuToggle = document.getElementById("menuToggle");
      const sidebar = document.getElementById("sidebar");

      menuToggle.addEventListener("click", () =>
        sidebar.classList.toggle("active"),
      );

      document.querySelectorAll(".menu-link").forEach((link) => {
        link.addEventListener("click", () => {
          document
            .querySelectorAll(".menu-link")
            .forEach((l) => l.classList.remove("active"));
          link.classList.add("active");
          if (window.innerWidth <= 768) sidebar.classList.remove("active");
        });
      });

      document.addEventListener("click", (e) => {
        if (
          window.innerWidth <= 768 &&
          !sidebar.contains(e.target) &&
          !menuToggle.contains(e.target)
        ) {
          sidebar.classList.remove("active");
        }
      });
    </script>
  </body>
</html>
