<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Link</title>
<style>
  :root {
    --violet: #6D28D9;
    --pink: #EC4899;
    --orange: #F59E0B;
    --ink: #1A1523;
    --paper: #FFF9F0;
    --card: #FFFFFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(109,40,217,0.18) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(236,72,153,0.18) 0%, transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(245,158,11,0.15) 0%, transparent 35%);
    padding: 24px;
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 40px 48px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(109,40,217,0.15), 0 4px 12px rgba(0,0,0,0.06);
    border: 1px solid rgba(109,40,217,0.08);
    animation: rise 0.6s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .icon-wrap {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--violet), var(--pink));
    box-shadow: 0 10px 24px rgba(236,72,153,0.35);
  }

  .icon-wrap svg {
    width: 40px;
    height: 40px;
    fill: #fff;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  p.sub {
    margin: 0 0 28px;
    color: #6B6473;
    font-size: 14px;
  }

  .link-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--violet), var(--pink) 60%, var(--orange));
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    word-break: break-all;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 20px rgba(109,40,217,0.3);
  }

  .link-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(109,40,217,0.4);
  }

  .link-btn svg {
    width: 20px;
    height: 20px;
    fill: #fff;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38

        .64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
        .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
        0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </div>
    <h1>Find the code</h1>
    <p class="sub">The full source lives on GitHub</p>
    <a class="link-btn" href="https://github.com/think-plan-develop/logger" target="_blank" rel="noopener">

        .64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
        .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
        0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>

  </div>
</body>
</html>
