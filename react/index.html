<!DOCTYPE html>
<html>
<head>
    <title>React Documentation</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            display:flex;
            height:100vh;
            font-family:Arial;
        }

        .sidebar{
            width:250px;
            overflow-y:auto;
            border-right:1px solid #ccc;
            padding:10px;
            transition: transform 0.3s ease;
        }

        .sidebar a{
            display:block;
            padding:10px;
            text-decoration:none;
            color:black;
            border-radius:5px;
        }

        .sidebar a:hover{
            background:#f2f2f2;
        }

        .content{
            flex:1;
            display:flex;
            flex-direction:column;
        }

        iframe{
            width:100%;
            height:100%;
            border:none;
        }

        .header {
            padding: 10px;
            border-bottom: 2px solid #61dafb;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: #61dafb;
            color: black;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #4fa8c5;
            color: white;
        }

        .menu-toggle {
            display: none;
            background: #61dafb;
            color: black;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        .menu-toggle:hover {
            background: #4fa8c5;
            color: white;
        }

        h3 {
            margin-top: 15px;
            color: #333;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                position: absolute;
                left: 0;
                top: 60px;
                height: calc(100vh - 60px);
                width: 250px;
                background: white;
                z-index: 1000;
                transform: translateX(-100%);
                box-shadow: 2px 0 5px rgba(0,0,0,0.2);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .content {
                width: 100%;
                height: calc(100vh - 60px);
            }

            .menu-toggle {
                display: block;
            }

            .header {
                flex-wrap: wrap;
            }
        }

          .sidebar {
    width: 280px;
    height: 100vh;
    position: sticky;
    top: 0;
    background: linear-gradient(180deg,#312e81 0%,#3730a3 45%,#4338ca 100%);
    display: flex;
    flex-direction: column;
    box-shadow: 4px 0 24px rgba(49,46,129,0.25);
    overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
 
 .sidebar .header {
    padding: 22px 20px 20px;
    background: rgba(0,0,0,0.12);

  .back-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    transition: all .2s cubic-bezier(.4,0,.2,1);
  }
  .back-btn .icon {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 9px;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
    transition: all .2s ease;
  }
  .back-btn .text {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }
  .back-btn .eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(224,231,255,0.55);
    transition: color .2s ease;
  }
  .back-btn .title {
    font-size: 13.5px;
    font-weight: 800;
    color: #fff;
    transition: color .2s ease;
  }
  .back-btn:hover {
    background: #fff;
    border-color: #fff;
    transform: translateX(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }
  .back-btn:hover .icon {
    background: linear-gradient(120deg,#6366f1,#8b5cf6);
    color: #fff;
    transform: translateX(-2px);
  }
  .back-btn:hover .eyebrow { color: #818cf8; }
  .back-btn:hover .title { color: #3730a3; }
 
 
  .sidebar-title {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.3px;
    padding: 20px 20px 14px;
  }
  .sidebar-title .emoji {
    width: 36px; height: 36px;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
    font-size: 18px;
    flex-shrink: 0;
  }
 
  .nav-list {
    list-style: none;
    padding: 4px 14px 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
 
  .nav-list a {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: #e0e7ff;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 14px;
    border-radius: 10px;
    position: relative;
    transition: all .18s ease;
    border: 1px solid transparent;
  }
 
  .nav-list a .num {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    color: #c7d2fe;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .18s ease;
  }
 
  .nav-list a .label {
    flex: 1;
    line-height: 1.35;
  }
 
  .nav-list a:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
    transform: translateX(3px);
  }
  .nav-list a:hover .num {
    background: rgba(255,255,255,0.2);
    color: #fff;
  }
 
  .nav-list a.active {
    background: #fff;
    color: #3730a3;
    box-shadow: 0 6px 16px rgba(0,0,0,0.18);
  }
  .nav-list a.active .num {
    background: linear-gradient(120deg,#6366f1,#8b5cf6);
    color: #fff;
  }
  .nav-list a.active::before {
    content: '';
    position: absolute;
    left: -14px;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 60%;
    background: #f59e0b;
    border-radius: 4px;
  }
 
  .nav-divider {
    height: 1px;
    background: rgba(255,255,255,0.1);
    margin: 10px 6px;
  }
 
  .section-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(199,210,254,0.6);

  .main p { font-size: 15px; line-height: 1.7; max-width: 560px; color:#555; }
 
  @media (max-width: 900px) {
    .sidebar { width: 240px; }
  }

<div class="content">
    <div class="header">
        <button class="menu-toggle" id="menuToggle">☰ Menu</button>
        <h3 style="margin: 0;">React Documentation</h3>
    </div>
    <iframe
        name="contentFrame"
        src="1-react-introduction.html">
    </iframe>
</div>

<script>
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');

    // Toggle sidebar on mobile
    menuToggle.addEventListener('click', () => {
        sidebar.classList.toggle('active');
    });

    // Close sidebar when a link is clicked
    const sidebarLinks = sidebar.querySelectorAll('a[target="contentFrame"]');
    sidebarLinks.forEach(link => {
        link.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                sidebar.classList.remove('active');
            }
        });
    });

    // Close sidebar when clicking outside on mobile
    document.addEventListener('click', (e) => {
        if (window.innerWidth <= 768) {
            if (!sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                sidebar.classList.remove('active');
            }
        }
    });
</script>
